<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <title>管理後台 - SELA 樂透一路發</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --sela-orange: #F26522;
            --bg-primary: #FFF8F4;
            --bg-card: #FFFFFF;
            --text-primary: #2D2420;
            --text-secondary: #8B7355;
            --border-color: rgba(242, 101, 34, 0.12);
            --shadow-sm: 0 2px 8px rgba(242, 101, 34, 0.08);
        }
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 40px;
        }
        .header {
            background: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo { width: 36px; height: 36px; border-radius: 8px; }
        .brand { font-size: 18px; font-weight: 700; color: var(--sela-orange); }
        .back-btn {
            color: var(--sela-orange);
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border: 1px solid var(--sela-orange);
            border-radius: 8px;
        }
        .main { padding: 20px; max-width: 1000px; margin: 0 auto; }
        
        /* 統計卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        @media (min-width: 600px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--sela-orange);
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        /* 區塊 */
        .section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 快捷功能 */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (min-width: 600px) {
            .quick-actions { grid-template-columns: repeat(4, 1fr); }
        }
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px;
            background: var(--bg-primary);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s;
        }
        .action-btn:hover { background: #FFE8DB; }
        .action-icon { font-size: 28px; }
        .action-label { font-size: 13px; font-weight: 500; }
        
        /* 列表項目 */
        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .list-item:last-child { border-bottom: none; }
        .item-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--sela-orange), #ff8a50);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
            overflow: hidden;
        }
        .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-weight: 600; font-size: 14px; }
        .item-meta { font-size: 12px; color: var(--text-secondary); }
        .item-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-admin { background: #DCFCE7; color: #16A34A; }
        .badge-user { background: #E3F2FD; color: #2196F3; }
        .badge-active { background: #DCFCE7; color: #16A34A; }
        .badge-closed { background: #F3F4F6; color: #6B7280; }
        
        .loading-text { text-align: center; padding: 20px; color: var(--text-secondary); }
        .error-text { text-align: center; padding: 20px; color: #DC2626; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="/static/logo.jpg" alt="SELA" class="logo">
            <span class="brand">管理後台</span>
        </div>
        <a href="/dashboard" class="back-btn">← 返回</a>
    </header>
    
    <main class="main">
        <!-- 統計卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-users">-</div>
                <div class="stat-label">總用戶數</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-series">-</div>
                <div class="stat-label">系列團數</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-invested">-</div>
                <div class="stat-label">總投資額</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-prize">-</div>
                <div class="stat-label">總獎金</div>
            </div>
        </div>
        
        <!-- 快捷功能 -->
        <div class="section">
            <h2 class="section-title">⚡ 快捷功能</h2>
            <div class="quick-actions">
                <a href="/admin/lottery" class="action-btn">
                    <span class="action-icon">🎰</span>
                    <span class="action-label">開獎同步</span>
                </a>
                <a href="/statistics" class="action-btn">
                    <span class="action-icon">📊</span>
                    <span class="action-label">統計分析</span>
                </a>
                <a href="/series" class="action-btn">
                    <span class="action-icon">👥</span>
                    <span class="action-label">系列團管理</span>
                </a>
                <a href="/settings" class="action-btn">
                    <span class="action-icon">⚙️</span>
                    <span class="action-label">系統設定</span>
                </a>
            </div>
        </div>
        
        <!-- 用戶列表 -->
        <div class="section">
            <h2 class="section-title">👤 最近用戶</h2>
            <div id="user-list"><div class="loading-text">載入中...</div></div>
        </div>
        
        <!-- 系列團列表 -->
        <div class="section">
            <h2 class="section-title">📋 系列團</h2>
            <div id="series-list"><div class="loading-text">載入中...</div></div>
        </div>
    </main>
    
    <script>
        // ==================== 工具函數 ====================
        const API_BASE = '/api/v1';
        
        function getToken() {
            try {
                return localStorage.getItem('access_token');
            } catch (e) {
                console.error('localStorage 錯誤:', e);
                return null;
            }
        }
        
        async function api(url) {
            const token = getToken();
            console.log('[API] 呼叫:', url, 'Token:', token ? '有' : '無');
            
            if (!token) {
                throw new Error('未登入');
            }
            
            const response = await fetch(API_BASE + url, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            
            console.log('[API] 回應狀態:', response.status);
            
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.detail || 'API 錯誤: ' + response.status);
            }
            
            return response.json();
        }
        
        function formatMoney(amount) {
            const num = Number(amount) || 0;
            if (num >= 100000000) {
                return '$' + (num / 100000000).toFixed(1) + '億';
            } else if (num >= 10000) {
                return '$' + (num / 10000).toFixed(1) + '萬';
            }
            return '$' + num.toLocaleString();
        }
        
        // ==================== 載入函數 ====================
        async function loadStats() {
            console.log('[Admin] 載入統計...');
            try {
                const stats = await api('/admin/stats');
                console.log('[Admin] 統計資料:', stats);
                
                document.getElementById('total-users').textContent = stats.total_users ?? 0;
                document.getElementById('total-series').textContent = stats.total_series ?? 0;
                document.getElementById('total-invested').textContent = formatMoney(stats.total_pool);
                document.getElementById('total-prize').textContent = formatMoney(stats.total_prize);
                
                console.log('[Admin] 統計顯示完成');
            } catch (e) {
                console.error('[Admin] 載入統計失敗:', e);
                document.getElementById('total-users').textContent = 'E';
                document.getElementById('total-series').textContent = 'E';
                document.getElementById('total-invested').textContent = 'E';
                document.getElementById('total-prize').textContent = 'E';
            }
        }
        
        async function loadUsers() {
            console.log('[Admin] 載入用戶...');
            const container = document.getElementById('user-list');
            try {
                const users = await api('/admin/users?limit=10');
                console.log('[Admin] 用戶資料:', users);
                
                if (!users || users.length === 0) {
                    container.innerHTML = '<div class="loading-text">暫無用戶</div>';
                    return;
                }
                
                container.innerHTML = users.map(u => `
                    <div class="list-item">
                        <div class="item-avatar">
                            ${u.picture_url 
                                ? `<img src="${u.picture_url}" alt="">` 
                                : (u.display_name || '?')[0]}
                        </div>
                        <div class="item-info">
                            <div class="item-name">${u.nickname || u.display_name}</div>
                            <div class="item-meta">ID: ${u.id} | 參與 ${u.series_count || 0} 個系列團</div>
                        </div>
                        <span class="item-badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">
                            ${u.role === 'admin' ? '管理員' : '會員'}
                        </span>
                    </div>
                `).join('');
            } catch (e) {
                console.error('[Admin] 載入用戶失敗:', e);
                container.innerHTML = '<div class="error-text">載入失敗: ' + e.message + '</div>';
            }
        }
        
        async function loadSeries() {
            console.log('[Admin] 載入系列團...');
            const container = document.getElementById('series-list');
            try {
                const series = await api('/admin/series?limit=10');
                console.log('[Admin] 系列團資料:', series);
                
                if (!series || series.length === 0) {
                    container.innerHTML = '<div class="loading-text">暫無系列團</div>';
                    return;
                }
                
                container.innerHTML = series.map(s => `
                    <div class="list-item">
                        <div class="item-avatar">📋</div>
                        <div class="item-info">
                            <div class="item-name">${s.name}</div>
                            <div class="item-meta">${s.member_count} 人 | ${s.total_periods} 期 | ${formatMoney(s.current_pool)}</div>
                        </div>
                        <span class="item-badge ${s.status === 'active' ? 'badge-active' : 'badge-closed'}">
                            ${s.status === 'active' ? '進行中' : '已結束'}
                        </span>
                    </div>
                `).join('');
            } catch (e) {
                console.error('[Admin] 載入系列團失敗:', e);
                container.innerHTML = '<div class="error-text">載入失敗: ' + e.message + '</div>';
            }
        }
        
        // ==================== 主程式 ====================
        async function init() {
            console.log('[Admin] 頁面初始化...');
            
            // 檢查登入狀態
            const token = getToken();
            if (!token) {
                console.log('[Admin] 未登入，跳轉首頁');
                window.location.href = '/';
                return;
            }
            
            // 檢查管理員權限
            try {
                const user = await api('/users/me');
                console.log('[Admin] 當前用戶:', user);
                
                if (user.role !== 'admin') {
                    alert('需要管理員權限');
                    window.location.href = '/dashboard';
                    return;
                }
            } catch (e) {
                console.error('[Admin] 權限檢查失敗:', e);
                alert('驗證失敗，請重新登入');
                window.location.href = '/';
                return;
            }
            
            // 載入資料（並行執行）
            await Promise.all([
                loadStats(),
                loadUsers(),
                loadSeries()
            ]);
            
            console.log('[Admin] 初始化完成');
        }
        
        // 頁面載入後執行
        init();
    </script>
</body>
</html>
