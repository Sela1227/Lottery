<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台 - SELA 樂透一路發</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        /* 管理後台專用樣式 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--sela-orange);
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 20px;
            background: linear-gradient(135deg, #8B5CF6, #7C3AED);
            border-radius: 16px;
            color: white;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .action-btn:hover { transform: translateY(-2px); }
        .action-btn.green { background: linear-gradient(135deg, #10B981, #059669); }
        .action-btn.blue { background: linear-gradient(135deg, #3B82F6, #2563EB); }
        .action-icon { font-size: 32px; }
        .action-label { font-size: 14px; font-weight: 500; }
        .user-list { display: flex; flex-direction: column; gap: 12px; }
        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 12px;
        }
        .user-avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: var(--sela-orange);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            overflow: hidden;
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info { flex: 1; }
        .user-name { font-weight: 600; }
        .user-role { font-size: 12px; color: var(--text-secondary); }
        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .role-admin { background: rgba(139, 92, 246, 0.1); color: #8B5CF6; }
        .role-user { background: rgba(107, 114, 128, 0.1); color: #6B7280; }
        .loading { text-align: center; color: var(--text-secondary); padding: 20px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="/dashboard" class="back-btn">←</a>
            <span class="header-title">🔧 管理後台</span>
        </div>
    </header>
    
    <main class="main">
        <!-- 統計卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-users">-</div>
                <div class="stat-label">總用戶數</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-series">-</div>
                <div class="stat-label">系列團數</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-invested">-</div>
                <div class="stat-label">總投資額</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-prize">-</div>
                <div class="stat-label">總獎金</div>
            </div>
        </div>
        
        <!-- 快捷功能 -->
        <div class="section">
            <h2 class="section-title">⚡ 快捷功能</h2>
            <div class="quick-actions">
                <a href="/admin/lottery" class="action-btn">
                    <span class="action-icon">🎰</span>
                    <span class="action-label">開獎資訊同步</span>
                </a>
                <a href="#" class="action-btn green" onclick="showToast('功能開發中', 'info'); return false;">
                    <span class="action-icon">📢</span>
                    <span class="action-label">發送公告</span>
                </a>
                <a href="/statistics" class="action-btn blue">
                    <span class="action-icon">📊</span>
                    <span class="action-label">系統報表</span>
                </a>
            </div>
        </div>
        
        <!-- 用戶管理 -->
        <div class="section">
            <h2 class="section-title">👥 用戶管理</h2>
            <div class="user-list" id="user-list">
                <div class="loading">載入中...</div>
            </div>
        </div>
        
        <!-- 系列團管理 -->
        <div class="section">
            <h2 class="section-title">📋 系列團管理</h2>
            <div class="user-list" id="series-list">
                <div class="loading">載入中...</div>
            </div>
        </div>
    </main>
    
    <div class="toast" id="toast"></div>
    
    <script src="/static/js/common.js"></script>
    <script>
        async function checkAdminAuth() {
            // 先檢查 token 是否存在
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = '/';
                return null;
            }
            
            // 獲取用戶資訊並檢查管理員權限
            try {
                const user = await apiGet('/users/me');
                if (!user || user.role !== 'admin') {
                    showToast('需要管理員權限', 'error');
                    setTimeout(() => window.location.href = '/dashboard', 1500);
                    return null;
                }
                return user;
            } catch (e) {
                window.location.href = '/';
                return null;
            }
        }
        
        async function loadDashboard() {
            const user = await checkAdminAuth();
            if (!user) return;
            
            // 載入統計
            try {
                const stats = await apiGet('/admin/stats');
                $('total-users').textContent = stats.total_users || 0;
                $('total-series').textContent = stats.total_series || 0;
                $('total-invested').textContent = formatMoney(stats.total_pool || 0);
                $('total-prize').textContent = formatMoney(stats.total_prize || 0);
            } catch (e) {
                console.error('載入統計失敗', e);
            }
            
            // 載入用戶列表
            try {
                const users = await apiGet('/admin/users?limit=10');
                renderUserList(users);
            } catch (e) {
                $('user-list').innerHTML = '<div class="loading">載入失敗</div>';
            }
            
            // 載入系列團列表
            try {
                const series = await apiGet('/admin/series?limit=10');
                renderSeriesList(series);
            } catch (e) {
                $('series-list').innerHTML = '<div class="loading">載入失敗</div>';
            }
        }
        
        function renderUserList(users) {
            const container = $('user-list');
            if (!users || users.length === 0) {
                container.innerHTML = '<div class="loading">暫無用戶</div>';
                return;
            }
            container.innerHTML = users.map(user => `
                <div class="user-item">
                    <div class="user-avatar">
                        ${user.picture_url 
                            ? `<img src="${user.picture_url}" alt="">`
                            : (user.display_name || '?').charAt(0)}
                    </div>
                    <div class="user-info">
                        <div class="user-name">${user.nickname || user.display_name}</div>
                        <div class="user-role">ID: ${user.id} | 參與 ${user.series_count || 0} 個系列團</div>
                    </div>
                    <span class="role-badge ${user.role === 'admin' ? 'role-admin' : 'role-user'}">
                        ${user.role === 'admin' ? '管理員' : '會員'}
                    </span>
                </div>
            `).join('');
        }
        
        function renderSeriesList(series) {
            const container = $('series-list');
            if (!series || series.length === 0) {
                container.innerHTML = '<div class="loading">暫無系列團</div>';
                return;
            }
            container.innerHTML = series.map(s => `
                <div class="user-item">
                    <div class="user-avatar">📋</div>
                    <div class="user-info">
                        <div class="user-name">${s.name}</div>
                        <div class="user-role">
                            ${s.member_count} 人 | 
                            ${s.total_periods} 期 | 
                            累計 ${formatMoney(s.total_invested || 0)}
                        </div>
                    </div>
                    <span class="role-badge ${s.status === 'active' ? 'role-admin' : 'role-user'}">
                        ${s.status === 'active' ? '進行中' : '已結束'}
                    </span>
                </div>
            `).join('');
        }
        
        // 確保 common.js 載入完成後再執行
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadDashboard);
        } else {
            loadDashboard();
        }
    </script>
</body>
</html>
