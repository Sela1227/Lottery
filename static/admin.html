<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台 - SELA 樂透一路發</title>
    <style>
        :root {
            --sela-orange: #F26522;
            --sela-orange-light: #FF8A50;
            --bg-primary: #FFFAF5;
            --bg-secondary: #FFF5EE;
            --text-primary: #2D2D2D;
            --text-secondary: #666666;
            --border-color: #FFE4D6;
            --success: #4CAF50;
            --warning: #FF9800;
            --danger: #F44336;
            --info: #2196F3;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-light));
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 20px;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        /* Main */
        .main {
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        @media (min-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--sela-orange);
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        /* Section */
        .section {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        @media (min-width: 768px) {
            .menu-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-primary);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .menu-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(242, 101, 34, 0.2);
        }
        
        .menu-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .menu-label {
            font-size: 14px;
            font-weight: 500;
        }
        
        .menu-item.highlight {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }
        
        .menu-item.lottery {
            background: linear-gradient(135deg, #9C27B0, #7B1FA2);
            color: white;
        }
        
        /* User List */
        .user-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--sela-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        
        .user-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .user-info {
            flex: 1;
        }
        
        .user-name {
            font-weight: 500;
        }
        
        .user-role {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .role-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .role-admin {
            background: #FFE0B2;
            color: #E65100;
        }
        
        .role-user {
            background: #E3F2FD;
            color: #1565C0;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .toast.success {
            background: var(--success);
        }
        
        .toast.error {
            background: var(--danger);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="/dashboard" class="back-btn">←</a>
            <h1 class="header-title">🔧 管理後台</h1>
        </div>
    </header>
    
    <main class="main">
        <!-- 統計概覽 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-users">-</div>
                <div class="stat-label">總用戶數</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-series">-</div>
                <div class="stat-label">系列團數</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-invested">-</div>
                <div class="stat-label">總投資額</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-prize">-</div>
                <div class="stat-label">總獎金</div>
            </div>
        </div>
        
        <!-- 快捷功能 -->
        <div class="section">
            <h2 class="section-title">⚡ 快捷功能</h2>
            <div class="menu-grid">
                <a href="/admin/lottery" class="menu-item lottery">
                    <span class="menu-icon">🎰</span>
                    <span class="menu-label">開獎資訊同步</span>
                </a>
                <a href="#" class="menu-item" onclick="showToast('即將開放', 'info'); return false;">
                    <span class="menu-icon">📢</span>
                    <span class="menu-label">發送公告</span>
                </a>
                <a href="#" class="menu-item" onclick="showToast('即將開放', 'info'); return false;">
                    <span class="menu-icon">📊</span>
                    <span class="menu-label">系統報表</span>
                </a>
            </div>
        </div>
        
        <!-- 用戶管理 -->
        <div class="section">
            <h2 class="section-title">👥 用戶管理</h2>
            <div class="user-list" id="user-list">
                <div class="loading">載入中...</div>
            </div>
        </div>
        
        <!-- 系列團管理 -->
        <div class="section">
            <h2 class="section-title">📋 系列團管理</h2>
            <div class="user-list" id="series-list">
                <div class="loading">載入中...</div>
            </div>
        </div>
    </main>
    
    <!-- Toast -->
    <div class="toast" id="toast"></div>
    
    <script>
        const API_BASE = '/api/v1';
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        async function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = '/';
                return null;
            }
            
            try {
                const response = await fetch(`${API_BASE}/users/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Unauthorized');
                
                const user = await response.json();
                if (user.role !== 'admin') {
                    showToast('需要管理員權限', 'error');
                    setTimeout(() => window.location.href = '/dashboard', 1500);
                    return null;
                }
                
                return token;
            } catch (error) {
                localStorage.removeItem('access_token');
                window.location.href = '/';
                return null;
            }
        }
        
        async function loadDashboard() {
            const token = await checkAuth();
            if (!token) return;
            
            // 載入統計
            try {
                const statsRes = await fetch(`${API_BASE}/admin/dashboard`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (statsRes.ok) {
                    const stats = await statsRes.json();
                    document.getElementById('total-users').textContent = stats.total_users || 0;
                    document.getElementById('total-series').textContent = stats.total_series || 0;
                    document.getElementById('total-invested').textContent = formatMoney(stats.total_invested || 0);
                    document.getElementById('total-prize').textContent = formatMoney(stats.total_prize || 0);
                }
            } catch (e) {
                console.error('載入統計失敗', e);
            }
            
            // 載入用戶列表
            try {
                const usersRes = await fetch(`${API_BASE}/admin/users?limit=10`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (usersRes.ok) {
                    const users = await usersRes.json();
                    renderUserList(users);
                }
            } catch (e) {
                document.getElementById('user-list').innerHTML = '<div class="loading">載入失敗</div>';
            }
            
            // 載入系列團列表
            try {
                const seriesRes = await fetch(`${API_BASE}/admin/series?limit=10`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (seriesRes.ok) {
                    const series = await seriesRes.json();
                    renderSeriesList(series);
                }
            } catch (e) {
                document.getElementById('series-list').innerHTML = '<div class="loading">載入失敗</div>';
            }
            
            // 🔄 自動同步開獎資料（每天一次）
            autoSyncLottery(token);
        }
        
        // 自動同步開獎資料
        async function autoSyncLottery(token) {
            const lastSync = localStorage.getItem('lottery_last_sync');
            const today = new Date().toDateString();
            
            // 今天已經同步過就跳過
            if (lastSync === today) {
                console.log('📅 今日已同步過開獎資料');
                return;
            }
            
            try {
                console.log('🔄 自動同步開獎資料...');
                const response = await fetch(`${API_BASE}/lottery/sync`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    localStorage.setItem('lottery_last_sync', today);
                    console.log('✅ 自動同步完成:', result.message);
                }
            } catch (e) {
                console.warn('⚠️ 自動同步失敗:', e);
            }
        }
        
        function formatMoney(amount) {
            if (amount >= 10000) {
                return (amount / 10000).toFixed(1) + '萬';
            }
            return amount.toLocaleString();
        }
        
        function renderUserList(users) {
            const container = document.getElementById('user-list');
            
            if (!users || users.length === 0) {
                container.innerHTML = '<div class="loading">暫無用戶</div>';
                return;
            }
            
            container.innerHTML = users.map(user => `
                <div class="user-item">
                    <div class="user-avatar">
                        ${user.picture_url 
                            ? `<img src="${user.picture_url}" alt="">` 
                            : (user.display_name || '?').charAt(0)}
                    </div>
                    <div class="user-info">
                        <div class="user-name">${user.nickname || user.display_name}</div>
                        <div class="user-role">ID: ${user.id} | 參與 ${user.series_count || 0} 個系列團</div>
                    </div>
                    <span class="role-badge ${user.role === 'admin' ? 'role-admin' : 'role-user'}">
                        ${user.role === 'admin' ? '管理員' : '會員'}
                    </span>
                </div>
            `).join('');
        }
        
        function renderSeriesList(series) {
            const container = document.getElementById('series-list');
            
            if (!series || series.length === 0) {
                container.innerHTML = '<div class="loading">暫無系列團</div>';
                return;
            }
            
            container.innerHTML = series.map(s => `
                <div class="user-item">
                    <div class="user-avatar">📋</div>
                    <div class="user-info">
                        <div class="user-name">${s.name}</div>
                        <div class="user-role">
                            ${s.member_count} 人 | 
                            ${s.total_periods} 期 | 
                            累計 ${formatMoney(s.total_invested || 0)}
                        </div>
                    </div>
                    <span class="role-badge ${s.status === 'active' ? 'role-admin' : 'role-user'}">
                        ${s.status === 'active' ? '進行中' : '已結束'}
                    </span>
                </div>
            `).join('');
        }
        
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
