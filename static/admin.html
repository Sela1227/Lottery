<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <title>管理後台 - SELA 樂透一路發</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <style>
        :root {
            --sela-orange: #F26522;
            --sela-orange-dark: #D85A1E;
            --bg-primary: #FFF8F4;
            --bg-secondary: #FFF0E8;
            --bg-card: #FFFFFF;
            --text-primary: #2D2420;
            --text-secondary: #8B7355;
            --border-color: rgba(242, 101, 34, 0.12);
            --success: #16A34A;
            --danger: #DC2626;
            --warning: #F59E0B;
            --info: #2196F3;
            --shadow-md: 0 4px 16px rgba(242, 101, 34, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary); 
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 40px;
        }
        
        /* ===== Header 統一樣式（返回鍵右上角）===== */
        .header {
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark));
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }
        .header .brand {
            color: white;
            font-size: 18px;
            font-weight: 700;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        /* ===== Main ===== */
        .main {
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* 統計卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        @media (min-width: 600px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .stat-icon { font-size: 24px; margin-bottom: 6px; }
        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--sela-orange);
            margin-bottom: 2px;
        }
        .stat-label { font-size: 11px; color: var(--text-secondary); }
        
        /* 快捷操作 */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 14px;
        }
        .action-btn:hover { background: var(--bg-secondary); }
        .action-btn .icon { font-size: 20px; }
        
        /* Section */
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .section-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title { font-size: 15px; font-weight: 700; }
        .section-action {
            color: var(--sela-orange);
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            overflow-x: auto;
        }
        .tab {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            min-width: 80px;
        }
        .tab.active { color: var(--sela-orange); background: var(--bg-card); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* List Items */
        .list-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-item:last-child { border-bottom: none; }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-detail { font-size: 12px; color: var(--text-secondary); }
        .item-actions { display: flex; gap: 8px; }
        .item-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-admin { background: #FEE2E2; color: #DC2626; }
        .badge-user { background: #E5E7EB; color: #6B7280; }
        .badge-active { background: #DCFCE7; color: #16A34A; }
        .badge-closed { background: #F3F4F6; color: #6B7280; }
        
        /* Action Buttons */
        .btn-sm {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-primary { background: var(--sela-orange); color: white; }
        .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); }
        .btn-danger { background: #FEE2E2; color: #DC2626; }
        
        /* Empty & Loading */
        .empty-state { padding: 30px; text-align: center; color: var(--text-secondary); }
        .empty-icon { font-size: 36px; margin-bottom: 10px; }
        .loading { display: flex; justify-content: center; padding: 30px; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--sela-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
    
        @media (min-width: 900px) {
            .header { padding-left: calc((100vw - 800px) / 2 + 20px); padding-right: calc((100vw - 800px) / 2 + 20px); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="/static/logo.jpg" alt="SELA" class="logo">
            <span class="brand">管理後台</span>
        </div>
        <a href="/dashboard" class="back-btn">← 返回</a>
    </header>
    
    <main class="main">
        <!-- 統計卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value" id="total-users">-</div>
                <div class="stat-label">總用戶數</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-value" id="total-series">-</div>
                <div class="stat-label">總集資數</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-value" id="total-invested">-</div>
                <div class="stat-label">總投入</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-value" id="total-prize">-</div>
                <div class="stat-label">總獎金</div>
            </div>
        </div>
        
        <!-- 快捷操作 -->
        <div class="quick-actions">
            <a href="/admin/lottery" class="action-btn">
                <span class="icon">🎰</span>
                <span>開獎同步</span>
            </a>
        </div>
        
        <!-- 用戶管理 -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">👥 用戶管理</span>
                <span class="section-action" id="user-count">0 位用戶</span>
            </div>
            <div id="user-list">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
        
        <!-- 集資管理 -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">📋 集資管理</span>
                <span class="section-action" id="series-count">0 個集資</span>
            </div>
            <div id="series-list">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </main>
    
    <div id="toast" class="toast"></div>
    
    <script>
        // ==================== 完全自包含，不依賴 common.js ====================
        const API_BASE = '/api/v1';
        
        function getToken() {
            try { return localStorage.getItem('access_token'); } 
            catch (e) { return null; }
        }
        
        async function api(url, opts = {}) {
            const token = getToken();
            const method = opts.method || 'GET';
            const fetchOpts = {
                method,
                headers: { 
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                }
            };
            if (opts.body) fetchOpts.body = typeof opts.body === 'string' ? opts.body : JSON.stringify(opts.body);
            const response = await fetch(API_BASE + url, fetchOpts);
            if (response.status === 401) {
                window.location.href = '/';
                return null;
            }
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.detail || 'API 錯誤');
            }
            return response.json();
        }
        
        async function apiPost(url, data) {
            const token = getToken();
            const response = await fetch(API_BASE + url, {
                method: 'POST',
                headers: { 
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err.detail || 'API 錯誤');
            }
            return response.json();
        }
        
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + (type || '') + ' show';
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        
        function formatMoney(amount) {
            const num = Number(amount) || 0;
            if (num >= 100000000) return (num / 100000000).toFixed(1) + '億';
            if (num >= 10000) return (num / 10000).toFixed(1) + '萬';
            return num.toLocaleString();
        }
        
        // ==================== 載入資料 ====================
        async function loadStats() {
            try {
                const stats = await api('/admin/stats');
                document.getElementById('total-users').textContent = stats.total_users ?? 0;
                document.getElementById('total-series').textContent = stats.total_series ?? 0;
                document.getElementById('total-invested').textContent = '$' + formatMoney(stats.total_pool);
                document.getElementById('total-prize').textContent = '$' + formatMoney(stats.total_prize);
            } catch (e) {
                console.error('載入統計失敗:', e);
            }
        }
        
        async function loadUsers() {
            try {
                const users = await api('/admin/users');
                const list = document.getElementById('user-list');
                document.getElementById('user-count').textContent = users.length + ' 位用戶';
                
                if (!users || users.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><p>尚無用戶</p></div>';
                    return;
                }
                
                list.innerHTML = users.slice(0, 10).map(u => `
                    <div class="list-item">
                        <div class="item-info">
                            <div class="item-name">${u.display_name || u.line_name || '用戶'}</div>
                            <div class="item-detail">${u.email || u.line_user_id?.substring(0, 15) + '...' || '-'}</div>
                        </div>
                        <span class="item-badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">
                            ${u.role === 'admin' ? '管理員' : '用戶'}
                        </span>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('user-list').innerHTML = '<div class="empty-state">載入失敗</div>';
            }
        }
        
        async function loadSeries() {
            try {
                const series = await api('/admin/series');
                const list = document.getElementById('series-list');
                document.getElementById('series-count').textContent = series.length + ' 個集資';
                
                if (!series || series.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>尚無集資</p></div>';
                    return;
                }
                
                list.innerHTML = series.slice(0, 10).map(s => `
                    <div class="list-item">
                        <div class="item-info">
                            <div class="item-name"><a href="/series/${s.id}" style="color:inherit;text-decoration:none;">${s.name}</a></div>
                            <div class="item-detail">👥 ${s.member_count || 0} 人 · 💰 ${formatMoney(s.total_pool)}</div>
                        </div>
                        <div class="item-actions">
                            <span class="item-badge ${s.status === 'active' ? 'badge-active' : 'badge-closed'}">${s.status === 'active' ? '進行中' : '已結束'}</span>
                            ${s.status === 'active' ? `<button class="btn-sm btn-secondary" onclick="adminEndSeries(${s.id}, '${s.name}')">結束</button>` : ''}
                            <button class="btn-sm btn-danger" onclick="adminDeleteSeries(${s.id}, '${s.name}')">刪除</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('series-list').innerHTML = '<div class="empty-state">載入失敗</div>';
            }
        }
        
        // ==================== 初始化 ====================
        
        async function adminEndSeries(id, name) {
            if (!confirm(\`確定要強制結束「\${name}」？\`)) return;
            try {
                await api(\`/admin/series/\${id}/end\`, { method: 'POST' });
                showToast('已結束', 'success');
                loadSeries();
            } catch (e) { showToast(e.message || '操作失敗', 'error'); }
        }
        
        async function adminDeleteSeries(id, name) {
            if (!confirm(\`確定要刪除「\${name}」？此操作無法復原！\`)) return;
            if (!confirm('再次確認：刪除後所有資料將永久消失')) return;
            try {
                await api(\`/admin/series/\${id}\`, { method: 'DELETE' });
                showToast('已刪除', 'success');
                loadSeries();
                loadStats();
            } catch (e) { showToast(e.message || '操作失敗', 'error'); }
        }

        async function init() {
            const token = getToken();
            if (!token) {
                window.location.href = '/';
                return;
            }
            
            try {
                const user = await api('/users/me');
                if (!user || user.role !== 'admin') {
                    showToast('需要管理員權限', 'error');
                    setTimeout(() => window.location.href = '/dashboard', 1500);
                    return;
                }
                
                // 並行載入
                await Promise.all([loadStats(), loadUsers(), loadSeries()]);
            } catch (e) {
                console.error('初始化失敗:', e);
                showToast('載入失敗', 'error');
            }
        }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
