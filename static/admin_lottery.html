<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELA - 開獎資訊同步</title>
    <style>
        :root { --sela-orange: #FA7A35; --sela-gradient: linear-gradient(135deg, #FA7A35, #FF9A5C); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #333; }
        .header { background: var(--sela-gradient); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 18px; }
        .back-btn { color: white; text-decoration: none; font-size: 14px; background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 8px; }
        .main { padding: 16px; max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .sync-btn { width: 100%; padding: 16px; background: var(--sela-gradient); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; }
        .sync-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .sync-btn .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; }
        .sync-btn.loading .spinner { display: inline-block; }
        .sync-btn.loading .btn-text { display: none; }
        .sync-btn.loading .loading-text { display: inline !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result { margin-top: 16px; padding: 16px; border-radius: 10px; display: none; }
        .result.success { display: block; background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
        .result.error { display: block; background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .info-text { font-size: 14px; color: #666; line-height: 1.6; }
        .draw-type { font-weight: 600; font-size: 15px; margin: 12px 0 6px; }
        .draw-type:first-child { margin-top: 0; }
        .draw-item { font-size: 14px; color: #555; padding: 4px 0; }
        .recent-title { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <header class="header">
        <h1>&#x1F4CA; 開獎資訊同步</h1>
        <a href="/admin" class="back-btn">&larr; 返回管理</a>
    </header>

    <main class="main">
        <div class="card">
            <div class="section-title">同步開獎資料</div>
            <p class="info-text">從台灣彩券官方 API 抓取最近 2 個月的開獎號碼與獎金資料，自動儲存並觸發對獎。</p>
            <button class="sync-btn" id="sync-btn" onclick="doSync()">
                <span class="spinner"></span>
                <span class="btn-text">&#x1F504; 立即同步</span>
                <span class="loading-text" style="display:none">同步中...</span>
            </button>
            <div class="result" id="result"></div>
        </div>

        <div class="card">
            <div class="recent-title">
                <span class="section-title">資料庫現有資料</span>
                <span id="draw-count" style="font-size:14px;color:#999;"></span>
            </div>
            <div id="recent-draws">
                <div class="info-text">載入中...</div>
            </div>
        </div>
    </main>

    <script src="/static/js/common.js"></script>
    <script>
        function getToken() {
            return localStorage.getItem('access_token') || new URLSearchParams(location.search).get('token');
        }

        function apiCall(url, options) {
            var token = getToken();
            var headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
            if (options && options.headers) {
                for (var k in options.headers) headers[k] = options.headers[k];
            }
            var opts = Object.assign({}, options || {}, { headers: headers });
            return fetch('/api/v1' + url, opts);
        }

        function doSync() {
            var btn = document.getElementById('sync-btn');
            var result = document.getElementById('result');
            btn.classList.add('loading');
            btn.disabled = true;
            result.className = 'result';
            result.style.display = 'none';

            apiCall('/lottery/sync', { method: 'POST' })
                .then(function(resp) { return resp.json().then(function(data) { return { ok: resp.ok, data: data }; }); })
                .then(function(res) {
                    if (res.ok && res.data.success) {
                        result.className = 'result success';
                        var msg = (res.data.message || '').replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
                        result.innerHTML = '<strong>&#x2705; ' + msg + '</strong>';
                    } else {
                        result.className = 'result error';
                        result.innerHTML = '<strong>&#x274C; ' + (res.data.message || res.data.detail || '同步失敗') + '</strong>';
                    }
                })
                .catch(function(e) {
                    result.className = 'result error';
                    result.innerHTML = '<strong>&#x274C; 網路錯誤: ' + e.message + '</strong>';
                })
                .finally(function() {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    loadRecentDraws();
                });
        }

        function loadRecentDraws() {
            var container = document.getElementById('recent-draws');
            var countEl = document.getElementById('draw-count');
            var types = [['power', '&#x1F534; 威力彩'], ['super', '&#x1F535; 大樂透'], ['daily539', '&#x1F7E2; 今彩539']];
            var total = 0;
            var html = '';
            var done = 0;

            types.forEach(function(t) {
                var typeCode = t[0];
                var typeName = t[1];
                apiCall('/lottery/history/' + typeCode + '?limit=3')
                    .then(function(resp) { return resp.ok ? resp.json() : { items: [], total_count: 0 }; })
                    .then(function(data) {
                        var items = data.items || [];
                        total += data.total_count || 0;
                        var section = '<div class="draw-type">' + typeName + ' (' + (data.total_count || 0) + ' 筆)</div>';
                        if (items.length === 0) {
                            section += '<div class="draw-item">尚無資料</div>';
                        } else {
                            items.forEach(function(d) {
                                var jp = d.jackpot_display ? ' &middot; 頭獎 ' + d.jackpot_display : '';
                                section += '<div class="draw-item">' + (d.draw_term || '-') + ' &middot; ' + (d.draw_date || '') + jp + '</div>';
                            });
                        }
                        html += section;
                    })
                    .catch(function() {
                        html += '<div class="draw-type">' + typeName + '</div><div class="draw-item">載入失敗</div>';
                    })
                    .finally(function() {
                        done++;
                        if (done === types.length) {
                            container.innerHTML = html;
                            countEl.textContent = '共 ' + total + ' 筆';
                        }
                    });
            });
        }

        loadRecentDraws();
    </script>
</body>
</html>
