<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>SELA 樂透一路發 - 儀表板</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --sela-orange: #F26522;
            --sela-orange-dark: #D85A1E;
            --sela-orange-light: #FF8547;
            --bg-primary: #FFF8F4;
            --bg-secondary: #FFF0E8;
            --bg-card: #FFFFFF;
            --border-color: rgba(242, 101, 34, 0.12);
            --text-primary: #2D2420;
            --text-secondary: #8B7355;
            --shadow-sm: 0 2px 8px rgba(242, 101, 34, 0.08);
            --shadow-md: 0 4px 16px rgba(242, 101, 34, 0.1);
        }
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--text-primary);
        }
        
        /* Header */
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
        }
        
        .brand {
            font-size: 16px;
            font-weight: 700;
            color: var(--sela-orange);
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        
        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .user-name {
            font-weight: 500;
            font-size: 14px;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
        }
        
        .logout-btn {
            padding: 8px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--sela-orange);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            font-weight: 500;
            -webkit-tap-highlight-color: transparent;
        }
        
        .logout-btn:hover, .logout-btn:active {
            background: var(--sela-orange);
            color: #fff;
            border-color: var(--sela-orange);
        }
        
        /* Main Content */
        .main {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .welcome {
            margin-bottom: 24px;
        }
        
        .welcome h1 {
            font-size: 22px;
            margin-bottom: 4px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .welcome h1 span {
            color: var(--sela-orange);
        }
        
        .welcome p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        /* Stats Cards */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--sela-orange), var(--sela-orange-light));
            opacity: 0.6;
        }
        
        .stat-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .stat-card-title {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .stat-card-icon {
            font-size: 20px;
        }
        
        .stat-card-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--sela-orange);
        }
        
        .stat-card-value.green { color: #16A34A; }
        .stat-card-value.blue { color: #2563EB; }
        
        /* Section Title */
        .section-title {
            font-size: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        /* Quick Actions */
        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .action-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            -webkit-tap-highlight-color: transparent;
        }
        
        .action-btn:hover, .action-btn:active {
            border-color: var(--sela-orange);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        
        .action-btn.primary {
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark));
            border: none;
            color: #fff;
            box-shadow: 0 8px 24px rgba(242, 101, 34, 0.3);
        }
        
        .action-btn.primary:hover, .action-btn.primary:active {
            box-shadow: 0 12px 32px rgba(242, 101, 34, 0.4);
            transform: translateY(-2px);
        }
        
        .action-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .action-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 15px;
        }
        
        .action-desc {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .action-btn.primary .action-desc {
            color: rgba(255,255,255,0.85);
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: var(--bg-card);
            border: 2px dashed var(--border-color);
            border-radius: 16px;
        }
        
        .empty-icon {
            font-size: 52px;
            margin-bottom: 14px;
        }
        
        .empty-title {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .empty-desc {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.6;
        }
        
        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .loading-content {
            text-align: center;
        }
        
        .loading-logo {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }
        
        .loading-text {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .hidden {
            display: none !important;
        }
        
        /* 手機直向 */
        @media (max-width: 480px) {
            .header {
                padding: 10px 16px;
            }
            
            .brand {
                display: none;
            }
            
            .user-name {
                display: none;
            }
            
            .main {
                padding: 16px;
            }
            
            .welcome h1 {
                font-size: 20px;
            }
            
            .stats {
                gap: 8px;
            }
            
            .stat-card {
                padding: 14px 12px;
            }
            
            .stat-card-title {
                font-size: 10px;
            }
            
            .stat-card-icon {
                font-size: 18px;
            }
            
            .stat-card-value {
                font-size: 18px;
            }
            
            .actions {
                gap: 10px;
            }
            
            .action-btn {
                padding: 16px 12px;
            }
            
            .action-icon {
                font-size: 28px;
                margin-bottom: 8px;
            }
            
            .action-title {
                font-size: 13px;
            }
            
            .action-desc {
                font-size: 10px;
            }
        }
        
        /* 小螢幕手機 */
        @media (max-width: 360px) {
            .main {
                padding: 12px;
            }
            
            .stat-card {
                padding: 12px 10px;
            }
            
            .stat-card-value {
                font-size: 16px;
            }
            
            .action-icon {
                font-size: 24px;
            }
        }
        
        /* 大螢幕 */
        @media (min-width: 768px) {
            .header {
                padding: 14px 30px;
            }
            
            .logo {
                width: 40px;
                height: 40px;
            }
            
            .brand {
                font-size: 18px;
            }
            
            .user-avatar {
                width: 40px;
                height: 40px;
            }
            
            .user-name {
                max-width: 150px;
                font-size: 15px;
            }
            
            .main {
                padding: 30px;
            }
            
            .welcome h1 {
                font-size: 26px;
            }
            
            .stats {
                gap: 16px;
            }
            
            .stat-card {
                padding: 22px;
            }
            
            .stat-card-title {
                font-size: 13px;
            }
            
            .stat-card-icon {
                font-size: 24px;
            }
            
            .stat-card-value {
                font-size: 28px;
            }
            
            .section-title {
                font-size: 18px;
            }
            
            .actions {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }
            
            .action-btn {
                padding: 28px 16px;
            }
            
            .action-icon {
                font-size: 36px;
            }
            
            .action-title {
                font-size: 16px;
            }
            
            .action-desc {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-content">
            <img src="/static/logo.jpg" alt="SELA" class="loading-logo">
            <div class="loading-text">載入中...</div>
        </div>
    </div>
    
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <img src="/static/logo.jpg" alt="SELA" class="logo">
            <div class="brand">SELA 樂透一路發</div>
        </div>
        <div class="header-right">
            <div class="user-info">
                <div class="user-avatar" id="user-avatar">👤</div>
                <span class="user-name" id="user-name">載入中</span>
            </div>
            <button class="logout-btn" onclick="logout()">登出</button>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="main">
        <div class="welcome">
            <h1>👋 歡迎，<span id="welcome-name">用戶</span>！</h1>
            <p>今天想試試手氣嗎？🦎</p>
        </div>
        
        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">錢包餘額</span>
                    <span class="stat-card-icon">💰</span>
                </div>
                <div class="stat-card-value" id="wallet-balance">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">系列團</span>
                    <span class="stat-card-icon">👥</span>
                </div>
                <div class="stat-card-value blue">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">累計獎金</span>
                    <span class="stat-card-icon">🏆</span>
                </div>
                <div class="stat-card-value green">$0</div>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <h2 class="section-title">⚡ 快速操作</h2>
        <div class="actions">
            <div class="action-btn primary" onclick="showComingSoon('建立系列團')">
                <div class="action-icon">➕</div>
                <div class="action-title">建立系列團</div>
                <div class="action-desc">開始新的團購</div>
            </div>
            <div class="action-btn" onclick="showComingSoon('加入系列團')">
                <div class="action-icon">🔗</div>
                <div class="action-title">加入系列團</div>
                <div class="action-desc">輸入邀請碼</div>
            </div>
            <div class="action-btn" onclick="showComingSoon('個人彩券')">
                <div class="action-icon">🎫</div>
                <div class="action-title">個人彩券</div>
                <div class="action-desc">記錄購買</div>
            </div>
            <div class="action-btn" onclick="showComingSoon('統計報表')">
                <div class="action-icon">📊</div>
                <div class="action-title">統計報表</div>
                <div class="action-desc">查看投報率</div>
            </div>
        </div>
        
        <!-- My Series -->
        <h2 class="section-title">🎯 我的系列團</h2>
        <div class="empty-state">
            <div class="empty-icon">🦎</div>
            <div class="empty-title">還沒有加入任何系列團</div>
            <div class="empty-desc">建立或加入一個系列團<br>開始團購彩券吧！</div>
        </div>
    </main>
    
    <script>
        const API_BASE = '/api/v1';
        
        function showComingSoon(feature) {
            alert(`「${feature}」功能即將推出！\n\n此功能將在 Step 2 實作。`);
        }
        
        async function checkAuth() {
            const token = localStorage.getItem('access_token');
            
            if (!token) {
                window.location.href = '/';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/users/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Unauthorized');
                }
                
                const user = await response.json();
                updateUI(user);
                
                const walletRes = await fetch(`${API_BASE}/users/me/wallet`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (walletRes.ok) {
                    const wallet = await walletRes.json();
                    document.getElementById('wallet-balance').textContent = `$${wallet.balance.toLocaleString()}`;
                }
                
            } catch (error) {
                console.error('Auth error:', error);
                localStorage.removeItem('access_token');
                window.location.href = '/';
            }
        }
        
        function updateUI(user) {
            const displayName = user.nickname || user.display_name;
            document.getElementById('user-name').textContent = displayName;
            document.getElementById('welcome-name').textContent = displayName;
            
            const avatarEl = document.getElementById('user-avatar');
            if (user.picture_url) {
                avatarEl.innerHTML = `<img src="${user.picture_url}" alt="avatar">`;
            } else {
                avatarEl.textContent = displayName.charAt(0);
            }
            
            document.getElementById('loading-overlay').classList.add('hidden');
        }
        
        function logout() {
            if (confirm('確定要登出嗎？')) {
                localStorage.removeItem('access_token');
                window.location.href = '/';
            }
        }
        
        checkAuth();
    </script>
</body>
</html>
