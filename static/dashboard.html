<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 SELA 樂透一路發 - 儀表板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft JhengHei', sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
            color: #fff;
        }
        
        /* Header */
        .header {
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo {
            font-size: 28px;
        }
        
        .brand {
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(90deg, #FA7A35, #FFB347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FA7A35, #FFB347);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .user-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .user-name {
            font-weight: 500;
        }
        
        .logout-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        /* Main Content */
        .main {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .welcome {
            margin-bottom: 30px;
        }
        
        .welcome h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .welcome p {
            color: #888;
        }
        
        /* Stats Cards */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
        }
        
        .stat-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .stat-card-title {
            color: #888;
            font-size: 14px;
        }
        
        .stat-card-icon {
            font-size: 24px;
        }
        
        .stat-card-value {
            font-size: 32px;
            font-weight: bold;
        }
        
        .stat-card-value.orange {
            color: #FA7A35;
        }
        
        .stat-card-value.green {
            color: #2ecc71;
        }
        
        .stat-card-value.blue {
            color: #3498db;
        }
        
        /* Quick Actions */
        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .action-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: #fff;
        }
        
        .action-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }
        
        .action-btn.primary {
            background: linear-gradient(135deg, #FA7A35, #e06620);
            border: none;
        }
        
        .action-btn.primary:hover {
            box-shadow: 0 10px 30px rgba(250, 122, 53, 0.3);
        }
        
        .action-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .action-title {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .action-desc {
            font-size: 12px;
            color: #888;
        }
        
        .action-btn.primary .action-desc {
            color: rgba(255,255,255,0.8);
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255,255,255,0.02);
            border: 2px dashed rgba(255,255,255,0.1);
            border-radius: 16px;
        }
        
        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .empty-title {
            font-size: 20px;
            margin-bottom: 10px;
        }
        
        .empty-desc {
            color: #888;
            margin-bottom: 20px;
        }
        
        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0f0f1a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .loading-content {
            text-align: center;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #FA7A35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 15px;
            }
            
            .main {
                padding: 20px;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div>載入中...</div>
        </div>
    </div>
    
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">🎰</div>
            <div class="brand">SELA 樂透一路發</div>
        </div>
        <div class="header-right">
            <div class="user-info">
                <div class="user-avatar" id="user-avatar">👤</div>
                <span class="user-name" id="user-name">載入中...</span>
            </div>
            <button class="logout-btn" onclick="logout()">登出</button>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="main">
        <div class="welcome">
            <h1>👋 歡迎回來，<span id="welcome-name">用戶</span>！</h1>
            <p>今天想試試手氣嗎？</p>
        </div>
        
        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">錢包餘額</span>
                    <span class="stat-card-icon">💰</span>
                </div>
                <div class="stat-card-value orange" id="wallet-balance">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">參與系列團</span>
                    <span class="stat-card-icon">👥</span>
                </div>
                <div class="stat-card-value blue">0 個</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">累計獎金</span>
                    <span class="stat-card-icon">🏆</span>
                </div>
                <div class="stat-card-value green">$0</div>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <h2 class="section-title">⚡ 快速操作</h2>
        <div class="actions">
            <div class="action-btn primary" onclick="alert('Step 2 將實作此功能')">
                <div class="action-icon">➕</div>
                <div class="action-title">建立系列團</div>
                <div class="action-desc">開始新的團購</div>
            </div>
            <div class="action-btn" onclick="alert('Step 2 將實作此功能')">
                <div class="action-icon">🔗</div>
                <div class="action-title">加入系列團</div>
                <div class="action-desc">輸入邀請碼</div>
            </div>
            <div class="action-btn" onclick="alert('Step 3 將實作此功能')">
                <div class="action-icon">🎫</div>
                <div class="action-title">個人彩券</div>
                <div class="action-desc">記錄個人購買</div>
            </div>
            <div class="action-btn" onclick="alert('Step 3 將實作此功能')">
                <div class="action-icon">📊</div>
                <div class="action-title">統計報表</div>
                <div class="action-desc">查看投報率</div>
            </div>
        </div>
        
        <!-- My Series -->
        <h2 class="section-title">🎯 我的系列團</h2>
        <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div class="empty-title">還沒有加入任何系列團</div>
            <div class="empty-desc">建立或加入一個系列團，開始團購彩券吧！</div>
        </div>
    </main>
    
    <script>
        const API_BASE = '/api/v1';
        
        // 檢查登入狀態
        async function checkAuth() {
            const token = localStorage.getItem('access_token');
            
            if (!token) {
                window.location.href = '/';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/users/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Unauthorized');
                }
                
                const user = await response.json();
                updateUI(user);
                
                // 取得錢包餘額
                const walletRes = await fetch(`${API_BASE}/users/me/wallet`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (walletRes.ok) {
                    const wallet = await walletRes.json();
                    document.getElementById('wallet-balance').textContent = `$${wallet.balance.toLocaleString()}`;
                }
                
            } catch (error) {
                console.error('Auth error:', error);
                localStorage.removeItem('access_token');
                window.location.href = '/';
            }
        }
        
        function updateUI(user) {
            // 更新用戶名稱
            const displayName = user.nickname || user.display_name;
            document.getElementById('user-name').textContent = displayName;
            document.getElementById('welcome-name').textContent = displayName;
            
            // 更新頭像
            const avatarEl = document.getElementById('user-avatar');
            if (user.picture_url) {
                avatarEl.innerHTML = `<img src="${user.picture_url}" alt="avatar">`;
            } else {
                avatarEl.textContent = displayName.charAt(0);
            }
            
            // 隱藏載入畫面
            document.getElementById('loading-overlay').classList.add('hidden');
        }
        
        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = '/';
        }
        
        // 初始化
        checkAuth();
    </script>
</body>
</html>
