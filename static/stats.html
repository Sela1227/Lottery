<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <title>號碼統計 - SELA 樂透一路發</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <style>
        :root {
            --sela-orange: #F26522;
            --sela-orange-dark: #D85A1E;
            --bg-primary: #FFF8F4;
            --bg-secondary: #FFF0E8;
            --bg-card: #FFFFFF;
            --text-primary: #2D2420;
            --text-secondary: #8B7355;
            --border-color: rgba(242, 101, 34, 0.12);
            --shadow-md: 0 4px 16px rgba(242, 101, 34, 0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary); 
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 40px;
        }
        
        /* ===== Header 統一樣式 ===== */
        .header {
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark));
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }
        .header .brand {
            color: white;
            font-size: 18px;
            font-weight: 700;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        /* ===== Main 統一樣式 ===== */
        .main {
            padding: 16px;
            max-width: 100%;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .main { max-width: 600px; padding: 20px; }
        }
        
        /* Lottery Tabs */
        .lottery-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .lottery-tab {
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            border: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        .lottery-tab.power { background: #FEE2E2; color: #DC2626; }
        .lottery-tab.power.active { background: linear-gradient(135deg, #DC2626, #EF4444); color: white; }
        .lottery-tab.super { background: #DBEAFE; color: #2563EB; }
        .lottery-tab.super.active { background: linear-gradient(135deg, #2563EB, #3B82F6); color: white; }
        .lottery-tab.daily539 { background: #D1FAE5; color: #059669; }
        .lottery-tab.daily539.active { background: linear-gradient(135deg, #059669, #10B981); color: white; }
        
        /* Stats Card */
        .stat-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }
        .stat-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-title .icon { font-size: 18px; }
        
        /* Number List */
        .number-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .number-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .number-ball {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 15px;
            color: white;
        }
        .ball-hot { background: linear-gradient(135deg, #EF4444, #DC2626); box-shadow: 0 2px 6px rgba(239, 68, 68, 0.3); }
        .ball-cold { background: linear-gradient(135deg, #3B82F6, #2563EB); box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3); }
        .ball-overdue { background: linear-gradient(135deg, #F59E0B, #D97706); box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3); }
        .number-label { font-size: 10px; color: #666; }
        
        /* Full Stats Grid */
        .full-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
            gap: 6px;
            margin-top: 12px;
        }
        .full-stat-item {
            background: #F9FAFB;
            border-radius: 6px;
            padding: 6px;
            text-align: center;
        }
        .full-stat-item.hot { background: #FEE2E2; }
        .full-stat-item.cold { background: #DBEAFE; }
        .full-stat-num { font-weight: 700; font-size: 14px; color: var(--text-primary); }
        .full-stat-count { font-size: 10px; color: var(--text-secondary); }
        
        /* Period Info */
        .period-info {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }
        
        /* Loading & Empty */
        .loading { display: flex; justify-content: center; padding: 30px; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--sela-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { padding: 30px; text-align: center; color: var(--text-secondary); }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="/static/logo.jpg" alt="SELA" class="logo">
            <span class="brand">號碼統計</span>
        </div>
        <a href="/dashboard" class="back-btn">← 返回</a>
    </header>
    
    <main class="main">
        <div class="lottery-tabs">
            <button class="lottery-tab power active" onclick="switchLottery('power')">🔴 威力彩</button>
            <button class="lottery-tab super" onclick="switchLottery('super')">🔵 大樂透</button>
            <button class="lottery-tab daily539" onclick="switchLottery('daily539')">🟢 今彩539</button>
        </div>
        
        <div id="statsContent">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </main>
    
    <script src="/static/js/common.js"></script>
    <script>
        // 備援函數
        if (typeof $ === 'undefined') window.$ = id => document.getElementById(id);
        if (typeof getToken === 'undefined') window.getToken = () => { try { return localStorage.getItem('access_token'); } catch(e) { return null; } };
        if (typeof apiGet === 'undefined') window.apiGet = async (url) => { const r = await fetch('/api/v1' + url, { headers: { 'Authorization': 'Bearer ' + getToken() } }); if (!r.ok) throw new Error('API Error'); return r.json(); };
        
        let currentLottery = 'power';
        
        function switchLottery(type) {
            currentLottery = type;
            document.querySelectorAll('.lottery-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelector(`.lottery-tab.${type}`).classList.add('active');
            loadStats();
        }
        
        async function loadStats() {
            const container = $('statsContent');
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            try {
                const data = await apiGet(`/stats/numbers/${currentLottery}?limit=100`);
                
                if (!data || data.error) {
                    container.innerHTML = '<div class="stat-card"><p style="text-align:center; color:#9CA3AF;">載入失敗</p></div>';
                    return;
                }
                
                if (data.total_draws === 0) {
                    container.innerHTML = '<div class="stat-card"><p style="text-align:center; color:#9CA3AF;">尚無歷史資料</p></div>';
                    return;
                }
                
                const hot = data.hot_numbers || [];
                const cold = data.cold_numbers || [];
                const overdue = data.overdue_numbers || [];
                const all = data.all_numbers || [];
                
                let html = `
                    <div class="period-info">
                        📊 統計期數：${data.total_draws || 0} 期
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-title"><span class="icon">🔥</span>熱門號碼 (出現最多)</div>
                        <div class="number-list">
                            ${hot.slice(0, 8).map(n => `
                                <div class="number-item">
                                    <div class="number-ball ball-hot">${n.number}</div>
                                    <span class="number-label">${n.count}次</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-title"><span class="icon">❄️</span>冷門號碼 (出現最少)</div>
                        <div class="number-list">
                            ${cold.slice(0, 8).map(n => `
                                <div class="number-item">
                                    <div class="number-ball ball-cold">${n.number}</div>
                                    <span class="number-label">${n.count}次</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-title"><span class="icon">⏰</span>最久未開 (遺漏期數)</div>
                        <div class="number-list">
                            ${overdue.slice(0, 8).map(n => `
                                <div class="number-item">
                                    <div class="number-ball ball-overdue">${n.number}</div>
                                    <span class="number-label">${n.gap}期</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
                // 完整統計（如果有數據）
                if (all.length > 0) {
                    const maxCount = Math.max(...all.map(n => n.count));
                    const minCount = Math.min(...all.map(n => n.count));
                    const threshold = (maxCount - minCount) / 3;
                    
                    html += `
                        <div class="stat-card">
                            <div class="stat-title"><span class="icon">📋</span>完整統計</div>
                            <div class="full-stats-grid">
                                ${all.map(n => {
                                    let cls = '';
                                    if (n.count >= maxCount - threshold) cls = 'hot';
                                    else if (n.count <= minCount + threshold) cls = 'cold';
                                    return `
                                        <div class="full-stat-item ${cls}">
                                            <div class="full-stat-num">${n.number}</div>
                                            <div class="full-stat-count">${n.count}次</div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }
                
                container.innerHTML = html;
                
            } catch (e) {
                console.error('loadStats error:', e);
                container.innerHTML = '<div class="stat-card"><p style="text-align:center; color:#9CA3AF;">載入失敗，請重試</p></div>';
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            if (!getToken()) { window.location.href = '/'; return; }
            loadStats();
        });
    </script>
</body>
</html>
