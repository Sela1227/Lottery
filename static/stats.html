<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <title>號碼統計 - SELA 樂透一路發</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <style>
        :root {
            --sela-orange: #F26522;
            --sela-orange-dark: #D85A1E;
            --bg-primary: #FFF8F4;
            --bg-secondary: #FFF0E8;
            --bg-card: #FFFFFF;
            --text-primary: #2D2420;
            --text-secondary: #8B7355;
            --border-color: rgba(242, 101, 34, 0.12);
            --success: #16A34A;
            --info: #2196F3;
            --warning: #F59E0B;
            --shadow-md: 0 4px 16px rgba(242, 101, 34, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary); 
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 40px;
        }
        
        /* ===== Header 統一樣式 ===== */
        .header {
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark));
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }
        .header .brand {
            color: white;
            font-size: 18px;
            font-weight: 700;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        /* ===== Main ===== */
        .main {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* ===== 彩種 Tabs（統一橘色風格）===== */
        .lottery-tabs {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }
        .lottery-tab {
            flex: 1;
            padding: 10px 8px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 13px;
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.3s;
        }
        .lottery-tab.active {
            background: var(--sela-orange);
            color: white;
        }
        .lottery-tab:not(.active):hover {
            background: var(--bg-secondary);
        }
        
        /* ===== Section 卡片 ===== */
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .section-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-body {
            padding: 16px;
        }
        
        /* ===== 號碼球 ===== */
        .number-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .number-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .number-ball {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: white;
        }
        .ball-hot {
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark));
            box-shadow: 0 2px 8px rgba(242, 101, 34, 0.3);
        }
        .ball-cold {
            background: linear-gradient(135deg, #64748B, #475569);
            box-shadow: 0 2px 8px rgba(100, 116, 139, 0.3);
        }
        .ball-overdue {
            background: linear-gradient(135deg, var(--warning), #D97706);
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
        }
        .number-label {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        /* ===== 統計資訊 ===== */
        .stat-info {
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .stat-info strong {
            color: var(--sela-orange);
        }
        
        /* ===== 完整統計 Grid ===== */
        .full-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
            gap: 6px;
        }
        .full-stat-item {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
        }
        .full-stat-item.hot {
            background: rgba(242, 101, 34, 0.15);
        }
        .full-stat-item.cold {
            background: rgba(100, 116, 139, 0.15);
        }
        .full-stat-num {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-primary);
        }
        .full-stat-count {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        
        /* ===== Loading & Empty ===== */
        .loading {
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--sela-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
        }
        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="/static/logo.jpg" alt="SELA" class="logo">
            <span class="brand">號碼統計</span>
        </div>
        <a href="/dashboard" class="back-btn">← 返回</a>
    </header>
    
    <main class="main">
        <!-- 彩種切換 -->
        <div class="lottery-tabs">
            <button class="lottery-tab active" data-type="power">威力彩</button>
            <button class="lottery-tab" data-type="super">大樂透</button>
            <button class="lottery-tab" data-type="daily539">今彩539</button>
        </div>
        
        <div id="statsContent">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </main>
    
    <script src="/static/js/common.js"></script>
    <script>
        // 備援函數
        if (typeof getToken === 'undefined') window.getToken = () => { try { return localStorage.getItem('access_token'); } catch(e) { return null; } };
        if (typeof apiGet === 'undefined') window.apiGet = async (url) => { const r = await fetch('/api/v1' + url, { headers: { 'Authorization': 'Bearer ' + getToken() } }); if (!r.ok) throw new Error('API Error'); return r.json(); };
        
        let currentLottery = 'power';
        
        // Tab 切換
        document.querySelectorAll('.lottery-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.lottery-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentLottery = tab.dataset.type;
                loadStats();
            });
        });
        
        async function loadStats() {
            const container = document.getElementById('statsContent');
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            try {
                const data = await apiGet(`/stats/numbers/${currentLottery}?limit=100`);
                
                if (!data || data.total_draws === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><p>尚無歷史資料</p></div>';
                    return;
                }
                
                const hot = data.hot_numbers || [];
                const cold = data.cold_numbers || [];
                const overdue = data.overdue_numbers || [];
                const all = data.all_numbers || [];
                
                let html = `
                    <div class="stat-info">
                        📊 統計期數：<strong>${data.total_draws || 0}</strong> 期
                    </div>
                    
                    <div class="section">
                        <div class="section-header">🔥 熱門號碼</div>
                        <div class="section-body">
                            <div class="number-list">
                                ${hot.slice(0, 8).map(n => `
                                    <div class="number-item">
                                        <div class="number-ball ball-hot">${n.number}</div>
                                        <span class="number-label">${n.count}次</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <div class="section-header">❄️ 冷門號碼</div>
                        <div class="section-body">
                            <div class="number-list">
                                ${cold.slice(0, 8).map(n => `
                                    <div class="number-item">
                                        <div class="number-ball ball-cold">${n.number}</div>
                                        <span class="number-label">${n.count}次</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <div class="section-header">⏰ 最久未開</div>
                        <div class="section-body">
                            <div class="number-list">
                                ${overdue.slice(0, 8).map(n => `
                                    <div class="number-item">
                                        <div class="number-ball ball-overdue">${n.number}</div>
                                        <span class="number-label">${n.missing}期</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                
                // 完整統計
                if (all.length > 0) {
                    const maxC = Math.max(...all.map(n => n.count));
                    const minC = Math.min(...all.map(n => n.count));
                    const threshold = (maxC - minC) / 3;
                    
                    html += `
                        <div class="section">
                            <div class="section-header">📋 完整統計</div>
                            <div class="section-body">
                                <div class="full-stats-grid">
                                    ${all.map(n => {
                                        let cls = '';
                                        if (n.count >= maxC - threshold) cls = 'hot';
                                        else if (n.count <= minC + threshold) cls = 'cold';
                                        return `
                                            <div class="full-stat-item ${cls}">
                                                <div class="full-stat-num">${n.number}</div>
                                                <div class="full-stat-count">${n.count}次</div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                container.innerHTML = html;
                
            } catch (e) {
                console.error('loadStats:', e);
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><p>載入失敗，請重試</p></div>';
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            if (!getToken()) { window.location.href = '/'; return; }
            loadStats();
        });
    </script>
</body>
</html>
