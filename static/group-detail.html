<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <title>SELA 樂透一路發 - 單期團</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        /* 單期團專用樣式 */
        .status-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
        .status-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .status-title { font-size: 20px; font-weight: 700; }
        .status-badge { padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; }
        .status-collecting { background: rgba(37, 99, 235, 0.1); color: var(--info); }
        .status-locked { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .status-purchased { background: rgba(139, 92, 246, 0.1); color: #8B5CF6; }
        .status-drawn { background: rgba(22, 163, 74, 0.1); color: var(--success); }
        .status-settled { background: rgba(139, 115, 85, 0.1); color: var(--text-secondary); }
        .status-info { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; }
        .status-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding-top: 16px; border-top: 1px solid var(--border-color); }
        .stat { text-align: center; }
        .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .stat-value { font-size: 18px; font-weight: 700; }
        .stat-value.orange { color: var(--sela-orange); }
        .stat-value.green { color: var(--success); }
        .stat-value.purple { color: #8B5CF6; }
        
        /* Winning Numbers */
        .winning-numbers { background: var(--bg-secondary); border-radius: 12px; padding: 16px; margin-top: 16px; }
        .winning-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
        .number-balls { display: flex; gap: 8px; flex-wrap: wrap; }
        .ball { width: 40px; height: 40px; border-radius: 50%; background: var(--sela-orange); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
        .ball.special { background: var(--success); }
        .ball.second { background: var(--info); }
        
        /* Progress Steps */
        .progress-steps { display: flex; justify-content: space-between; margin-bottom: 20px; padding: 0 10px; }
        .step { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
        .step:not(:last-child)::after { content: ''; position: absolute; top: 15px; left: 50%; width: 100%; height: 2px; background: var(--border-color); }
        .step.completed:not(:last-child)::after { background: var(--success); }
        .step-circle { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-secondary); border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 14px; z-index: 1; margin-bottom: 6px; }
        .step.completed .step-circle { background: var(--success); border-color: var(--success); color: #fff; }
        .step.active .step-circle { background: var(--sela-orange); border-color: var(--sela-orange); color: #fff; }
        .step-label { font-size: 11px; color: var(--text-secondary); text-align: center; }
        .step.completed .step-label, .step.active .step-label { color: var(--text-primary); font-weight: 600; }
        
        /* Action Bar */
        .action-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        
        /* Ticket List */
        .ticket-list { padding: 0; }
        .ticket-item { padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
        .ticket-item:last-child { border-bottom: none; }
        .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .ticket-id { font-weight: 600; color: var(--text-secondary); }
        .ticket-prize { padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; }
        .ticket-prize.winner { background: rgba(22, 163, 74, 0.1); color: var(--success); }
        .ticket-prize.no-prize { background: var(--bg-secondary); color: var(--text-secondary); }
        .ticket-numbers { display: flex; gap: 6px; flex-wrap: wrap; }
        .ticket-ball { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-secondary); color: var(--text-primary); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
        .ticket-ball.match { background: var(--sela-orange); color: #fff; }
        .ticket-ball.special-match { background: var(--success); color: #fff; }
        
        /* Contribution List */
        .contrib-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border-color); }
        .contrib-item:last-child { border-bottom: none; }
        .contrib-name { font-weight: 600; }
        .contrib-share { color: var(--sela-orange); font-weight: 700; }
        .contrib-prize { color: var(--success); font-weight: 700; }
        
        /* Settlement Preview */
        .settlement-preview { padding: 20px; }
        .settlement-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
        .settlement-item { text-align: center; padding: 16px; background: var(--bg-secondary); border-radius: 12px; }
        .settlement-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
        .settlement-value { font-size: 18px; font-weight: 700; }
        
        /* Number Input */
        .number-input-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .number-input { width: 50px; height: 50px; text-align: center; font-size: 18px; font-weight: 600; border: 2px solid var(--border-color); border-radius: 10px; }
        .number-input:focus { border-color: var(--sela-orange); outline: none; }
        
        /* Responsive */
        @media (max-width: 600px) {
            .status-stats { grid-template-columns: repeat(2, 1fr); }
            .settlement-summary { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="/series" class="back-btn" id="back-btn">←</a>
            <span class="header-title" id="page-title">單期團</span>
        </div>
    </header>
    
    <main class="main" id="content">
        <div class="loading"><div class="spinner"></div></div>
    </main>
    
    <!-- Ticket Modal -->
    <div class="modal-overlay" id="ticket-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">新增彩券</h2>
                <button class="modal-close" onclick="closeModal('ticket-modal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">選號(第一區)</label>
                    <div class="number-input-group" id="first-zone-inputs"></div>
                    <p class="form-hint" id="first-zone-hint"></p>
                </div>
                <div class="form-group" id="second-zone-group">
                    <label class="form-label">第二區號碼</label>
                    <div class="number-input-group">
                        <input type="number" class="number-input" id="second-zone-input" min="1">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">金額</label>
                    <input type="number" class="form-input" id="ticket-cost" value="100">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('ticket-modal')">取消</button>
                <button class="btn btn-primary" onclick="addTicket()">新增</button>
            </div>
        </div>
    </div>
    
    <!-- Draw Result Modal -->
    <div class="modal-overlay" id="draw-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">輸入開獎號碼</h2>
                <button class="modal-close" onclick="closeModal('draw-modal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">開獎號碼(第一區)</label>
                    <div class="number-input-group" id="draw-first-zone"></div>
                </div>
                <div class="form-group" id="draw-second-zone-group">
                    <label class="form-label" id="draw-second-label">特別號</label>
                    <div class="number-input-group">
                        <input type="number" class="number-input" id="draw-second-zone" min="1">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('draw-modal')">取消</button>
                <button class="btn btn-primary" onclick="inputDrawResult()">確認</button>
            </div>
        </div>
    </div>
    
    <!-- Purchase Modal -->
    <div class="modal-overlay" id="purchase-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">記錄購買</h2>
                <button class="modal-close" onclick="closeModal('purchase-modal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">實際購買金額(元)</label>
                    <input type="number" class="form-input" id="purchase-amount" min="0">
                    <p class="form-hint">資金池總額:$<span id="pool-amount"></span></p>
                </div>
                <div class="form-group">
                    <label class="form-label">購買注數</label>
                    <input type="number" class="form-input" id="purchase-tickets" value="1" min="1">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('purchase-modal')">取消</button>
                <button class="btn btn-primary" onclick="recordPurchase()">確認</button>
            </div>
        </div>
    </div>
    
    <!-- Settlement Modal -->
    <div class="modal-overlay" id="settlement-modal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h2 class="modal-title">結算確認</h2>
                <button class="modal-close" onclick="closeModal('settlement-modal')">✕</button>
            </div>
            <div class="modal-body" id="settlement-body">
                <div class="loading"><div class="spinner"></div></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('settlement-modal')">取消</button>
                <button class="btn btn-success" onclick="executeSettlement()">確認結算</button>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script src="/static/js/common.js"></script>
    <script>
        // ==================== 備援函數（防止 common.js 載入失敗）====================
        if (typeof $ === 'undefined') window.$ = id => document.getElementById(id);
        if (typeof setText === 'undefined') window.setText = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
        if (typeof setHtml === 'undefined') window.setHtml = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
        if (typeof getToken === 'undefined') window.getToken = () => { try { return localStorage.getItem('access_token'); } catch(e) { return null; } };
        if (typeof removeToken === 'undefined') window.removeToken = () => { try { localStorage.removeItem('access_token'); } catch(e) {} };
        if (typeof checkAuth === 'undefined') window.checkAuth = () => { if (!getToken()) { window.location.href = '/'; return false; } return true; };
        if (typeof apiGet === 'undefined') window.apiGet = async (url) => { const r = await fetch('/api/v1' + url, { headers: { 'Authorization': 'Bearer ' + getToken() } }); if (!r.ok) throw new Error('API Error'); return r.json(); };
        if (typeof apiPost === 'undefined') window.apiPost = async (url, data) => { const r = await fetch('/api/v1' + url, { method: 'POST', headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || 'API Error'); } return r.json(); };
        if (typeof apiPut === 'undefined') window.apiPut = async (url, data) => { const r = await fetch('/api/v1' + url, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || 'API Error'); } return r.json(); };
        if (typeof apiDelete === 'undefined') window.apiDelete = async (url) => { const r = await fetch('/api/v1' + url, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + getToken() } }); if (!r.ok) throw new Error('API Error'); return r.json(); };
        if (typeof showToast === 'undefined') window.showToast = (msg, type) => { const t = document.getElementById('toast'); if (t) { t.textContent = msg; t.className = 'toast ' + (type||'info') + ' show'; setTimeout(() => t.classList.remove('show'), 3000); } else { console.log('[Toast]', type, msg); alert(msg); } };
        if (typeof formatMoney === 'undefined') window.formatMoney = (n) => Number(n||0).toLocaleString();
        if (typeof formatDate === 'undefined') window.formatDate = (d) => { if (!d) return ''; const dt = new Date(d); return dt.getFullYear() + '/' + (dt.getMonth()+1) + '/' + dt.getDate(); };
        if (typeof getStatusText === 'undefined') window.getStatusText = (s) => ({ active:'進行中', paused:'已暫停', closed:'已結束', collecting:'集資中', locked:'已鎖定', purchased:'已購買', drawn:'已開獎', settled:'已結算' }[s] || s);

        const groupId = window.location.pathname.split('/').pop();
        let groupData = null, ticketsData = [], isAdmin = false, lotteryTypeConfig = null;
        
        const LOTTERY_CONFIGS = {
            power: { name: '威力彩', firstZone: 6, firstMax: 38, secondZone: true, secondMax: 8, price: 100 },
            super: { name: '大樂透', firstZone: 6, firstMax: 49, secondZone: true, secondMax: 49, price: 50, secondLabel: '特別號' },
            daily539: { name: '今彩539', firstZone: 5, firstMax: 39, secondZone: false, price: 50 }
        };
        
        function openModal(id) { $(id).classList.add('active'); }
        function closeModal(id) { $(id).classList.remove('active'); }
        
        async function loadData() {
            try {
                const user = await checkAuth();
                if (!user) return;
                
                groupData = await apiGet(`/groups/${groupId}`);
                ticketsData = await apiGet(`/groups/${groupId}/tickets`);
                
                const series = await apiGet(`/series/${groupData.series_id}`);
                isAdmin = series.my_role === 'admin';
                lotteryTypeConfig = LOTTERY_CONFIGS[groupData.lottery_type_code] || LOTTERY_CONFIGS.power;
                
                $('back-btn').href = `/series/${groupData.series_id}`;
                $('page-title').textContent = `第 ${groupData.period_number} 期`;
                
                renderContent();
            } catch (e) {
                $('content').innerHTML = `<div class="empty-state"><div class="empty-icon">❌</div><p class="empty-text">載入失敗: ${e.message}</p></div>`;
            }
        }
        
        function renderContent() {
            const g = groupData, config = lotteryTypeConfig;
            const statusSteps = ['collecting', 'locked', 'purchased', 'drawn', 'settled'];
            const currentStep = statusSteps.indexOf(g.status);
            
            $('content').innerHTML = `
                <div class="progress-steps">
                    ${['集資中', '已鎖定', '已購買', '已開獎', '已結算'].map((label, i) => `
                        <div class="step ${i < currentStep ? 'completed' : ''} ${i === currentStep ? 'active' : ''}">
                            <div class="step-circle">${i < currentStep ? '✓' : i + 1}</div>
                            <div class="step-label">${label}</div>
                        </div>
                    `).join('')}
                </div>
                
                <div class="status-card">
                    <div class="status-header">
                        <div class="status-title">${config.name} 第 ${g.period_number} 期</div>
                        <span class="status-badge status-${g.status}">${getStatusText(g.status)}</span>
                    </div>
                    <div class="status-info">
                        ${g.draw_term ? `<span>📅 台彩期數:${g.draw_term}</span>` : ''}
                        ${g.draw_date ? `<span>🗓️ 開獎日:${g.draw_date}</span>` : ''}
                    </div>
                    <div class="status-stats">
                        <div class="stat"><div class="stat-label">資金池</div><div class="stat-value orange">$${Number(g.total_pool).toLocaleString()}</div></div>
                        <div class="stat"><div class="stat-label">已花費</div><div class="stat-value purple">$${Number(g.total_spent).toLocaleString()}</div></div>
                        <div class="stat"><div class="stat-label">彩券數</div><div class="stat-value">${ticketsData.length}</div></div>
                        <div class="stat"><div class="stat-label">中獎金額</div><div class="stat-value green">$${Number(g.total_prize).toLocaleString()}</div></div>
                    </div>
                    ${g.winning_numbers ? renderWinningNumbers(g.winning_numbers) : ''}
                </div>
                
                ${isAdmin ? renderAdminActions(g.status) : ''}
                
                <div class="section">
                    <div class="section-header">
                        <div class="section-title">🎫 彩券列表 (${ticketsData.length})</div>
                        ${isAdmin && ['locked', 'purchased'].includes(g.status) ? `<button class="btn btn-secondary" onclick="showTicketModal()">+ 新增</button>` : ''}
                    </div>
                    ${ticketsData.length > 0 ? `<div class="ticket-list">${ticketsData.map((t, i) => renderTicket(t, i + 1)).join('')}</div>` 
                        : `<div class="empty-state"><div class="empty-icon">🎫</div><p class="empty-text">還沒有彩券</p></div>`}
                </div>
                
                ${g.contributions && g.contributions.length > 0 ? `
                    <div class="section">
                        <div class="section-header"><div class="section-title">👥 成員貢獻</div></div>
                        <div class="contrib-list">
                            ${g.contributions.map(c => `
                                <div class="contrib-item">
                                    <span class="contrib-name">${c.display_name || '成員'}</span>
                                    <div>
                                        <span class="contrib-share">$${Number(c.pool_share_at_lock).toLocaleString()}</span>
                                        ${c.prize_share > 0 ? `<span class="contrib-prize"> → +$${Number(c.prize_share).toLocaleString()}</span>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
            `;
            setupNumberInputs();
        }
        
        function renderAdminActions(status) {
            const actions = {
                collecting: `<button class="btn btn-primary" onclick="lockCollection()">🔒 鎖定集資</button>`,
                locked: `<button class="btn btn-primary" onclick="showPurchaseModal()">🛒 記錄購買</button><button class="btn btn-secondary" onclick="showTicketModal()">🎫 新增彩券</button>`,
                purchased: `<button class="btn btn-primary" onclick="showDrawModal()">🎰 輸入開獎號碼</button><button class="btn btn-secondary" onclick="showTicketModal()">🎫 新增彩券</button>`,
                drawn: `<button class="btn btn-success" onclick="checkTickets()">🔍 對獎</button><button class="btn btn-primary" onclick="showSettlementModal()">💰 結算</button>`,
                settled: ''
            };
            return actions[status] ? `<div class="action-bar">${actions[status]}</div>` : '';
        }
        
        function renderWinningNumbers(numbers) {
            const firstZone = numbers.first_zone || numbers.main || [];
            let html = '<div class="winning-numbers"><div class="winning-label">開獎號碼</div><div class="number-balls">';
            firstZone.forEach(n => { html += `<span class="ball">${n}</span>`; });
            if (numbers.second_zone !== undefined) html += `<span class="ball second">${numbers.second_zone}</span>`;
            else if (numbers.special !== undefined) html += `<span class="ball special">${numbers.special}</span>`;
            return html + '</div></div>';
        }
        
        function renderTicket(ticket, index) {
            const numbers = ticket.numbers || {}, firstZone = numbers.first_zone || numbers.main || [];
            const hasPrize = ticket.prize_amount > 0, matchedNums = new Set();
            if (groupData.winning_numbers) {
                const winningFirst = groupData.winning_numbers.first_zone || groupData.winning_numbers.main || [];
                firstZone.forEach(n => { if (winningFirst.includes(n)) matchedNums.add(n); });
            }
            return `
                <div class="ticket-item">
                    <div class="ticket-header">
                        <span class="ticket-id">彩券 #${index}</span>
                        ${['drawn', 'settled'].includes(groupData.status) ? `<span class="ticket-prize ${hasPrize ? 'winner' : 'no-prize'}">${hasPrize ? `🎉 $${Number(ticket.prize_amount).toLocaleString()}` : '未中獎'}</span>` : ''}
                    </div>
                    <div class="ticket-numbers">
                        ${firstZone.map(n => `<span class="ticket-ball ${matchedNums.has(n) ? 'match' : ''}">${n}</span>`).join('')}
                        ${numbers.second_zone !== undefined ? `<span class="ticket-ball ${numbers.second_zone === groupData.winning_numbers?.second_zone ? 'special-match' : ''}">${numbers.second_zone}</span>` : ''}
                        ${numbers.special !== undefined ? `<span class="ticket-ball ${numbers.special === groupData.winning_numbers?.special ? 'special-match' : ''}">${numbers.special}</span>` : ''}
                    </div>
                </div>
            `;
        }
        
        function getStatusText(status) {
            return { collecting: '集資中', locked: '已鎖定', purchased: '已購買', drawn: '已開獎', settled: '已結算' }[status] || status;
        }
        
        function setupNumberInputs() {
            const config = lotteryTypeConfig;
            $('first-zone-inputs').innerHTML = Array(config.firstZone).fill(0).map((_, i) => `<input type="number" class="number-input first-zone-num" min="1" max="${config.firstMax}" placeholder="${i+1}">`).join('');
            $('first-zone-hint').textContent = `選 ${config.firstZone} 個號碼,範圍 1-${config.firstMax}`;
            $('second-zone-group').style.display = config.secondZone ? 'block' : 'none';
            if (config.secondZone) $('second-zone-input').max = config.secondMax;
            $('ticket-cost').value = config.price;
            
            $('draw-first-zone').innerHTML = Array(config.firstZone).fill(0).map((_, i) => `<input type="number" class="number-input draw-first-num" min="1" max="${config.firstMax}" placeholder="${i+1}">`).join('');
            $('draw-second-zone-group').style.display = config.secondZone ? 'block' : 'none';
            if (config.secondZone) { $('draw-second-zone').max = config.secondMax; $('draw-second-label').textContent = config.secondLabel || '第二區'; }
        }
        
        function showTicketModal() { openModal('ticket-modal'); }
        function showPurchaseModal() { $('pool-amount').textContent = Number(groupData.total_pool).toLocaleString(); $('purchase-amount').value = groupData.total_pool; openModal('purchase-modal'); }
        function showDrawModal() { openModal('draw-modal'); }
        async function showSettlementModal() {
            openModal('settlement-modal');
            try {
                const preview = await apiGet(`/groups/${groupId}/settlement-preview`);
                $('settlement-body').innerHTML = `
                    <div class="settlement-summary">
                        <div class="settlement-item"><div class="settlement-label">總獎金</div><div class="settlement-value">$${Number(preview.total_prize).toLocaleString()}</div></div>
                        <div class="settlement-item"><div class="settlement-label">稅後獎金</div><div class="settlement-value">$${Number(preview.total_prize_after_tax).toLocaleString()}</div></div>
                        <div class="settlement-item"><div class="settlement-label">剩餘滾入</div><div class="settlement-value">$${Number(preview.carryover_amount).toLocaleString()}</div></div>
                    </div>
                    <div style="font-size:14px;color:var(--text-secondary);">確認結算後，獎金將依照比例分配給成員，剩餘金額滾入下期。</div>
                `;
            } catch (e) { $('settlement-body').innerHTML = `<div class="empty-state"><p class="empty-text">載入失敗: ${e.message}</p></div>`; }
        }
        
        async function lockCollection() {
            if (!confirm('確定要鎖定集資嗎？鎖定後成員將無法加碼。')) return;
            try { await apiPost(`/groups/${groupId}/lock`, {}); showToast('已鎖定集資', 'success'); loadData(); } catch (e) { showToast(e.message, 'error'); }
        }
        
        async function addTicket() {
            const firstNums = [...document.querySelectorAll('.first-zone-num')].map(i => parseInt(i.value)).filter(n => !isNaN(n));
            const config = lotteryTypeConfig;
            if (firstNums.length !== config.firstZone) { showToast(`請輸入 ${config.firstZone} 個號碼`, 'error'); return; }
            const numbers = config.secondZone ? { first_zone: firstNums, second_zone: parseInt($('second-zone-input').value) } : { first_zone: firstNums };
            if (config.secondZone && isNaN(numbers.second_zone)) { showToast('請輸入第二區號碼', 'error'); return; }
            try { await apiPost(`/groups/${groupId}/tickets`, { numbers, cost: parseFloat($('ticket-cost').value) || config.price }); closeModal('ticket-modal'); showToast('彩券已新增', 'success'); loadData(); } catch (e) { showToast(e.message, 'error'); }
        }
        
        async function recordPurchase() {
            const amount = parseFloat($('purchase-amount').value), ticketCount = parseInt($('purchase-tickets').value);
            if (isNaN(amount) || amount <= 0) { showToast('請輸入有效金額', 'error'); return; }
            try { await apiPost(`/groups/${groupId}/purchase`, { amount, ticket_count: ticketCount }); closeModal('purchase-modal'); showToast('已記錄購買', 'success'); loadData(); } catch (e) { showToast(e.message, 'error'); }
        }
        
        async function inputDrawResult() {
            const firstNums = [...document.querySelectorAll('.draw-first-num')].map(i => parseInt(i.value)).filter(n => !isNaN(n));
            const config = lotteryTypeConfig;
            if (firstNums.length !== config.firstZone) { showToast(`請輸入 ${config.firstZone} 個開獎號碼`, 'error'); return; }
            const numbers = config.secondZone ? { first_zone: firstNums, second_zone: parseInt($('draw-second-zone').value) } : { first_zone: firstNums };
            if (config.secondZone && isNaN(numbers.second_zone)) { showToast('請輸入第二區號碼', 'error'); return; }
            try { await apiPost(`/groups/${groupId}/draw`, { winning_numbers: numbers }); closeModal('draw-modal'); showToast('開獎號碼已輸入', 'success'); loadData(); } catch (e) { showToast(e.message, 'error'); }
        }
        
        async function checkTickets() {
            try { const result = await apiPost(`/groups/${groupId}/check-tickets`, {}); showToast(`對獎完成! 總獎金 $${Number(result.total_prize).toLocaleString()}`, 'success'); loadData(); } catch (e) { showToast(e.message, 'error'); }
        }
        
        async function executeSettlement() {
            if (!confirm('確定要執行結算嗎？結算後將更新所有成員的份額。')) return;
            try { await apiPost(`/groups/${groupId}/settle`, {}); closeModal('settlement-modal'); showToast('結算完成!', 'success'); loadData(); } catch (e) { showToast(e.message, 'error'); }
        }
        
        document.querySelectorAll('.modal-overlay').forEach(o => { o.addEventListener('click', e => { if (e.target === o) o.classList.remove('active'); }); });
        
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', loadData); } else { loadData(); }
    </script>
</body>
</html>
