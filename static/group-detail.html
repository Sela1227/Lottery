<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <title>SELA 樂透一路發 - 單期團</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --sela-orange: #F26522;
            --sela-orange-dark: #D85A1E;
            --sela-orange-light: #FF8547;
            --bg-primary: #FFF8F4;
            --bg-secondary: #FFF0E8;
            --bg-card: #FFFFFF;
            --border-color: rgba(242, 101, 34, 0.12);
            --text-primary: #2D2420;
            --text-secondary: #8B7355;
            --shadow-sm: 0 2px 8px rgba(242, 101, 34, 0.08);
            --shadow-md: 0 4px 16px rgba(242, 101, 34, 0.1);
            --success: #16A34A;
            --warning: #F59E0B;
            --error: #DC2626;
            --info: #2563EB;
            --purple: #8B5CF6;
        }
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            padding-bottom: 100px;
        }
        
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        
        .header-left { display: flex; align-items: center; gap: 10px; }
        
        .back-btn {
            width: 36px; height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px;
            text-decoration: none; color: var(--text-primary);
        }
        
        .page-title { font-size: 18px; font-weight: 700; }
        
        .main { padding: 20px; max-width: 900px; margin: 0 auto; }
        
        /* Status Card */
        .status-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }
        
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .status-title {
            font-size: 20px;
            font-weight: 700;
        }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .status-collecting { background: rgba(37, 99, 235, 0.1); color: var(--info); }
        .status-locked { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .status-purchased { background: rgba(139, 92, 246, 0.1); color: var(--purple); }
        .status-drawn { background: rgba(22, 163, 74, 0.1); color: var(--success); }
        .status-settled { background: rgba(139, 115, 85, 0.1); color: var(--text-secondary); }
        
        .status-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
        
        .status-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        
        .stat { text-align: center; }
        .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .stat-value { font-size: 18px; font-weight: 700; }
        .stat-value.orange { color: var(--sela-orange); }
        .stat-value.green { color: var(--success); }
        .stat-value.purple { color: var(--purple); }
        
        /* Winning Numbers Display */
        .winning-numbers {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
        }
        
        .winning-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
        
        .number-balls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .ball {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--sela-orange);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
        }
        
        .ball.special {
            background: var(--success);
        }
        
        .ball.second {
            background: var(--info);
        }
        
        /* Progress Steps */
        .progress-steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 10px;
        }
        
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            position: relative;
        }
        
        .step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 50%;
            width: 100%;
            height: 2px;
            background: var(--border-color);
        }
        
        .step.completed:not(:last-child)::after {
            background: var(--success);
        }
        
        .step-circle {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 1;
            margin-bottom: 6px;
        }
        
        .step.completed .step-circle {
            background: var(--success);
            border-color: var(--success);
            color: #fff;
        }
        
        .step.active .step-circle {
            background: var(--sela-orange);
            border-color: var(--sela-orange);
            color: #fff;
        }
        
        .step-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
        }
        
        .step.completed .step-label,
        .step.active .step-label {
            color: var(--text-primary);
            font-weight: 600;
        }
        
        /* Action Buttons */
        .action-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark));
            color: #fff;
        }
        
        .btn-success {
            background: linear-gradient(135deg, var(--success), #15803D);
            color: #fff;
        }
        
        .btn-secondary {
            background: var(--bg-card);
            color: var(--sela-orange);
            border: 1px solid var(--border-color);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Section */
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .section-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .section-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        
        .section-body { padding: 20px; }
        
        /* Ticket List */
        .ticket-list { padding: 0; }
        
        .ticket-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .ticket-item:last-child { border-bottom: none; }
        
        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .ticket-id { font-weight: 600; color: var(--text-secondary); }
        
        .ticket-prize {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .ticket-prize.winner { background: rgba(22, 163, 74, 0.1); color: var(--success); }
        .ticket-prize.no-prize { background: var(--bg-secondary); color: var(--text-secondary); }
        
        .ticket-numbers {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .ticket-ball {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--bg-secondary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }
        
        .ticket-ball.match {
            background: var(--sela-orange);
            color: #fff;
        }
        
        .ticket-ball.special-match {
            background: var(--success);
            color: #fff;
        }
        
        /* Contribution List */
        .contrib-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .contrib-item:last-child { border-bottom: none; }
        
        .contrib-name { font-weight: 600; }
        .contrib-share { color: var(--sela-orange); font-weight: 700; }
        .contrib-prize { color: var(--success); font-weight: 700; }
        
        /* Settlement Preview */
        .settlement-preview {
            padding: 20px;
        }
        
        .settlement-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .settlement-item {
            text-align: center;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
        }
        
        .settlement-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
        .settlement-value { font-size: 18px; font-weight: 700; }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal {
            background: var(--bg-card);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        
        .modal-overlay.active .modal { transform: translateY(0); }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title { font-size: 18px; font-weight: 700; }
        
        .modal-close {
            width: 32px; height: 32px;
            border-radius: 8px;
            border: none;
            background: var(--bg-secondary);
            cursor: pointer;
            font-size: 18px;
        }
        
        .modal-body { padding: 20px; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
        }
        
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--sela-orange);
        }
        
        .form-hint { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
        
        .modal-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        /* Number Input Grid */
        .number-input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .number-input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            border: 2px solid var(--border-color);
            border-radius: 10px;
        }
        
        .number-input:focus {
            border-color: var(--sela-orange);
            outline: none;
        }
        
        /* Empty & Loading */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-text { font-size: 14px; }
        
        .loading { display: flex; justify-content: center; padding: 40px; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--sela-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: #fff;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s;
        }
        
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }
        
        /* Responsive */
        @media (max-width: 600px) {
            .status-stats { grid-template-columns: repeat(2, 1fr); }
            .settlement-summary { grid-template-columns: 1fr; }
            .action-bar { flex-direction: column; }
            .action-bar .btn { justify-content: center; }
            .step-label { font-size: 10px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="#" class="back-btn" id="back-btn">←</a>
            <h1 class="page-title" id="page-title">單期團</h1>
        </div>
    </header>
    
    <main class="main">
        <div id="content">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </main>
    
    <!-- Add Ticket Modal -->
    <div class="modal-overlay" id="ticket-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">新增彩券</h2>
                <button class="modal-close" onclick="closeModal('ticket-modal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">號碼（第一區）</label>
                    <div class="number-input-group" id="first-zone-inputs"></div>
                    <p class="form-hint" id="first-zone-hint"></p>
                </div>
                <div class="form-group" id="second-zone-group" style="display: none;">
                    <label class="form-label">特別號（第二區）</label>
                    <div class="number-input-group">
                        <input type="number" class="number-input" id="second-zone-input" min="1">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">注數</label>
                    <input type="number" class="form-input" id="bet-count" value="1" min="1">
                </div>
                <div class="form-group">
                    <label class="form-label">金額（元）</label>
                    <input type="number" class="form-input" id="ticket-cost" value="100">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('ticket-modal')">取消</button>
                <button class="btn btn-primary" onclick="addTicket()">新增</button>
            </div>
        </div>
    </div>
    
    <!-- Draw Result Modal -->
    <div class="modal-overlay" id="draw-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">輸入開獎號碼</h2>
                <button class="modal-close" onclick="closeModal('draw-modal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">開獎號碼（第一區）</label>
                    <div class="number-input-group" id="draw-first-zone"></div>
                </div>
                <div class="form-group" id="draw-second-zone-group">
                    <label class="form-label" id="draw-second-label">特別號</label>
                    <div class="number-input-group">
                        <input type="number" class="number-input" id="draw-second-zone" min="1">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('draw-modal')">取消</button>
                <button class="btn btn-primary" onclick="inputDrawResult()">確認</button>
            </div>
        </div>
    </div>
    
    <!-- Purchase Modal -->
    <div class="modal-overlay" id="purchase-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">記錄購買</h2>
                <button class="modal-close" onclick="closeModal('purchase-modal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">實際購買金額（元）</label>
                    <input type="number" class="form-input" id="purchase-amount" min="0">
                    <p class="form-hint">資金池總額：$<span id="pool-amount"></span></p>
                </div>
                <div class="form-group">
                    <label class="form-label">購買注數</label>
                    <input type="number" class="form-input" id="purchase-tickets" value="1" min="1">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('purchase-modal')">取消</button>
                <button class="btn btn-primary" onclick="recordPurchase()">確認</button>
            </div>
        </div>
    </div>
    
    <!-- Settlement Modal -->
    <div class="modal-overlay" id="settlement-modal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h2 class="modal-title">結算確認</h2>
                <button class="modal-close" onclick="closeModal('settlement-modal')">✕</button>
            </div>
            <div class="modal-body" id="settlement-body">
                <div class="loading"><div class="spinner"></div></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('settlement-modal')">取消</button>
                <button class="btn btn-success" onclick="executeSettlement()">確認結算</button>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
        const API_BASE = '/api/v1';
        const groupId = window.location.pathname.split('/').pop();
        let groupData = null;
        let ticketsData = [];
        let isAdmin = false;
        let lotteryTypeConfig = null;
        
        const LOTTERY_CONFIGS = {
            power: { name: '威力彩', firstZone: 6, firstMax: 38, secondZone: true, secondMax: 8, price: 100 },
            super: { name: '大樂透', firstZone: 6, firstMax: 49, secondZone: true, secondMax: 49, price: 50, secondLabel: '特別號' },
            daily539: { name: '今彩539', firstZone: 5, firstMax: 39, secondZone: false, price: 50 }
        };
        
        async function apiGet(url) {
            const token = localStorage.getItem('access_token');
            const res = await fetch(`${API_BASE}${url}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error((await res.json()).detail || 'Error');
            return res.json();
        }
        
        async function apiPost(url, data) {
            const token = localStorage.getItem('access_token');
            const res = await fetch(`${API_BASE}${url}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error((await res.json()).detail || 'Error');
            return res.json();
        }
        
        async function loadData() {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    window.location.href = '/';
                    return;
                }
                
                groupData = await apiGet(`/groups/${groupId}`);
                ticketsData = await apiGet(`/groups/${groupId}/tickets`);
                
                // Check admin status
                const series = await apiGet(`/series/${groupData.series_id}`);
                isAdmin = series.my_role === 'admin';
                
                // Setup lottery config
                lotteryTypeConfig = LOTTERY_CONFIGS[groupData.lottery_type_code] || LOTTERY_CONFIGS.power;
                
                // Update back button
                document.getElementById('back-btn').href = `/series/${groupData.series_id}`;
                document.getElementById('page-title').textContent = `第 ${groupData.period_number} 期`;
                
                renderContent();
                
            } catch (e) {
                document.getElementById('content').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <p class="empty-text">載入失敗：${e.message}</p>
                    </div>
                `;
            }
        }
        
        function renderContent() {
            const g = groupData;
            const config = lotteryTypeConfig;
            const statusSteps = ['collecting', 'locked', 'purchased', 'drawn', 'settled'];
            const currentStep = statusSteps.indexOf(g.status);
            
            const content = document.getElementById('content');
            content.innerHTML = `
                <!-- Progress Steps -->
                <div class="progress-steps">
                    ${['集資中', '已鎖定', '已購買', '已開獎', '已結算'].map((label, i) => `
                        <div class="step ${i < currentStep ? 'completed' : ''} ${i === currentStep ? 'active' : ''}">
                            <div class="step-circle">${i < currentStep ? '✓' : i + 1}</div>
                            <div class="step-label">${label}</div>
                        </div>
                    `).join('')}
                </div>
                
                <!-- Status Card -->
                <div class="status-card">
                    <div class="status-header">
                        <div class="status-title">${config.name} 第 ${g.period_number} 期</div>
                        <span class="status-badge status-${g.status}">${getStatusText(g.status)}</span>
                    </div>
                    <div class="status-info">
                        ${g.draw_term ? `<span>📅 台彩期數：${g.draw_term}</span>` : ''}
                        ${g.draw_date ? `<span>🗓️ 開獎日：${g.draw_date}</span>` : ''}
                    </div>
                    <div class="status-stats">
                        <div class="stat">
                            <div class="stat-label">資金池</div>
                            <div class="stat-value orange">$${Number(g.total_pool).toLocaleString()}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">已花費</div>
                            <div class="stat-value purple">$${Number(g.total_spent).toLocaleString()}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">彩券數</div>
                            <div class="stat-value">${ticketsData.length}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">中獎金額</div>
                            <div class="stat-value green">$${Number(g.total_prize).toLocaleString()}</div>
                        </div>
                    </div>
                    
                    ${g.winning_numbers ? renderWinningNumbers(g.winning_numbers) : ''}
                </div>
                
                <!-- Admin Actions -->
                ${isAdmin ? renderAdminActions(g.status) : ''}
                
                <!-- Tickets Section -->
                <div class="section">
                    <div class="section-header">
                        <div class="section-title">🎫 彩券列表 (${ticketsData.length})</div>
                        ${isAdmin && ['locked', 'purchased'].includes(g.status) ? `
                            <button class="btn btn-secondary" onclick="showTicketModal()">+ 新增</button>
                        ` : ''}
                    </div>
                    ${ticketsData.length > 0 ? `
                        <div class="ticket-list">
                            ${ticketsData.map((t, i) => renderTicket(t, i + 1)).join('')}
                        </div>
                    ` : `
                        <div class="empty-state">
                            <div class="empty-icon">🎫</div>
                            <p class="empty-text">還沒有彩券</p>
                        </div>
                    `}
                </div>
                
                <!-- Contributions Section -->
                ${g.contributions && g.contributions.length > 0 ? `
                    <div class="section">
                        <div class="section-header">
                            <div class="section-title">👥 成員貢獻</div>
                        </div>
                        <div class="contrib-list">
                            ${g.contributions.map(c => `
                                <div class="contrib-item">
                                    <span class="contrib-name">${c.display_name || '成員'}</span>
                                    <div>
                                        <span class="contrib-share">$${Number(c.pool_share_at_lock).toLocaleString()}</span>
                                        ${c.prize_share > 0 ? `<span class="contrib-prize"> → +$${Number(c.prize_share).toLocaleString()}</span>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
            `;
            
            setupNumberInputs();
        }
        
        function renderAdminActions(status) {
            const actions = {
                collecting: `<button class="btn btn-primary" onclick="lockCollection()">🔒 鎖定集資</button>`,
                locked: `
                    <button class="btn btn-primary" onclick="showPurchaseModal()">🛒 記錄購買</button>
                    <button class="btn btn-secondary" onclick="showTicketModal()">🎫 新增彩券</button>
                `,
                purchased: `
                    <button class="btn btn-primary" onclick="showDrawModal()">🎰 輸入開獎號碼</button>
                    <button class="btn btn-secondary" onclick="showTicketModal()">🎫 新增彩券</button>
                `,
                drawn: `
                    <button class="btn btn-success" onclick="checkTickets()">🔍 對獎</button>
                    <button class="btn btn-primary" onclick="showSettlementModal()">💰 結算</button>
                `,
                settled: ''
            };
            
            if (!actions[status]) return '';
            
            return `
                <div class="action-bar">
                    ${actions[status]}
                </div>
            `;
        }
        
        function renderWinningNumbers(numbers) {
            const config = lotteryTypeConfig;
            let html = '<div class="winning-numbers"><div class="winning-label">開獎號碼</div><div class="number-balls">';
            
            // First zone
            const firstZone = numbers.first_zone || numbers.main || [];
            firstZone.forEach(n => {
                html += `<span class="ball">${n}</span>`;
            });
            
            // Second zone / Special
            if (numbers.second_zone !== undefined) {
                html += `<span class="ball second">${numbers.second_zone}</span>`;
            } else if (numbers.special !== undefined) {
                html += `<span class="ball special">${numbers.special}</span>`;
            }
            
            html += '</div></div>';
            return html;
        }
        
        function renderTicket(ticket, index) {
            const numbers = ticket.numbers || {};
            const firstZone = numbers.first_zone || numbers.main || [];
            const hasPrize = ticket.prize_amount > 0;
            const prizeResults = ticket.prize_results || [];
            const matchedNums = new Set();
            
            // Extract matched numbers from prize results
            if (groupData.winning_numbers) {
                const winning = groupData.winning_numbers;
                const winningFirst = winning.first_zone || winning.main || [];
                firstZone.forEach(n => {
                    if (winningFirst.includes(n)) matchedNums.add(n);
                });
            }
            
            return `
                <div class="ticket-item">
                    <div class="ticket-header">
                        <span class="ticket-id">彩券 #${index}</span>
                        ${groupData.status === 'drawn' || groupData.status === 'settled' ? `
                            <span class="ticket-prize ${hasPrize ? 'winner' : 'no-prize'}">
                                ${hasPrize ? `🎉 $${Number(ticket.prize_amount).toLocaleString()}` : '未中獎'}
                            </span>
                        ` : ''}
                    </div>
                    <div class="ticket-numbers">
                        ${firstZone.map(n => `
                            <span class="ticket-ball ${matchedNums.has(n) ? 'match' : ''}">${n}</span>
                        `).join('')}
                        ${numbers.second_zone !== undefined ? `
                            <span class="ticket-ball ${numbers.second_zone === (groupData.winning_numbers?.second_zone) ? 'special-match' : ''}">${numbers.second_zone}</span>
                        ` : ''}
                        ${numbers.special !== undefined ? `
                            <span class="ticket-ball ${numbers.special === (groupData.winning_numbers?.special) ? 'special-match' : ''}">${numbers.special}</span>
                        ` : ''}
                    </div>
                </div>
            `;
        }
        
        function getStatusText(status) {
            const map = {
                collecting: '集資中',
                locked: '已鎖定',
                purchased: '已購買',
                drawn: '已開獎',
                settled: '已結算'
            };
            return map[status] || status;
        }
        
        function setupNumberInputs() {
            const config = lotteryTypeConfig;
            
            // Ticket modal inputs
            const firstZoneContainer = document.getElementById('first-zone-inputs');
            firstZoneContainer.innerHTML = Array(config.firstZone).fill(0).map((_, i) => 
                `<input type="number" class="number-input first-zone-num" min="1" max="${config.firstMax}" placeholder="${i+1}">`
            ).join('');
            document.getElementById('first-zone-hint').textContent = `選 ${config.firstZone} 個號碼，範圍 1-${config.firstMax}`;
            
            // Second zone
            const secondGroup = document.getElementById('second-zone-group');
            if (config.secondZone) {
                secondGroup.style.display = 'block';
                document.getElementById('second-zone-input').max = config.secondMax;
            } else {
                secondGroup.style.display = 'none';
            }
            
            // Default cost
            document.getElementById('ticket-cost').value = config.price;
            
            // Draw modal inputs
            const drawFirstZone = document.getElementById('draw-first-zone');
            drawFirstZone.innerHTML = Array(config.firstZone).fill(0).map((_, i) => 
                `<input type="number" class="number-input draw-first-num" min="1" max="${config.firstMax}">`
            ).join('');
            
            const drawSecondGroup = document.getElementById('draw-second-zone-group');
            if (config.secondZone) {
                drawSecondGroup.style.display = 'block';
                document.getElementById('draw-second-zone').max = config.secondMax;
                document.getElementById('draw-second-label').textContent = 
                    config.secondLabel || (groupData.lottery_type_code === 'power' ? '第二區' : '特別號');
            } else {
                drawSecondGroup.style.display = 'none';
            }
        }
        
        // Modal Functions
        function showTicketModal() {
            document.getElementById('ticket-modal').classList.add('active');
        }
        
        function showDrawModal() {
            document.getElementById('draw-modal').classList.add('active');
        }
        
        function showPurchaseModal() {
            document.getElementById('pool-amount').textContent = Number(groupData.total_pool).toLocaleString();
            document.getElementById('purchase-amount').value = groupData.total_pool;
            document.getElementById('purchase-modal').classList.add('active');
        }
        
        async function showSettlementModal() {
            document.getElementById('settlement-modal').classList.add('active');
            const body = document.getElementById('settlement-body');
            body.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            try {
                const preview = await apiGet(`/groups/${groupId}/settlement-preview`);
                
                body.innerHTML = `
                    <div class="settlement-preview">
                        <div class="settlement-summary">
                            <div class="settlement-item">
                                <div class="settlement-label">資金池</div>
                                <div class="settlement-value" style="color: var(--sela-orange);">$${Number(preview.total_pool).toLocaleString()}</div>
                            </div>
                            <div class="settlement-item">
                                <div class="settlement-label">已花費</div>
                                <div class="settlement-value">$${Number(preview.total_spent).toLocaleString()}</div>
                            </div>
                            <div class="settlement-item">
                                <div class="settlement-label">中獎金額（稅後）</div>
                                <div class="settlement-value" style="color: var(--success);">$${Number(preview.total_prize_after_tax).toLocaleString()}</div>
                            </div>
                        </div>
                        
                        <h4 style="margin-bottom: 12px; font-size: 14px;">成員結算明細</h4>
                        <div style="max-height: 300px; overflow-y: auto;">
                            ${preview.members.map(m => `
                                <div class="contrib-item">
                                    <span class="contrib-name">${m.display_name}</span>
                                    <div style="text-align: right; font-size: 13px;">
                                        <div>原份額: $${Number(m.pool_share_before).toLocaleString()}</div>
                                        <div style="color: var(--success);">獎金: +$${Number(m.prize_share).toLocaleString()}</div>
                                        <div style="font-weight: 700; color: var(--sela-orange);">新份額: $${Number(m.pool_share_after).toLocaleString()}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } catch (e) {
                body.innerHTML = `<div class="empty-state"><p class="empty-text">${e.message}</p></div>`;
            }
        }
        
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        
        // API Actions
        async function lockCollection() {
            if (!confirm('確定要鎖定集資嗎？鎖定後成員無法再調整份額。')) return;
            
            try {
                await apiPost(`/groups/${groupId}/lock`, {});
                showToast('已鎖定集資', 'success');
                loadData();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        async function recordPurchase() {
            const amount = parseFloat(document.getElementById('purchase-amount').value);
            const tickets = parseInt(document.getElementById('purchase-tickets').value);
            
            try {
                await apiPost(`/groups/${groupId}/purchase?total_spent=${amount}&total_tickets=${tickets}`, {});
                closeModal('purchase-modal');
                showToast('已記錄購買', 'success');
                loadData();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        async function addTicket() {
            const config = lotteryTypeConfig;
            const firstZone = [...document.querySelectorAll('.first-zone-num')].map(el => parseInt(el.value)).filter(n => n);
            const betCount = parseInt(document.getElementById('bet-count').value);
            const cost = parseFloat(document.getElementById('ticket-cost').value);
            
            if (firstZone.length !== config.firstZone) {
                showToast(`請輸入 ${config.firstZone} 個號碼`, 'error');
                return;
            }
            
            const numbers = { first_zone: firstZone };
            
            if (config.secondZone) {
                const secondZone = parseInt(document.getElementById('second-zone-input').value);
                if (!secondZone) {
                    showToast('請輸入特別號', 'error');
                    return;
                }
                if (groupData.lottery_type_code === 'power') {
                    numbers.second_zone = secondZone;
                } else {
                    numbers.special = secondZone;
                }
            }
            
            try {
                await apiPost(`/groups/${groupId}/tickets`, {
                    numbers,
                    bet_count: betCount,
                    cost
                });
                closeModal('ticket-modal');
                showToast('彩券已新增', 'success');
                loadData();
                
                // Clear inputs
                document.querySelectorAll('.first-zone-num').forEach(el => el.value = '');
                document.getElementById('second-zone-input').value = '';
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        async function inputDrawResult() {
            const config = lotteryTypeConfig;
            const firstZone = [...document.querySelectorAll('.draw-first-num')].map(el => parseInt(el.value)).filter(n => n);
            
            if (firstZone.length !== config.firstZone) {
                showToast(`請輸入 ${config.firstZone} 個開獎號碼`, 'error');
                return;
            }
            
            const winningNumbers = {};
            
            if (groupData.lottery_type_code === 'power') {
                winningNumbers.first_zone = firstZone;
                const secondZone = parseInt(document.getElementById('draw-second-zone').value);
                if (config.secondZone && !secondZone) {
                    showToast('請輸入第二區號碼', 'error');
                    return;
                }
                winningNumbers.second_zone = secondZone;
            } else if (groupData.lottery_type_code === 'super') {
                winningNumbers.main = firstZone;
                const special = parseInt(document.getElementById('draw-second-zone').value);
                if (!special) {
                    showToast('請輸入特別號', 'error');
                    return;
                }
                winningNumbers.special = special;
            } else {
                winningNumbers.main = firstZone;
            }
            
            try {
                await apiPost(`/groups/${groupId}/draw`, { winning_numbers: winningNumbers });
                closeModal('draw-modal');
                showToast('開獎號碼已輸入', 'success');
                loadData();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        async function checkTickets() {
            try {
                const result = await apiPost(`/groups/${groupId}/check-tickets`, {});
                showToast(`對獎完成！總獎金 $${Number(result.total_prize).toLocaleString()}`, 'success');
                loadData();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        async function executeSettlement() {
            if (!confirm('確定要執行結算嗎？結算後將更新所有成員的份額。')) return;
            
            try {
                await apiPost(`/groups/${groupId}/settle`, {});
                closeModal('settlement-modal');
                showToast('結算完成！', 'success');
                loadData();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // Modal close on overlay click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.classList.remove('active');
            });
        });
        
        loadData();
    </script>
</body>
</html>
