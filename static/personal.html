<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <title>個人彩券 - SELA 樂透一路發</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        /* 個人彩券專用樣式 */
        .header { background: linear-gradient(135deg, var(--sela-orange), #ff8a50); color: white; padding: 16px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
        .back-btn { color: white; text-decoration: none; font-size: 24px; padding: 4px; }
        .page-title { font-size: 18px; font-weight: 700; }
        
        .stats-card { background: linear-gradient(135deg, var(--sela-orange), #ff8a50); color: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .stats-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .stats-title { font-size: 14px; opacity: 0.9; }
        .stats-value { font-size: 28px; font-weight: 900; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .stat-item { text-align: center; }
        .stat-item-value { font-size: 18px; font-weight: 700; }
        .stat-item-label { font-size: 11px; opacity: 0.8; }
        
        .action-bar { display: flex; gap: 12px; margin-bottom: 20px; }
        
        .filter-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
        .filter-tab { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); background: white; font-size: 13px; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
        .filter-tab.active { background: var(--sela-orange); color: white; border-color: var(--sela-orange); }
        
        .ticket-list { display: flex; flex-direction: column; gap: 12px; }
        .ticket-card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .ticket-type { display: flex; align-items: center; gap: 8px; }
        .ticket-type-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .ticket-type-icon.power, .ticket-type-icon.super_lotto { background: #FFEBEE; }
        .ticket-type-icon.super, .ticket-type-icon.lotto649 { background: #E3F2FD; }
        .ticket-type-icon.daily, .ticket-type-icon.daily_cash { background: #E8F5E9; }
        .ticket-type-name { font-weight: 600; font-size: 14px; }
        .ticket-date { font-size: 12px; color: var(--text-secondary); }
        .ticket-status { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .ticket-status.pending { background: #FFF3E0; color: #E65100; }
        .ticket-status.won { background: #E8F5E9; color: #2E7D32; }
        .ticket-status.lost { background: #FAFAFA; color: #9E9E9E; }
        .ticket-numbers { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .number-ball { width: 32px; height: 32px; border-radius: 50%; background: var(--sela-orange); color: white; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
        .number-ball.special { background: var(--info); }
        .number-ball.matched { background: var(--success); box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.3); }
        .ticket-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border-color); }
        .ticket-cost { font-size: 13px; color: var(--text-secondary); }
        .ticket-prize { font-size: 16px; font-weight: 700; color: var(--success); }
        .ticket-actions { display: flex; gap: 8px; }
        .ticket-action { padding: 6px 12px; border-radius: 6px; border: none; font-size: 12px; cursor: pointer; }
        .ticket-action.check { background: var(--sela-orange); color: white; }
        .ticket-action.delete { background: #FFEBEE; color: #C62828; }
        
        .achievements-section { background: white; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .achievements-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .achievements-title { font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .achievements-view-all { color: var(--sela-orange); font-size: 13px; cursor: pointer; }
        .achievement-badges { display: flex; gap: 8px; flex-wrap: wrap; }
        .achievement-badge { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .achievement-badge.unlocked { background: #FFF8E1; }
        .achievement-badge.locked { background: #f5f5f5; filter: grayscale(1); opacity: 0.5; }
        
        .number-input-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-height: 200px; overflow-y: auto; }
        .number-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-color); background: white; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .number-btn.selected { background: var(--sela-orange); color: white; border-color: var(--sela-orange); }
        .number-btn.special-selected { background: var(--info); color: white; border-color: var(--info); }
        .selected-numbers { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; min-height: 28px; }
        
        .empty-state { text-align: center; padding: 40px 20px; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-text { color: var(--text-secondary); font-size: 14px; }
    </style>
</head>
<body>
    <header class="header">
        <a href="/dashboard" class="back-btn">←</a>
        <span class="page-title">🎫 個人彩券</span>
    </header>
    
    <main class="main">
        <div class="stats-card">
            <div class="stats-header">
                <div><div class="stats-title">累計獲利</div><div class="stats-value" id="total-profit">$0</div></div>
                <div style="text-align: right;"><div class="stats-title">中獎率</div><div class="stats-value" id="win-rate">0%</div></div>
            </div>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-item-value" id="total-tickets">0</div><div class="stat-item-label">總彩券數</div></div>
                <div class="stat-item"><div class="stat-item-value" id="total-cost">$0</div><div class="stat-item-label">總花費</div></div>
                <div class="stat-item"><div class="stat-item-value" id="total-prize">$0</div><div class="stat-item-label">總獎金</div></div>
            </div>
        </div>
        
        <div class="achievements-section">
            <div class="achievements-header">
                <div class="achievements-title">🏆 成就</div>
                <span class="achievements-view-all" onclick="showAchievements()">查看全部 →</span>
            </div>
            <div class="achievement-badges" id="achievement-badges"><span style="color: var(--text-secondary); font-size: 13px;">載入中...</span></div>
        </div>
        
        <div class="action-bar">
            <button class="btn btn-primary" onclick="showAddModal()">➕ 新增彩券</button>
            <button class="btn btn-secondary" onclick="showCheckModal()">🔍 對獎</button>
        </div>
        
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">全部</button>
            <button class="filter-tab" data-filter="pending">待開獎</button>
            <button class="filter-tab" data-filter="won">已中獎</button>
            <button class="filter-tab" data-filter="lost">未中獎</button>
        </div>
        
        <div class="ticket-list" id="ticket-list"><div class="empty-state"><div class="empty-icon">⏳</div><p class="empty-text">載入中...</p></div></div>
    </main>
    
    <!-- Add Modal -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal">
            <div class="modal-header"><h2 class="modal-title">新增彩券</h2><button class="modal-close" onclick="closeModal('add-modal')">✕</button></div>
            <div class="modal-body">
                <div class="form-group"><label class="form-label">彩種</label><select class="form-select" id="lottery-type" onchange="updateNumberGrid()"><option value="">請選擇</option></select></div>
                <div class="form-group"><label class="form-label">期別 (選填)</label><input type="text" class="form-input" id="draw-term" placeholder="例如: 113000001"></div>
                <div class="form-group"><label class="form-label">主號碼</label><div class="selected-numbers" id="selected-main"></div><div class="number-input-grid" id="main-numbers"></div></div>
                <div class="form-group" id="special-group" style="display: none;"><label class="form-label">特別號 (第二區)</label><div class="selected-numbers" id="selected-special"></div><div class="number-input-grid" id="special-numbers"></div></div>
                <div class="form-group"><label class="form-label">購買金額</label><input type="number" class="form-input" id="ticket-cost" value="100" min="50" step="50"></div>
                <div class="form-group"><label class="form-label">備註 (選填)</label><input type="text" class="form-input" id="ticket-note" placeholder="例如: 生日號碼"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('add-modal')">取消</button><button class="btn btn-primary" onclick="createTicket()">新增</button></div>
        </div>
    </div>
    
    <!-- Check Modal -->
    <div class="modal-overlay" id="check-modal">
        <div class="modal">
            <div class="modal-header"><h2 class="modal-title">對獎</h2><button class="modal-close" onclick="closeModal('check-modal')">✕</button></div>
            <div class="modal-body">
                <div class="form-group"><label class="form-label">開獎號碼 (逗號分隔)</label><input type="text" class="form-input" id="winning-numbers" placeholder="例如: 1,5,12,23,34,38"></div>
                <div class="form-group"><label class="form-label">特別號 (選填)</label><input type="number" class="form-input" id="winning-special" placeholder="例如: 5"></div>
                <p style="font-size: 12px; color: var(--text-secondary); margin-top: 8px;">將對選中的待開獎彩券進行對獎</p>
            </div>
            <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('check-modal')">取消</button><button class="btn btn-primary" onclick="checkTickets()">對獎</button></div>
        </div>
    </div>
    
    <!-- Achievements Modal -->
    <div class="modal-overlay" id="achievements-modal">
        <div class="modal" style="max-height: 90vh;">
            <div class="modal-header"><h2 class="modal-title">🏆 成就系統</h2><button class="modal-close" onclick="closeModal('achievements-modal')">✕</button></div>
            <div class="modal-body" id="achievements-content"><div class="loading"><div class="spinner"></div></div></div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script src="/static/js/common.js"></script>
    <script>
        // ==================== 備援函數（防止 common.js 載入失敗）====================
        if (typeof $ === 'undefined') window.$ = id => document.getElementById(id);
        if (typeof setText === 'undefined') window.setText = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
        if (typeof setHtml === 'undefined') window.setHtml = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
        if (typeof getToken === 'undefined') window.getToken = () => { try { return localStorage.getItem('access_token'); } catch(e) { return null; } };
        if (typeof removeToken === 'undefined') window.removeToken = () => { try { localStorage.removeItem('access_token'); } catch(e) {} };
        if (typeof checkAuth === 'undefined') window.checkAuth = () => { if (!getToken()) { window.location.href = '/'; return false; } return true; };
        if (typeof apiGet === 'undefined') window.apiGet = async (url) => { const r = await fetch('/api/v1' + url, { headers: { 'Authorization': 'Bearer ' + getToken() } }); if (!r.ok) throw new Error('API Error'); return r.json(); };
        if (typeof apiPost === 'undefined') window.apiPost = async (url, data) => { const r = await fetch('/api/v1' + url, { method: 'POST', headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || 'API Error'); } return r.json(); };
        if (typeof apiPut === 'undefined') window.apiPut = async (url, data) => { const r = await fetch('/api/v1' + url, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || 'API Error'); } return r.json(); };
        if (typeof apiDelete === 'undefined') window.apiDelete = async (url) => { const r = await fetch('/api/v1' + url, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + getToken() } }); if (!r.ok) throw new Error('API Error'); return r.json(); };
        if (typeof showToast === 'undefined') window.showToast = (msg, type) => { const t = document.getElementById('toast'); if (t) { t.textContent = msg; t.className = 'toast ' + (type||'info') + ' show'; setTimeout(() => t.classList.remove('show'), 3000); } else { console.log('[Toast]', type, msg); alert(msg); } };
        if (typeof formatMoney === 'undefined') window.formatMoney = (n) => Number(n||0).toLocaleString();
        if (typeof formatDate === 'undefined') window.formatDate = (d) => { if (!d) return ''; const dt = new Date(d); return dt.getFullYear() + '/' + (dt.getMonth()+1) + '/' + dt.getDate(); };
        if (typeof getStatusText === 'undefined') window.getStatusText = (s) => ({ active:'進行中', paused:'已暫停', closed:'已結束', collecting:'集資中', locked:'已鎖定', purchased:'已購買', drawn:'已開獎', settled:'已結算' }[s] || s);

        let currentFilter = 'all', lotteryTypes = [], selectedMainNumbers = [], selectedSpecialNumber = null, selectedTicketId = null;
        
        const LOTTERY_CONFIGS = {
            'super_lotto': { name: '威力彩', icon: '🔴', mainCount: 6, mainMax: 38, hasSpecial: true, specialMax: 8 },
            'lotto649': { name: '大樂透', icon: '🔵', mainCount: 6, mainMax: 49, hasSpecial: false },
            'daily_cash': { name: '今彩539', icon: '🟢', mainCount: 5, mainMax: 39, hasSpecial: false }
        };
        
        function openModal(id) { $(id).classList.add('active'); }
        function closeModal(id) { $(id).classList.remove('active'); }
        
        async function loadStats() {
            try {
                const stats = await apiGet('/personal/stats');
                if (!stats) return;
                $('total-profit').textContent = `${stats.profit >= 0 ? '+' : ''}$${Number(stats.profit).toLocaleString()}`;
                $('win-rate').textContent = `${stats.win_rate}%`;
                $('total-tickets').textContent = stats.total_tickets;
                $('total-cost').textContent = `$${Number(stats.total_cost).toLocaleString()}`;
                $('total-prize').textContent = `$${Number(stats.total_prize).toLocaleString()}`;
            } catch (e) { console.error('Failed to load stats:', e); }
        }
        
        async function loadTickets() {
            try {
                const statusParam = currentFilter !== 'all' ? `?status=${currentFilter}` : '';
                const data = await apiGet(`/personal/tickets${statusParam}`);
                if (!data) return;
                const container = $('ticket-list');
                if (data.tickets.length === 0) { container.innerHTML = `<div class="empty-state"><div class="empty-icon">🎫</div><p class="empty-text">還沒有彩券記錄<br>點擊「新增彩券」開始記錄</p></div>`; return; }
                container.innerHTML = data.tickets.map(t => {
                    const config = LOTTERY_CONFIGS[t.lottery_type_code] || { icon: '🎰', name: t.lottery_type_name };
                    return `<div class="ticket-card"><div class="ticket-header"><div class="ticket-type"><div class="ticket-type-icon ${t.lottery_type_code}">${config.icon}</div><div><div class="ticket-type-name">${t.lottery_type_name}</div><div class="ticket-date">${t.draw_term || formatDateShort(t.created_at)}</div></div></div><span class="ticket-status ${t.status}">${getStatusText(t.status)}</span></div><div class="ticket-numbers">${t.numbers.map(n => `<div class="number-ball">${String(n).padStart(2, '0')}</div>`).join('')}${t.special_number ? `<div class="number-ball special">${String(t.special_number).padStart(2, '0')}</div>` : ''}</div><div class="ticket-footer"><span class="ticket-cost">花費: $${Number(t.cost).toLocaleString()}</span>${t.prize > 0 ? `<span class="ticket-prize">+$${Number(t.prize).toLocaleString()}</span>` : ''}<div class="ticket-actions">${t.status === 'pending' ? `<button class="ticket-action check" onclick="showSingleCheck(${t.id})">對獎</button>` : ''}<button class="ticket-action delete" onclick="deleteTicket(${t.id})">刪除</button></div></div></div>`;
                }).join('');
            } catch (e) { console.error('Failed to load tickets:', e); }
        }
        
        async function loadLotteryTypes() {
            try {
                const types = await apiGet('/lottery-types/');
                if (!types) return;
                lotteryTypes = types;
                $('lottery-type').innerHTML = '<option value="">請選擇</option>' + types.map(t => `<option value="${t.id}" data-code="${t.code}">${t.name}</option>`).join('');
            } catch (e) { console.error('Failed to load lottery types:', e); }
        }
        
        async function loadAchievements() {
            try {
                const data = await apiGet('/achievements/');
                if (!data) return;
                const container = $('achievement-badges');
                const unlocked = data.achievements.filter(a => a.is_unlocked).slice(0, 6);
                const locked = data.achievements.filter(a => !a.is_unlocked).slice(0, 6 - unlocked.length);
                container.innerHTML = [...unlocked, ...locked].map(a => `<div class="achievement-badge ${a.is_unlocked ? 'unlocked' : 'locked'}" title="${a.name}">${a.icon}</div>`).join('') || '<span style="color: var(--text-secondary); font-size: 13px;">暫無成就</span>';
            } catch (e) { console.error('Failed to load achievements:', e); }
        }
        
        async function showAchievements() {
            openModal('achievements-modal');
            try {
                const data = await apiGet('/achievements/');
                if (!data) return;
                $('achievements-content').innerHTML = `<div style="text-align: center; margin-bottom: 20px;"><div style="font-size: 32px; font-weight: 900; color: var(--sela-orange);">${data.total_points}</div><div style="font-size: 13px; color: var(--text-secondary);">總點數</div><div style="margin-top: 8px; font-size: 12px;">已解鎖 ${data.unlocked_count} / ${data.total_count}</div></div>${data.achievements.map(a => `<div style="display: flex; gap: 12px; padding: 12px; background: ${a.is_unlocked ? '#FFF8E1' : '#f5f5f5'}; border-radius: 8px; margin-bottom: 8px;"><div style="font-size: 28px; ${a.is_unlocked ? '' : 'filter: grayscale(1); opacity: 0.5;'}">${a.icon}</div><div style="flex: 1;"><div style="font-weight: 600; font-size: 14px;">${a.name}</div><div style="font-size: 12px; color: var(--text-secondary);">${a.description}</div><div style="font-size: 11px; margin-top: 4px;">進度: ${a.progress} / ${a.threshold}${a.is_unlocked ? ` <span style="color: var(--success);">✓ +${a.points}點</span>` : ''}</div></div></div>`).join('')}`;
            } catch (e) { $('achievements-content').innerHTML = '<p style="color: var(--danger);">載入失敗</p>'; }
        }
        
        function updateNumberGrid() {
            const select = $('lottery-type'), option = select.options[select.selectedIndex], code = option?.dataset?.code, config = LOTTERY_CONFIGS[code];
            selectedMainNumbers = []; selectedSpecialNumber = null;
            if (!config) { $('main-numbers').innerHTML = ''; $('special-group').style.display = 'none'; return; }
            $('main-numbers').innerHTML = Array.from({length: config.mainMax}, (_, i) => i + 1).map(n => `<button class="number-btn" onclick="toggleMainNumber(${n})">${n}</button>`).join('');
            if (config.hasSpecial) { $('special-group').style.display = 'block'; $('special-numbers').innerHTML = Array.from({length: config.specialMax}, (_, i) => i + 1).map(n => `<button class="number-btn" onclick="toggleSpecialNumber(${n})">${n}</button>`).join(''); }
            else { $('special-group').style.display = 'none'; }
            updateSelectedDisplay();
        }
        
        function toggleMainNumber(n) {
            const select = $('lottery-type'), option = select.options[select.selectedIndex], config = LOTTERY_CONFIGS[option?.dataset?.code];
            const idx = selectedMainNumbers.indexOf(n);
            if (idx >= 0) selectedMainNumbers.splice(idx, 1);
            else if (selectedMainNumbers.length < config.mainCount) selectedMainNumbers.push(n);
            updateSelectedDisplay();
        }
        
        function toggleSpecialNumber(n) { selectedSpecialNumber = selectedSpecialNumber === n ? null : n; updateSelectedDisplay(); }
        
        function updateSelectedDisplay() {
            $('selected-main').innerHTML = selectedMainNumbers.length > 0 ? selectedMainNumbers.sort((a,b) => a-b).map(n => `<div class="number-ball" style="width: 28px; height: 28px; font-size: 11px;">${n}</div>`).join('') : '<span style="color: var(--text-secondary); font-size: 12px;">請選擇號碼</span>';
            document.querySelectorAll('#main-numbers .number-btn').forEach(btn => btn.classList.toggle('selected', selectedMainNumbers.includes(parseInt(btn.textContent))));
            $('selected-special').innerHTML = selectedSpecialNumber ? `<div class="number-ball special" style="width: 28px; height: 28px; font-size: 11px;">${selectedSpecialNumber}</div>` : '<span style="color: var(--text-secondary); font-size: 12px;">請選擇特別號</span>';
            document.querySelectorAll('#special-numbers .number-btn').forEach(btn => btn.classList.toggle('special-selected', parseInt(btn.textContent) === selectedSpecialNumber));
        }
        
        async function createTicket() {
            const select = $('lottery-type'), option = select.options[select.selectedIndex];
            if (!option.value) { showToast('請選擇彩種', 'error'); return; }
            const code = option.dataset.code, config = LOTTERY_CONFIGS[code];
            if (selectedMainNumbers.length !== config.mainCount) { showToast(`請選擇 ${config.mainCount} 個號碼`, 'error'); return; }
            if (config.hasSpecial && !selectedSpecialNumber) { showToast('請選擇特別號', 'error'); return; }
            try {
                await apiPost('/personal/tickets', { lottery_type_id: parseInt(option.value), numbers: selectedMainNumbers.sort((a,b) => a-b), special_number: selectedSpecialNumber, cost: parseInt($('ticket-cost').value) || 100, draw_term: $('draw-term').value || null, note: $('ticket-note').value || null });
                closeModal('add-modal'); showToast('彩券已新增', 'success'); loadStats(); loadTickets();
            } catch (e) { showToast(e.message, 'error'); }
        }
        
        async function deleteTicket(id) {
            if (!confirm('確定要刪除這張彩券嗎？')) return;
            try { await apiDelete(`/personal/tickets/${id}`); showToast('已刪除', 'success'); loadStats(); loadTickets(); }
            catch (e) { showToast(e.message, 'error'); }
        }
        
        async function checkTickets() {
            const numbersStr = $('winning-numbers').value, special = $('winning-special').value;
            if (!numbersStr) { showToast('請輸入開獎號碼', 'error'); return; }
            const numbers = numbersStr.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
            if (numbers.length < 5) { showToast('請輸入至少 5 個號碼', 'error'); return; }
            try { await apiPost('/personal/tickets/check', { winning_numbers: numbers, special_number: special ? parseInt(special) : null }); closeModal('check-modal'); showToast('對獎完成', 'success'); loadStats(); loadTickets(); }
            catch (e) { showToast(e.message, 'error'); }
        }
        
        function showSingleCheck(id) { selectedTicketId = id; showCheckModal(); }
        function showAddModal() { selectedMainNumbers = []; selectedSpecialNumber = null; $('lottery-type').value = ''; $('draw-term').value = ''; $('ticket-note').value = ''; $('main-numbers').innerHTML = ''; $('special-group').style.display = 'none'; openModal('add-modal'); }
        function showCheckModal() { selectedTicketId = null; $('winning-numbers').value = ''; $('winning-special').value = ''; openModal('check-modal'); }
        
        function getStatusText(status) { return { pending: '待開獎', won: '已中獎', lost: '未中獎' }[status] || status; }
        function formatDateShort(dateStr) { if (!dateStr) return ''; const d = new Date(dateStr); return `${d.getMonth()+1}/${d.getDate()}`; }
        
        async function apiDelete(url) {
            const token = localStorage.getItem('access_token');
            const res = await fetch(`/api/v1${url}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'API Error'); }
        }
        
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => { document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); currentFilter = tab.dataset.filter; loadTickets(); });
        });
        document.querySelectorAll('.modal-overlay').forEach(overlay => { overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('active'); }); });
        
        async function init() {
            const user = await checkAuth();
            if (!user) return;
            await loadLotteryTypes();
            loadStats(); loadTickets(); loadAchievements();
        }
        
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
    </script>
</body>
</html>
