<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <title>設定 - SELA 樂透一路發</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <style>
        :root {
            --sela-orange: #F26522;
            --sela-orange-dark: #D85A1E;
            --bg-primary: #FFF8F4;
            --bg-secondary: #FFF0E8;
            --bg-card: #FFFFFF;
            --text-primary: #2D2420;
            --text-secondary: #8B7355;
            --border-color: rgba(242, 101, 34, 0.12);
            --danger: #DC2626;
            --shadow-md: 0 4px 16px rgba(242, 101, 34, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary); 
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 40px;
        }
        
        /* ===== Header 統一樣式（返回鍵右上角）===== */
        .header {
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark));
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }
        .header .brand {
            color: white;
            font-size: 18px;
            font-weight: 700;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        /* ===== Main ===== */
        .main { padding: 16px; max-width: 600px; margin: 0 auto; }
        
        /* Profile Card */
        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: center;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--bg-secondary);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            overflow: hidden;
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .profile-email { font-size: 14px; color: var(--text-secondary); }
        
        /* Section */
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .section-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
        }
        
        /* Menu Items */
        .menu-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item-left { display: flex; align-items: center; gap: 12px; }
        .menu-icon { font-size: 20px; }
        .menu-label { font-size: 15px; }
        .menu-value { font-size: 14px; color: var(--text-secondary); }
        .menu-arrow { color: var(--text-secondary); }
        
        /* Form */
        .form-group { padding: 14px 16px; border-bottom: 1px solid var(--border-color); }
        .form-group:last-child { border-bottom: none; }
        .form-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; display: block; }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
        }
        .form-input:focus { outline: none; border-color: var(--sela-orange); }
        
        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: 8px;
        }
        .btn-primary { background: var(--sela-orange); color: white; }
        .btn-danger { background: white; color: var(--danger); border: 1px solid var(--danger); }
        
        /* Toast */
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text-primary); color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 2000; opacity: 0; transition: all 0.3s; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: #16A34A; }
        .toast.error { background: var(--danger); }
    
        @media (min-width: 900px) {
            .header { padding-left: calc((100vw - 800px) / 2 + 20px); padding-right: calc((100vw - 800px) / 2 + 20px); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="/static/logo.jpg" alt="SELA" class="logo">
            <span class="brand">設定</span>
        </div>
        <a href="/dashboard" class="back-btn">← 返回</a>
    </header>
    
    <main class="main">
        <!-- Profile -->
        <div class="profile-card">
            <div class="profile-avatar" id="profile-avatar">👤</div>
            <div class="profile-name" id="profile-name">載入中...</div>
            <div class="profile-email" id="profile-email"></div>
        </div>
        
        <!-- Profile Settings -->
        <div class="section">
            <div class="section-header">個人資料</div>
            <div class="form-group">
                <label class="form-label">暱稱</label>
                <input type="text" class="form-input" id="input-nickname" placeholder="輸入暱稱">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="input-email" placeholder="輸入 Email">
            </div>
            <div class="form-group">
                <label class="form-label">電話</label>
                <input type="tel" class="form-input" id="input-phone" placeholder="輸入電話">
            </div>
            <div style="padding: 14px 16px;">
                <button class="btn btn-primary" onclick="saveProfile()">儲存變更</button>
            </div>
        </div>
        
        <!-- Account Info -->
        <div class="section">
            <div class="section-header">帳號資訊</div>
            <div class="menu-item">
                <div class="menu-item-left">
                    <span class="menu-icon">🆔</span>
                    <span class="menu-label">LINE ID</span>
                </div>
                <span class="menu-value" id="line-id">-</span>
            </div>
            <div class="menu-item">
                <div class="menu-item-left">
                    <span class="menu-icon">📅</span>
                    <span class="menu-label">註冊日期</span>
                </div>
                <span class="menu-value" id="created-at">-</span>
            </div>
            <div class="menu-item">
                <div class="menu-item-left">
                    <span class="menu-icon">🏷️</span>
                    <span class="menu-label">角色</span>
                </div>
                <span class="menu-value" id="role">-</span>
            </div>
        </div>
        
        <!-- Logout -->
        <button class="btn btn-danger" onclick="logout()">登出</button>
    </main>
    
    <div id="toast" class="toast"></div>
    
    <script src="/static/js/common.js"></script>
    <script>
        // 備援函數
        if (typeof $ === 'undefined') window.$ = id => document.getElementById(id);
        if (typeof setText === 'undefined') window.setText = (id, t) => { const e = $(id); if(e) e.textContent = t; };
        if (typeof getToken === 'undefined') window.getToken = () => { try { return localStorage.getItem('access_token'); } catch(e) { return null; } };
        if (typeof removeToken === 'undefined') window.removeToken = () => { try { localStorage.removeItem('access_token'); } catch(e) {} };
        if (typeof apiGet === 'undefined') window.apiGet = async (url) => { const r = await fetch('/api/v1' + url, { headers: { 'Authorization': 'Bearer ' + getToken() } }); if (!r.ok) throw new Error('API Error'); return r.json(); };
        if (typeof apiPut === 'undefined') window.apiPut = async (url, data) => { const r = await fetch('/api/v1' + url, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || 'Error'); } return r.json(); };
        if (typeof showToast === 'undefined') window.showToast = (msg, type) => { const t = $('toast'); if(t) { t.textContent = msg; t.className = 'toast ' + (type||'') + ' show'; setTimeout(() => t.classList.remove('show'), 3000); } };
        
        let userData = null;
        
        async function loadProfile() {
            try {
                userData = await apiGet('/users/me');
                if (!userData) return;
                
                const avatar = $('profile-avatar');
                if (userData.picture_url) {
                    avatar.innerHTML = `<img src="${userData.picture_url}" alt="avatar">`;
                }
                
                setText('profile-name', userData.display_name || userData.line_name || '用戶');
                setText('profile-email', userData.email || '');
                
                $('input-nickname').value = userData.display_name || '';
                $('input-email').value = userData.email || '';
                $('input-phone').value = userData.phone || '';
                
                setText('line-id', userData.line_user_id?.substring(0, 10) + '...' || '-');
                setText('created-at', userData.created_at ? new Date(userData.created_at).toLocaleDateString() : '-');
                setText('role', userData.role === 'admin' ? '管理員' : '一般用戶');
            } catch (e) {
                console.error('loadProfile:', e);
            }
        }
        
        async function saveProfile() {
            const nickname = $('input-nickname').value.trim();
            const email = $('input-email').value.trim();
            const phone = $('input-phone').value.trim();
            
            try {
                await apiPut('/users/me', {
                    display_name: nickname,
                    email: email,
                    phone: phone
                });
                showToast('儲存成功！', 'success');
                loadProfile();
            } catch (e) {
                showToast(e.message || '儲存失敗', 'error');
            }
        }
        
        function logout() {
            if (confirm('確定要登出嗎？')) {
                removeToken();
                window.location.href = '/';
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            if (!getToken()) { window.location.href = '/'; return; }
            loadProfile();
        });
    </script>
</body>
</html>
