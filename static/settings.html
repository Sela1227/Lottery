<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <title>設定 - SELA 樂透一路發</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --sela-orange: #F26522;
            --sela-dark: #1a1a2e;
            --success: #4CAF50;
            --danger: #f44336;
            --warning: #FF9800;
            --info: #2196F3;
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #666;
            --border-color: #e0e0e0;
            --line-green: #06C755;
        }
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, var(--sela-orange), #D85A1E);
            padding: 16px 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 700;
        }
        
        /* Main Content */
        main {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        
        /* Profile Card */
        .profile-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--sela-orange), #FF8547);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 32px;
            color: #fff;
            font-weight: 700;
            overflow: hidden;
        }
        
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .profile-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .profile-role {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 4px 12px;
            background: #f0f0f0;
            border-radius: 12px;
            display: inline-block;
        }
        
        .profile-role.admin {
            background: #FFF3E0;
            color: var(--sela-orange);
        }
        
        /* Section */
        .section {
            background: var(--bg-secondary);
            border-radius: 16px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .section-header {
            padding: 16px 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .section-content {
            padding: 20px;
        }
        
        /* Form */
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--sela-orange);
        }
        
        .form-input:disabled {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        
        .form-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        /* Button */
        .btn {
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--sela-orange), #D85A1E);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(242, 101, 34, 0.3);
        }
        
        .btn-line {
            background: var(--line-green);
            color: #fff;
        }
        
        .btn-line:hover {
            background: #05B54D;
        }
        
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        
        .btn-sm {
            padding: 10px 16px;
            font-size: 14px;
        }
        
        /* Menu Item */
        .menu-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            color: inherit;
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-item:hover {
            background: #f9f9f9;
        }
        
        .menu-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 14px;
        }
        
        .menu-icon.line {
            background: var(--line-green);
            color: #fff;
        }
        
        .menu-content {
            flex: 1;
        }
        
        .menu-title {
            font-weight: 600;
            font-size: 15px;
        }
        
        .menu-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        
        .menu-value {
            font-size: 14px;
            color: var(--text-secondary);
            margin-right: 8px;
        }
        
        .menu-value.connected {
            color: var(--success);
        }
        
        .menu-arrow {
            color: #ccc;
            font-size: 18px;
        }
        
        /* Toggle Switch */
        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .toggle-item:last-child {
            border-bottom: none;
        }
        
        .toggle-label {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .toggle-icon {
            font-size: 20px;
        }
        
        .toggle-text {
            font-size: 15px;
            font-weight: 500;
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 28px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        
        .toggle-switch input:checked + .toggle-slider {
            background-color: var(--sela-orange);
        }
        
        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(22px);
        }
        
        .toggle-switch input:disabled + .toggle-slider {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: #fff;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
            max-width: 90%;
            text-align: center;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: var(--warning); }
        
        /* Status Badge */
        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-badge.connected {
            background: #E8F5E9;
            color: var(--success);
        }
        
        .status-badge.disconnected {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        
        /* Alert Box */
        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        
        .alert.success {
            background: #E8F5E9;
            color: var(--success);
        }
        
        .alert.error {
            background: #FFEBEE;
            color: var(--danger);
        }
        
        .alert.info {
            background: #E3F2FD;
            color: var(--info);
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/dashboard" class="back-btn">←</a>
        <h1 class="header-title">⚙️ 設定</h1>
    </header>
    
    <main>
        <!-- Alert Messages -->
        <div id="alert-container"></div>
        
        <!-- Profile Card -->
        <div class="profile-card">
            <div class="profile-avatar" id="profile-avatar">
                <span>?</span>
            </div>
            <div class="profile-name" id="profile-name">載入中...</div>
            <span class="profile-role" id="profile-role">會員</span>
        </div>
        
        <!-- 個人資料 -->
        <div class="section">
            <div class="section-header">
                <span>👤</span>
                <span>個人資料</span>
            </div>
            <div class="section-content">
                <div class="form-group">
                    <label class="form-label">LINE 名稱</label>
                    <input type="text" class="form-input" id="display-name" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">暱稱</label>
                    <input type="text" class="form-input" id="nickname" placeholder="設定您的暱稱" maxlength="50">
                    <p class="form-hint">在系統中顯示的名稱，留空則使用 LINE 名稱</p>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="email" placeholder="選填">
                </div>
                <div class="form-group">
                    <label class="form-label">電話</label>
                    <input type="tel" class="form-input" id="phone" placeholder="選填">
                </div>
                <button class="btn btn-primary" id="save-btn" onclick="saveProfile()">
                    💾 儲存變更
                </button>
            </div>
        </div>
        
        <!-- 通知設定 -->
        <div class="section">
            <div class="section-header">
                <span>🔔</span>
                <span>通知設定</span>
            </div>
            
            <!-- LINE Notify 連結 -->
            <div class="menu-item" id="line-notify-item" onclick="handleLineNotify()">
                <span class="menu-icon line">📱</span>
                <div class="menu-content">
                    <div class="menu-title">LINE Notify</div>
                    <div class="menu-desc" id="line-notify-desc">連結 LINE 接收通知</div>
                </div>
                <span class="status-badge disconnected" id="line-notify-status">未連結</span>
                <span class="menu-arrow">›</span>
            </div>
            
            <!-- 通知開關 -->
            <div id="notify-toggles" style="display: none;">
                <div class="toggle-item">
                    <div class="toggle-label">
                        <span class="toggle-icon">🎰</span>
                        <span class="toggle-text">開獎提醒</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="notify-draw" checked onchange="updateNotifySettings()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="toggle-item">
                    <div class="toggle-label">
                        <span class="toggle-icon">🎉</span>
                        <span class="toggle-text">中獎通知</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="notify-win" checked onchange="updateNotifySettings()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="toggle-item">
                    <div class="toggle-label">
                        <span class="toggle-icon">💰</span>
                        <span class="toggle-text">結算通知</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="notify-settlement" checked onchange="updateNotifySettings()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <!-- 測試通知按鈕 -->
                <div style="padding: 16px 20px;">
                    <button class="btn btn-outline btn-sm" onclick="sendTestNotify()">
                        🔔 發送測試通知
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 其他 -->
        <div class="section">
            <div class="section-header">
                <span>ℹ️</span>
                <span>其他</span>
            </div>
            <a href="/personal" class="menu-item">
                <span class="menu-icon">🎫</span>
                <div class="menu-content">
                    <div class="menu-title">個人彩券</div>
                    <div class="menu-desc">管理個人購買的彩券</div>
                </div>
                <span class="menu-arrow">›</span>
            </a>
            <a href="/statistics" class="menu-item">
                <span class="menu-icon">📊</span>
                <div class="menu-content">
                    <div class="menu-title">統計報表</div>
                    <div class="menu-desc">查看投資報酬率</div>
                </div>
                <span class="menu-arrow">›</span>
            </a>
            <div class="menu-item" onclick="logout()">
                <span class="menu-icon" style="background: #FFEBEE;">🚪</span>
                <div class="menu-content">
                    <div class="menu-title" style="color: var(--danger);">登出</div>
                    <div class="menu-desc">登出此帳號</div>
                </div>
                <span class="menu-arrow">›</span>
            </div>
        </div>
    </main>
    
    <div id="toast" class="toast"></div>
    
    <script>
        const API_BASE = '/api/v1';
        let userData = null;
        let notifySettings = null;
        
        // 檢查 URL 參數顯示提示
        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const container = document.getElementById('alert-container');
            
            if (params.get('notify_success') === '1') {
                container.innerHTML = '<div class="alert success">✅ LINE Notify 連結成功！</div>';
                // 清除 URL 參數
                window.history.replaceState({}, '', '/settings');
            }
            
            if (params.get('notify_error')) {
                const error = params.get('notify_error');
                container.innerHTML = `<div class="alert error">❌ 連結失敗：${error}</div>`;
                window.history.replaceState({}, '', '/settings');
            }
        }
        
        // Auth Check
        async function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = '/';
                return false;
            }
            return true;
        }
        
        // API Helpers
        async function apiGet(url) {
            const token = localStorage.getItem('access_token');
            const res = await fetch(`${API_BASE}${url}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) {
                if (res.status === 401) {
                    window.location.href = '/';
                    return null;
                }
                throw new Error((await res.json()).detail || 'API Error');
            }
            return res.json();
        }
        
        async function apiPut(url, data) {
            const token = localStorage.getItem('access_token');
            const res = await fetch(`${API_BASE}${url}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            if (!res.ok) {
                throw new Error((await res.json()).detail || 'API Error');
            }
            return res.json();
        }
        
        async function apiPost(url, data = {}) {
            const token = localStorage.getItem('access_token');
            const res = await fetch(`${API_BASE}${url}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            if (!res.ok) {
                throw new Error((await res.json()).detail || 'API Error');
            }
            return res.json();
        }
        
        // Load User Profile
        async function loadProfile() {
            try {
                userData = await apiGet('/users/me');
                if (!userData) return;
                
                // Update UI
                const avatarEl = document.getElementById('profile-avatar');
                if (userData.picture_url) {
                    avatarEl.innerHTML = `<img src="${userData.picture_url}" alt="avatar">`;
                } else {
                    avatarEl.innerHTML = `<span>${(userData.nickname || userData.display_name).charAt(0)}</span>`;
                }
                
                document.getElementById('profile-name').textContent = 
                    userData.nickname || userData.display_name;
                
                const roleEl = document.getElementById('profile-role');
                if (userData.role === 'admin') {
                    roleEl.textContent = '👑 系統管理員';
                    roleEl.classList.add('admin');
                } else {
                    roleEl.textContent = '一般會員';
                }
                
                // Fill form
                document.getElementById('display-name').value = userData.display_name;
                document.getElementById('nickname').value = userData.nickname || '';
                document.getElementById('email').value = userData.email || '';
                document.getElementById('phone').value = userData.phone || '';
                
            } catch (e) {
                console.error('Failed to load profile:', e);
                showToast('載入失敗', 'error');
            }
        }
        
        // Load Notify Settings
        async function loadNotifySettings() {
            try {
                notifySettings = await apiGet('/notify/settings');
                if (!notifySettings) return;
                
                const statusEl = document.getElementById('line-notify-status');
                const descEl = document.getElementById('line-notify-desc');
                const togglesEl = document.getElementById('notify-toggles');
                
                if (notifySettings.line_notify_connected) {
                    statusEl.textContent = '已連結';
                    statusEl.className = 'status-badge connected';
                    descEl.textContent = '點擊管理或解除連結';
                    togglesEl.style.display = 'block';
                    
                    // 設定開關狀態
                    document.getElementById('notify-draw').checked = notifySettings.notify_draw_reminder;
                    document.getElementById('notify-win').checked = notifySettings.notify_win_alert;
                    document.getElementById('notify-settlement').checked = notifySettings.notify_settlement;
                } else {
                    statusEl.textContent = '未連結';
                    statusEl.className = 'status-badge disconnected';
                    descEl.textContent = '連結 LINE 接收通知';
                    togglesEl.style.display = 'none';
                }
                
                if (!notifySettings.line_notify_enabled) {
                    statusEl.textContent = '未啟用';
                    descEl.textContent = 'LINE Notify 功能尚未啟用';
                    document.getElementById('line-notify-item').style.opacity = '0.5';
                    document.getElementById('line-notify-item').style.pointerEvents = 'none';
                }
                
            } catch (e) {
                console.error('Failed to load notify settings:', e);
            }
        }
        
        // Handle LINE Notify
        function handleLineNotify() {
            if (!notifySettings) return;
            
            if (notifySettings.line_notify_connected) {
                // 已連結，詢問是否解除
                if (confirm('確定要解除 LINE Notify 連結嗎？\n解除後將不再收到通知。')) {
                    disconnectLineNotify();
                }
            } else {
                // 未連結，跳轉授權
                window.location.href = `${API_BASE}/notify/line/connect`;
            }
        }
        
        // Disconnect LINE Notify
        async function disconnectLineNotify() {
            try {
                await apiPost('/notify/line/disconnect');
                showToast('已解除 LINE Notify 連結', 'success');
                loadNotifySettings();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        // Update Notify Settings
        async function updateNotifySettings() {
            try {
                await apiPut('/notify/settings', {
                    notify_draw_reminder: document.getElementById('notify-draw').checked,
                    notify_win_alert: document.getElementById('notify-win').checked,
                    notify_settlement: document.getElementById('notify-settlement').checked
                });
            } catch (e) {
                console.error('Failed to update notify settings:', e);
            }
        }
        
        // Send Test Notify
        async function sendTestNotify() {
            try {
                await apiPost('/notify/test');
                showToast('測試通知已發送，請查看 LINE', 'success');
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        // Save Profile
        async function saveProfile() {
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerHTML = '儲存中...';
            
            try {
                const data = {
                    nickname: document.getElementById('nickname').value.trim() || null,
                    email: document.getElementById('email').value.trim() || null,
                    phone: document.getElementById('phone').value.trim() || null
                };
                
                userData = await apiPut('/users/me', data);
                
                // Update display
                document.getElementById('profile-name').textContent = 
                    userData.nickname || userData.display_name;
                
                showToast('設定已儲存', 'success');
            } catch (e) {
                showToast(e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '💾 儲存變更';
            }
        }
        
        // Logout
        function logout() {
            if (confirm('確定要登出嗎？')) {
                localStorage.removeItem('access_token');
                window.location.href = '/';
            }
        }
        
        // Toast
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // Init
        async function init() {
            checkUrlParams();
            if (!await checkAuth()) return;
            await loadProfile();
            await loadNotifySettings();
        }
        
        init();
    </script>
</body>
</html>
