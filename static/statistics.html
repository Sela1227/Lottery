<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <title>統計報表 - SELA 樂透一路發</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <style>
        :root {
            --sela-orange: #F26522;
            --sela-orange-dark: #D85A1E;
            --bg-primary: #FFF8F4;
            --bg-secondary: #FFF0E8;
            --bg-card: #FFFFFF;
            --text-primary: #2D2420;
            --text-secondary: #8B7355;
            --border-color: rgba(242, 101, 34, 0.12);
            --success: #16A34A;
            --danger: #DC2626;
            --info: #2196F3;
            --shadow-md: 0 4px 16px rgba(242, 101, 34, 0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary); 
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 40px;
        }
        
        /* ===== Header 統一樣式 ===== */
        .header {
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark));
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }
        .header .brand {
            color: white;
            font-size: 18px;
            font-weight: 700;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        /* ===== Main 統一樣式 ===== */
        .main {
            padding: 16px;
            max-width: 100%;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .main { max-width: 600px; padding: 20px; }
        }
        
        /* ROI Card */
        .roi-card {
            background: linear-gradient(135deg, #1a1a2e, #2d2d44);
            border-radius: 16px;
            padding: 20px;
            color: white;
            margin-bottom: 16px;
            box-shadow: var(--shadow-md);
        }
        .roi-label { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 6px; }
        .roi-value { font-size: 40px; font-weight: 900; margin-bottom: 6px; }
        .roi-value.positive { color: #4ADE80; }
        .roi-value.negative { color: #F87171; }
        .roi-detail { font-size: 13px; color: rgba(255,255,255,0.8); }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .stat-value { font-size: 18px; font-weight: 700; color: var(--sela-orange); margin-bottom: 4px; }
        .stat-value.green { color: var(--success); }
        .stat-value.blue { color: var(--info); }
        .stat-label { font-size: 11px; color: var(--text-secondary); }
        
        /* Section */
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .section-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
            font-weight: 700;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }
        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            position: relative;
        }
        .tab.active { color: var(--sela-orange); background: var(--bg-card); }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: var(--sela-orange);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Performance List */
        .perf-list { padding: 0; }
        .perf-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .perf-item:last-child { border-bottom: none; }
        .perf-info { flex: 1; }
        .perf-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
        .perf-detail { font-size: 11px; color: var(--text-secondary); }
        .perf-roi { text-align: right; }
        .perf-roi-value { font-weight: 700; font-size: 15px; }
        .perf-roi-value.positive { color: var(--success); }
        .perf-roi-value.negative { color: var(--danger); }
        .perf-profit { font-size: 11px; color: var(--text-secondary); }
        
        /* Winning List */
        .win-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .win-item:last-child { border-bottom: none; }
        .win-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .win-title { font-weight: 600; font-size: 14px; }
        .win-amount { font-weight: 700; font-size: 15px; color: var(--success); }
        .win-detail { font-size: 11px; color: var(--text-secondary); }
        
        /* Chart */
        .chart-container { padding: 16px; }
        .chart-bars {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 120px;
            gap: 6px;
        }
        .chart-bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 40px;
        }
        .chart-bar {
            width: 14px;
            border-radius: 3px 3px 0 0;
            transition: height 0.5s ease;
            min-height: 3px;
        }
        .chart-bar.invested { background: linear-gradient(135deg, #94A3B8, #64748B); }
        .chart-bar.prize { background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark)); }
        .chart-label { font-size: 10px; color: var(--text-secondary); margin-top: 6px; }
        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .legend-dot { width: 8px; height: 8px; border-radius: 2px; }
        
        /* Empty & Loading */
        .empty-state { padding: 30px; text-align: center; color: var(--text-secondary); }
        .empty-icon { font-size: 36px; margin-bottom: 10px; }
        .loading { display: flex; justify-content: center; padding: 30px; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--sela-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="/static/logo.jpg" alt="SELA" class="logo">
            <span class="brand">統計報表</span>
        </div>
        <a href="/dashboard" class="back-btn">← 返回</a>
    </header>
    
    <main class="main">
        <!-- ROI Card -->
        <div class="roi-card">
            <div class="roi-label">整體投報率</div>
            <div class="roi-value" id="overall-roi">0%</div>
            <div class="roi-detail" id="roi-detail">投入 $0 / 獎金 $0</div>
        </div>
        
        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-value" id="total-invested">$0</div>
                <div class="stat-label">累計投入</div>
            </div>
            <div class="stat-item">
                <div class="stat-value green" id="total-prize">$0</div>
                <div class="stat-label">累計獎金</div>
            </div>
            <div class="stat-item">
                <div class="stat-value blue" id="total-groups">0</div>
                <div class="stat-label">參與期數</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="win-rate">0%</div>
                <div class="stat-label">中獎率</div>
            </div>
        </div>
        
        <!-- Monthly Chart -->
        <div class="section">
            <div class="section-header">📊 月度趨勢</div>
            <div class="chart-container">
                <div class="chart-bars" id="chart-bars">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
                <div class="chart-legend">
                    <div class="legend-item"><div class="legend-dot" style="background:#64748B;"></div>投入</div>
                    <div class="legend-item"><div class="legend-dot" style="background:var(--sela-orange);"></div>獎金</div>
                </div>
            </div>
        </div>
        
        <!-- Tabs Section -->
        <div class="section">
            <div class="tabs">
                <button class="tab active" data-tab="performance">集資績效</button>
                <button class="tab" data-tab="winning">中獎記錄</button>
            </div>
            <div id="tab-performance" class="tab-content active">
                <div class="perf-list" id="perf-list">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
            <div id="tab-winning" class="tab-content">
                <div class="perf-list" id="win-list">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
    </main>
    
    <script src="/static/js/common.js"></script>
    <script>
        // 備援函數
        if (typeof $ === 'undefined') window.$ = id => document.getElementById(id);
        if (typeof setText === 'undefined') window.setText = (id, t) => { const e = document.getElementById(id); if(e) e.textContent = t; };
        if (typeof getToken === 'undefined') window.getToken = () => { try { return localStorage.getItem('access_token'); } catch(e) { return null; } };
        if (typeof apiGet === 'undefined') window.apiGet = async (url) => { const r = await fetch('/api/v1' + url, { headers: { 'Authorization': 'Bearer ' + getToken() } }); if (!r.ok) throw new Error('API Error'); return r.json(); };
        if (typeof formatMoney === 'undefined') window.formatMoney = (n) => Number(n||0).toLocaleString();
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const tabId = tab.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                $(`tab-${tabId}`).classList.add('active');
            });
        });
        
        async function loadOverallStats() {
            try {
                const data = await apiGet('/statistics/overall');
                if (!data) return;
                
                const roi = data.total_invested > 0 
                    ? ((data.total_prize - data.total_invested) / data.total_invested * 100).toFixed(1) 
                    : 0;
                const roiEl = $('overall-roi');
                roiEl.textContent = roi + '%';
                roiEl.className = 'roi-value ' + (roi >= 0 ? 'positive' : 'negative');
                
                setText('roi-detail', `投入 $${formatMoney(data.total_invested)} / 獎金 $${formatMoney(data.total_prize)}`);
                setText('total-invested', '$' + formatMoney(data.total_invested));
                setText('total-prize', '$' + formatMoney(data.total_prize));
                setText('total-groups', data.total_groups || 0);
                setText('win-rate', (data.win_rate || 0).toFixed(1) + '%');
            } catch (e) { console.error('loadOverallStats:', e); }
        }
        
        async function loadMonthlyChart() {
            try {
                const data = await apiGet('/statistics/monthly');
                const container = $('chart-bars');
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="empty-state">尚無數據</div>';
                    return;
                }
                
                const maxVal = Math.max(...data.map(d => Math.max(d.invested || 0, d.prize || 0)), 1);
                container.innerHTML = data.slice(-6).map(d => `
                    <div class="chart-bar-group">
                        <div class="chart-bar invested" style="height: ${(d.invested || 0) / maxVal * 100}px;"></div>
                        <div class="chart-bar prize" style="height: ${(d.prize || 0) / maxVal * 80}px;"></div>
                        <div class="chart-label">${d.month || ''}</div>
                    </div>
                `).join('');
            } catch (e) { $('chart-bars').innerHTML = '<div class="empty-state">載入失敗</div>'; }
        }
        
        async function loadPerformance() {
            try {
                const data = await apiGet('/statistics/series-performance');
                const list = $('perf-list');
                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><p>尚無績效數據</p></div>';
                    return;
                }
                list.innerHTML = data.map(p => {
                    const roi = p.invested > 0 ? ((p.prize - p.invested) / p.invested * 100).toFixed(1) : 0;
                    return `
                        <div class="perf-item">
                            <div class="perf-info">
                                <div class="perf-name">${p.series_name || '集資'}</div>
                                <div class="perf-detail">投入 $${formatMoney(p.invested)} / ${p.groups || 0} 期</div>
                            </div>
                            <div class="perf-roi">
                                <div class="perf-roi-value ${roi >= 0 ? 'positive' : 'negative'}">${roi}%</div>
                                <div class="perf-profit">${roi >= 0 ? '+' : ''}$${formatMoney(p.prize - p.invested)}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) { $('perf-list').innerHTML = '<div class="empty-state">載入失敗</div>'; }
        }
        
        async function loadWinning() {
            try {
                const data = await apiGet('/statistics/winning-records');
                const list = $('win-list');
                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🏆</div><p>尚無中獎記錄</p></div>';
                    return;
                }
                list.innerHTML = data.map(w => `
                    <div class="win-item">
                        <div class="win-header">
                            <div class="win-title">${w.series_name || '集資'}</div>
                            <div class="win-amount">+$${formatMoney(w.prize_share)}</div>
                        </div>
                        <div class="win-detail">第 ${w.draw_term || ''} 期 · ${w.prize_level || ''}</div>
                    </div>
                `).join('');
            } catch (e) { $('win-list').innerHTML = '<div class="empty-state">載入失敗</div>'; }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            if (!getToken()) { window.location.href = '/'; return; }
            loadOverallStats();
            loadMonthlyChart();
            loadPerformance();
            loadWinning();
        });
    </script>
</body>
</html>
