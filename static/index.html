<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>SELA 樂透一路發</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --sela-orange: #F26522;
            --sela-orange-dark: #D85A1E;
        }
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #FFF8F4 0%, #FFE8DB 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            margin-bottom: 24px;
            box-shadow: 0 12px 40px rgba(242, 101, 34, 0.25);
        }
        
        .title {
            font-size: 32px;
            font-weight: 900;
            color: var(--sela-orange);
            margin-bottom: 8px;
            text-align: center;
        }
        
        .subtitle {
            font-size: 16px;
            color: #8B7355;
            margin-bottom: 48px;
            text-align: center;
        }
        
        .login-content {
            width: 100%;
            text-align: center;
        }
        
        .login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            background: #06C755;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(6, 199, 85, 0.35);
        }
        
        .login-btn:hover {
            background: #05B34C;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(6, 199, 85, 0.4);
        }
        
        .login-btn:active { transform: translateY(0); }
        
        .login-btn svg { width: 24px; height: 24px; }
        
        .error-msg {
            display: none;
            background: #FFEBEE;
            color: #C62828;
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            width: 100%;
            text-align: center;
        }
        
        .loading {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(242, 101, 34, 0.2);
            border-top-color: var(--sela-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loading-text { color: #8B7355; font-size: 14px; }
        
        .footer {
            padding: 24px;
            text-align: center;
            color: #8B7355;
            font-size: 13px;
        }
        
        .gecko {
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        
        .features {
            display: flex;
            gap: 24px;
            margin-top: 48px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .feature { text-align: center; flex: 1; min-width: 80px; }
        .feature-icon { font-size: 28px; margin-bottom: 8px; }
        .feature-text { font-size: 12px; color: #8B7355; }
        
        /* 驗證中狀態 */
        .verifying {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .verifying .spinner { border-top-color: var(--sela-orange); }
    </style>
</head>
<body>
    <div class="container">
        <img src="/static/logo.jpg" alt="SELA" class="logo">
        <h1 class="title">樂透一路發</h1>
        <p class="subtitle">集資彩券 · 一起發財</p>
        
        <div class="error-msg" id="error-msg"></div>
        
        <div class="login-content" id="login-content">
            <a href="/api/v1/auth/line" class="login-btn" id="login-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
                </svg>
                使用 LINE 登入
            </a>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">正在跳轉到 LINE 登入...</div>
        </div>
        
        <div class="verifying" id="verifying">
            <div class="spinner"></div>
            <div class="loading-text">驗證登入狀態中...</div>
        </div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🎰</div>
                <div class="feature-text">集資彩券</div>
            </div>
            <div class="feature">
                <div class="feature-icon">💰</div>
                <div class="feature-text">自動分帳</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-text">透明記錄</div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2024 <span class="gecko">🦎</span> SELA 樂透一路發</p>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api/v1';
        
        // 安全的 localStorage 存取
        function safeGetItem(key) {
            try {
                return localStorage.getItem(key);
            } catch (e) {
                console.error('localStorage 讀取失敗:', e);
                return null;
            }
        }
        
        function safeSetItem(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (e) {
                console.error('localStorage 寫入失敗:', e);
                return false;
            }
        }
        
        function safeRemoveItem(key) {
            try {
                localStorage.removeItem(key);
            } catch (e) {
                console.error('localStorage 刪除失敗:', e);
            }
        }
        
        // 防循環機制
        const REDIRECT_KEY = 'sela_redirect_count';
        const REDIRECT_TIME_KEY = 'sela_redirect_time';
        const MAX_REDIRECTS = 3;
        const REDIRECT_RESET_MS = 5000;
        
        function checkRedirectLoop() {
            try {
                const now = Date.now();
                const lastTime = parseInt(sessionStorage.getItem(REDIRECT_TIME_KEY) || '0');
                let count = parseInt(sessionStorage.getItem(REDIRECT_KEY) || '0');
                
                // 如果距離上次重定向超過 5 秒，重置計數
                if (now - lastTime > REDIRECT_RESET_MS) {
                    count = 0;
                }
                
                return count >= MAX_REDIRECTS;
            } catch (e) {
                return false;
            }
        }
        
        function incrementRedirectCount() {
            try {
                const now = Date.now();
                const lastTime = parseInt(sessionStorage.getItem(REDIRECT_TIME_KEY) || '0');
                let count = parseInt(sessionStorage.getItem(REDIRECT_KEY) || '0');
                
                if (now - lastTime > REDIRECT_RESET_MS) {
                    count = 0;
                }
                
                count++;
                sessionStorage.setItem(REDIRECT_KEY, count.toString());
                sessionStorage.setItem(REDIRECT_TIME_KEY, now.toString());
            } catch (e) {
                console.error('sessionStorage 錯誤:', e);
            }
        }
        
        function clearRedirectCount() {
            try {
                sessionStorage.removeItem(REDIRECT_KEY);
                sessionStorage.removeItem(REDIRECT_TIME_KEY);
            } catch (e) {
                // ignore
            }
        }
        
        // 驗證 token 是否有效
        async function verifyToken(token) {
            try {
                const res = await fetch(`${API_BASE}/users/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                return res.ok;
            } catch (e) {
                console.error('Token 驗證失敗:', e);
                return false;
            }
        }
        
        // 主要初始化邏輯
        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const accessToken = urlParams.get('token');
            const isNew = urlParams.get('new');
            const error = urlParams.get('error');
            
            // 顯示錯誤訊息
            if (error) {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.textContent = '登入失敗: ' + decodeURIComponent(error);
                errorMsg.style.display = 'block';
                window.history.replaceState({}, '', '/');
                safeRemoveItem('access_token');
                clearRedirectCount();
                return;
            }
            
            // 檢查是否有重定向循環
            if (checkRedirectLoop()) {
                console.warn('偵測到重定向循環，停止自動跳轉');
                safeRemoveItem('access_token');
                clearRedirectCount();
                // 顯示登入按鈕，讓用戶手動登入
                return;
            }
            
            // 處理登入成功（從 LINE 回來帶 token）
            if (accessToken) {
                safeSetItem('access_token', accessToken);
                
                if (isNew === '1') {
                    safeSetItem('is_new_user', '1');
                }
                
                window.history.replaceState({}, '', '/');
                clearRedirectCount();
                window.location.href = '/dashboard';
                return;
            }
            
            // 如果已有 token，驗證後跳轉
            const token = safeGetItem('access_token');
            if (token) {
                // 顯示驗證中狀態
                document.getElementById('login-content').style.display = 'none';
                document.getElementById('verifying').style.display = 'flex';
                
                const isValid = await verifyToken(token);
                
                if (isValid) {
                    clearRedirectCount();
                    window.location.href = '/dashboard';
                } else {
                    // Token 無效，清除並顯示登入按鈕
                    safeRemoveItem('access_token');
                    document.getElementById('verifying').style.display = 'none';
                    document.getElementById('login-content').style.display = 'block';
                }
                return;
            }
            
            // 沒有 token，顯示登入按鈕
            clearRedirectCount();
        }
        
        // 點擊登入按鈕時顯示 loading
        document.getElementById('login-btn').addEventListener('click', function(e) {
            document.getElementById('login-content').style.display = 'none';
            document.getElementById('loading').style.display = 'flex';
        });
        
        // 執行初始化
        init();
    </script>
</body>
</html>
