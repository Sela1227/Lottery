<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 SELA 樂透一路發</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        
        .container {
            text-align: center;
            padding: 50px 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 420px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        
        .logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #FA7A35, #FFB347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #888;
            margin-bottom: 40px;
            font-size: 16px;
        }
        
        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .feature {
            text-align: center;
        }
        
        .feature-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .feature-text {
            font-size: 12px;
            color: #aaa;
        }
        
        .login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 40px;
            background: #06C755;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }
        
        .login-btn:hover {
            background: #05b54c;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(6, 199, 85, 0.3);
        }
        
        .login-btn svg {
            width: 24px;
            height: 24px;
        }
        
        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 12px;
        }
        
        .footer a {
            color: #FA7A35;
            text-decoration: none;
        }
        
        /* Loading state */
        .loading {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #FA7A35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="login-content">
            <div class="logo">🎰</div>
            <h1>SELA</h1>
            <p class="subtitle">樂透一路發 - 團購彩券系統</p>
            
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">👥</div>
                    <div class="feature-text">團購合買</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📊</div>
                    <div class="feature-text">透明分配</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🎯</div>
                    <div class="feature-text">自動對獎</div>
                </div>
            </div>
            
            <a href="/api/v1/auth/line" class="login-btn" id="login-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
                </svg>
                使用 LINE 登入
            </a>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">正在跳轉到 LINE 登入...</div>
        </div>
        
        <div class="footer">
            <p>© 2024 SELA 樂透一路發</p>
            <p><a href="/api/docs">API 文件</a></p>
        </div>
    </div>
    
    <script>
        // 檢查是否已登入
        const token = localStorage.getItem('access_token');
        if (token) {
            window.location.href = '/dashboard';
        }
        
        // 檢查 URL 是否有 token（從 LINE callback 回來）
        const urlParams = new URLSearchParams(window.location.search);
        const accessToken = urlParams.get('token');
        if (accessToken) {
            localStorage.setItem('access_token', accessToken);
            window.location.href = '/dashboard';
        }
        
        // 登入按鈕點擊效果
        document.getElementById('login-btn').addEventListener('click', function(e) {
            document.getElementById('login-content').style.display = 'none';
            document.getElementById('loading').style.display = 'flex';
        });
    </script>
</body>
</html>
