<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <title>我的錢包 - SELA 樂透一路發</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <style>
        :root {
            --sela-orange: #F26522;
            --sela-orange-dark: #D85A1E;
            --bg-primary: #FFF8F4;
            --bg-secondary: #FFF0E8;
            --bg-card: #FFFFFF;
            --text-primary: #2D2420;
            --text-secondary: #8B7355;
            --border-color: rgba(242, 101, 34, 0.12);
            --success: #16A34A;
            --info: #2196F3;
            --shadow-md: 0 4px 16px rgba(242, 101, 34, 0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary); 
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 100px;
        }
        
        /* ===== Header 統一樣式 ===== */
        .header {
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark));
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }
        .header .brand {
            color: white;
            font-size: 18px;
            font-weight: 700;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        /* ===== Main 統一樣式 ===== */
        .main {
            padding: 16px;
            max-width: 100%;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .main { max-width: 600px; padding: 20px; }
        }
        
        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark));
            border-radius: 16px;
            padding: 20px;
            color: white;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(242, 101, 34, 0.3);
        }
        .balance-label { font-size: 14px; opacity: 0.9; margin-bottom: 6px; }
        .balance-amount { font-size: 32px; font-weight: 900; margin-bottom: 16px; }
        .balance-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        .balance-item { text-align: center; }
        .balance-item-label { font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
        .balance-item-value { font-size: 16px; font-weight: 700; }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .stat-icon { font-size: 20px; margin-bottom: 6px; }
        .stat-value { font-size: 16px; font-weight: 700; color: var(--sela-orange); margin-bottom: 4px; }
        .stat-value.green { color: var(--success); }
        .stat-value.blue { color: var(--info); }
        .stat-label { font-size: 11px; color: var(--text-secondary); }
        
        /* Section */
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .section-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title { font-size: 15px; font-weight: 700; }
        .section-action { color: var(--sela-orange); font-size: 13px; text-decoration: none; font-weight: 500; }
        
        /* Pool Share List */
        .pool-list { padding: 0; }
        .pool-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }
        .pool-item:last-child { border-bottom: none; }
        .pool-info { flex: 1; }
        .pool-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
        .pool-ratio { font-size: 12px; color: var(--text-secondary); }
        .pool-amount { font-weight: 700; font-size: 15px; color: var(--sela-orange); }
        
        /* Transaction List */
        .tx-list { padding: 0; }
        .tx-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tx-item:last-child { border-bottom: none; }
        .tx-info { flex: 1; }
        .tx-type { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
        .tx-date { font-size: 12px; color: var(--text-secondary); }
        .tx-amount { font-weight: 700; font-size: 15px; }
        .tx-amount.positive { color: var(--success); }
        .tx-amount.negative { color: #DC2626; }
        
        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }
        .filter-tab {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: transparent;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-secondary);
        }
        .filter-tab.active {
            background: var(--sela-orange);
            color: white;
            border-color: var(--sela-orange);
        }
        
        /* Empty State */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
        }
        .empty-icon { font-size: 40px; margin-bottom: 12px; }
        
        /* Loading */
        .loading { display: flex; justify-content: center; padding: 30px; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--sela-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: #DC2626; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="/static/logo.jpg" alt="SELA" class="logo">
            <span class="brand">我的錢包</span>
        </div>
        <a href="/dashboard" class="back-btn">← 返回</a>
    </header>
    
    <main class="main">
        <div class="balance-card">
            <div class="balance-label">總資產</div>
            <div class="balance-amount" id="total-assets">$0</div>
            <div class="balance-details">
                <div class="balance-item">
                    <div class="balance-item-label">錢包餘額</div>
                    <div class="balance-item-value" id="wallet-balance">$0</div>
                </div>
                <div class="balance-item">
                    <div class="balance-item-label">集資份額</div>
                    <div class="balance-item-value" id="pool-share">$0</div>
                </div>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="total-invested">$0</div>
                <div class="stat-label">累計投入</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-value green" id="total-prize">$0</div>
                <div class="stat-label">累計獎金</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📈</div>
                <div class="stat-value blue" id="roi">0%</div>
                <div class="stat-label">投報率</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-value" id="series-count">0</div>
                <div class="stat-label">參與集資</div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-header">
                <span class="section-title">💰 集資份額明細</span>
            </div>
            <div class="pool-list" id="pool-list">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-header">
                <span class="section-title">📜 交易記錄</span>
            </div>
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterTx('all')">全部</button>
                <button class="filter-tab" onclick="filterTx('topup')">加碼</button>
                <button class="filter-tab" onclick="filterTx('prize')">獎金</button>
                <button class="filter-tab" onclick="filterTx('purchase')">購買</button>
            </div>
            <div class="tx-list" id="tx-list">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </main>
    
    <div id="toast" class="toast"></div>
    
    <script src="/static/js/common.js"></script>
    <script>
        // 備援函數
        if (typeof $ === 'undefined') window.$ = id => document.getElementById(id);
        if (typeof setText === 'undefined') window.setText = (id, t) => { const e = document.getElementById(id); if(e) e.textContent = t; };
        if (typeof getToken === 'undefined') window.getToken = () => { try { return localStorage.getItem('access_token'); } catch(e) { return null; } };
        if (typeof apiGet === 'undefined') window.apiGet = async (url) => { const r = await fetch('/api/v1' + url, { headers: { 'Authorization': 'Bearer ' + getToken() } }); if (!r.ok) throw new Error('API Error'); return r.json(); };
        if (typeof formatMoney === 'undefined') window.formatMoney = (n) => Number(n||0).toLocaleString();
        if (typeof formatDate === 'undefined') window.formatDate = (d) => { if (!d) return ''; const dt = new Date(d); return dt.getFullYear() + '/' + (dt.getMonth()+1) + '/' + dt.getDate(); };
        if (typeof showToast === 'undefined') window.showToast = (msg) => alert(msg);
        
        let currentFilter = 'all';
        
        async function loadOverview() {
            try {
                const data = await apiGet('/wallet/overview');
                if (!data) return;
                setText('total-assets', '$' + formatMoney(data.total_assets));
                setText('wallet-balance', '$' + formatMoney(data.wallet_balance));
                setText('pool-share', '$' + formatMoney(data.total_pool_share));
                setText('total-invested', '$' + formatMoney(data.total_invested));
                setText('total-prize', '$' + formatMoney(data.total_prize));
                const roi = data.total_invested > 0 ? ((data.total_prize - data.total_invested) / data.total_invested * 100).toFixed(1) : 0;
                setText('roi', roi + '%');
                setText('series-count', data.series_count || 0);
            } catch (e) { console.error('loadOverview:', e); }
        }
        
        async function loadPoolShares() {
            try {
                const data = await apiGet('/wallet/pool-shares');
                const list = $('pool-list');
                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="empty-icon">💰</div><p>尚無集資份額</p></div>';
                    return;
                }
                list.innerHTML = data.map(p => `
                    <a href="/series/${p.series_id}" class="pool-item">
                        <div class="pool-info">
                            <div class="pool-name">${p.series_name || '集資'}</div>
                            <div class="pool-ratio">佔比 ${(p.ratio * 100).toFixed(1)}%</div>
                        </div>
                        <div class="pool-amount">$${formatMoney(p.amount)}</div>
                    </a>
                `).join('');
            } catch (e) { $('pool-list').innerHTML = '<div class="empty-state">載入失敗</div>'; }
        }
        
        async function loadTransactions() {
            try {
                const url = currentFilter === 'all' ? '/wallet/transactions' : `/wallet/transactions?type=${currentFilter}`;
                const data = await apiGet(url);
                const list = $('tx-list');
                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📜</div><p>尚無交易記錄</p></div>';
                    return;
                }
                list.innerHTML = data.map(tx => {
                    const isPositive = ['prize', 'topup', 'deposit'].includes(tx.type);
                    const typeNames = { topup: '加碼', prize: '獎金分配', purchase: '購買彩券', deposit: '充值', withdraw: '提領' };
                    return `
                        <div class="tx-item">
                            <div class="tx-info">
                                <div class="tx-type">${typeNames[tx.type] || tx.type}</div>
                                <div class="tx-date">${formatDate(tx.created_at)}</div>
                            </div>
                            <div class="tx-amount ${isPositive ? 'positive' : 'negative'}">${isPositive ? '+' : '-'}$${formatMoney(Math.abs(tx.amount))}</div>
                        </div>
                    `;
                }).join('');
            } catch (e) { $('tx-list').innerHTML = '<div class="empty-state">載入失敗</div>'; }
        }
        
        function filterTx(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            loadTransactions();
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            if (!getToken()) { window.location.href = '/'; return; }
            loadOverview();
            loadPoolShares();
            loadTransactions();
        });
    </script>
</body>
</html>
