<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <title>我的錢包 - SELA 樂透一路發</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        /* ==================== 頁面專屬樣式 ==================== */
        body { font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 100px; }
        
        .header { padding: 12px 20px; gap: 12px; position: sticky; }
        .back-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; text-decoration: none; color: var(--text-primary); }
        .page-title { font-size: 18px; font-weight: 700; }
        
        .main { padding: 20px; max-width: 800px; margin: 0 auto; }
        
        /* Balance Card */
        .balance-card { background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark)); border-radius: 20px; padding: 24px; color: white; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(242, 101, 34, 0.3); }
        .balance-label { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
        .balance-amount { font-size: 36px; font-weight: 900; margin-bottom: 20px; }
        .balance-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.2); }
        .balance-item { text-align: center; }
        .balance-item-label { font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
        .balance-item-value { font-size: 18px; font-weight: 700; }
        
        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; text-align: center; }
        .stat-icon { font-size: 24px; margin-bottom: 8px; }
        .stat-value { font-size: 18px; font-weight: 700; color: var(--sela-orange); margin-bottom: 4px; }
        .stat-value.green { color: var(--success); }
        .stat-value.blue { color: var(--info); }
        .stat-label { font-size: 12px; color: var(--text-secondary); }
        
        /* Section */
        .section { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; margin-bottom: 20px; }
        .section-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .section-title { font-size: 16px; font-weight: 700; }
        .section-action { color: var(--sela-orange); font-size: 13px; text-decoration: none; font-weight: 500; cursor: pointer; }
        
        /* Pool Share List */
        .pool-list { padding: 0; }
        .pool-item { padding: 14px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit; transition: background 0.2s; }
        .pool-item:last-child { border-bottom: none; }
        .pool-item:hover { background: var(--bg-secondary); }
        .pool-info { flex: 1; }
        .pool-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .pool-ratio { font-size: 12px; color: var(--text-secondary); }
        .pool-amount { font-weight: 700; font-size: 16px; color: var(--sela-orange); }
        
        /* Transaction List */
        .tx-list { padding: 0; }
        .tx-item { padding: 14px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .tx-item:last-child { border-bottom: none; }
        .tx-info { flex: 1; }
        .tx-type { font-weight: 600; font-size: 14px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .tx-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--bg-secondary); color: var(--text-secondary); }
        .tx-note { font-size: 12px; color: var(--text-secondary); }
        .tx-amount { text-align: right; }
        .tx-amount-value { font-weight: 700; font-size: 15px; }
        .tx-amount-value.positive { color: var(--success); }
        .tx-amount-value.positive::before { content: '+'; }
        .tx-amount-value.negative { color: var(--danger); }
        .tx-time { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        
        /* Filter Tabs */
        .filter-tabs { display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto; border-bottom: 1px solid var(--border-color); }
        .filter-tab { padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; background: var(--bg-secondary); color: var(--text-secondary); border: none; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .filter-tab.active { background: var(--sela-orange); color: white; }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 40px 20px; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-text { color: var(--text-secondary); font-size: 14px; }
        
        /* Loading */
        .loading { text-align: center; padding: 40px; }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--border-color); border-top-color: var(--sela-orange); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Load More */
        .load-more { padding: 16px; text-align: center; }
        .load-more-btn { padding: 12px 32px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; color: var(--text-primary); cursor: pointer; transition: all 0.2s; }
        .load-more-btn:hover { background: var(--sela-orange); color: white; border-color: var(--sela-orange); }
        
        /* Toast */
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px); background: #333; color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: all 0.3s; z-index: 300; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        @media (max-width: 480px) {
            .balance-amount { font-size: 28px; }
            .balance-item-value { font-size: 16px; }
            .stats-grid { gap: 8px; }
            .stat-card { padding: 12px; }
            .stat-value { font-size: 16px; }
        }
    </style>
</head>
<body>
        <header class="header">
        <div class="header-left">
            <img src="/static/logo.jpg" alt="SELA" class="logo">
            <span class="brand">我的錢包</span>
        </div>
        <a href="/dashboard" class="back-btn">← 返回</a>
    </header>
    
    <main class="main">
        <div class="balance-card">
            <div class="balance-label">總資產</div>
            <div class="balance-amount" id="total-assets">$0</div>
            <div class="balance-details">
                <div class="balance-item">
                    <div class="balance-item-label">錢包餘額</div>
                    <div class="balance-item-value" id="wallet-balance">$0</div>
                </div>
                <div class="balance-item">
                    <div class="balance-item-label">集資份額</div>
                    <div class="balance-item-value" id="pool-share">$0</div>
                </div>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📈</div>
                <div class="stat-value blue" id="total-invested">$0</div>
                <div class="stat-label">累計投資</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎉</div>
                <div class="stat-value green" id="total-prize">$0</div>
                <div class="stat-label">累計獎金</div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-header">
                <span class="section-title">🎰 集資份額</span>
                <a href="/series" class="section-action">查看全部</a>
            </div>
            <div class="pool-list" id="pool-list">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-header">
                <span class="section-title">📋 交易記錄</span>
            </div>
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">全部</button>
                <button class="filter-tab" data-filter="pool">集資</button>
                <button class="filter-tab" data-filter="prize">獎金</button>
            </div>
            <div class="tx-list" id="tx-list">
                <div class="loading"><div class="spinner"></div></div>
            </div>
            <div class="load-more" id="load-more" style="display: none;">
                <button class="load-more-btn" onclick="loadMoreTransactions()">載入更多</button>
            </div>
        </div>
    </main>
    
    <div class="toast" id="toast"></div>
    
    <script src="/static/js/common.js"></script>
    <script>
        // ==================== 備援函數（防止 common.js 載入失敗）====================
        if (typeof $ === 'undefined') window.$ = id => document.getElementById(id);
        if (typeof setText === 'undefined') window.setText = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
        if (typeof setHtml === 'undefined') window.setHtml = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
        if (typeof getToken === 'undefined') window.getToken = () => { try { return localStorage.getItem('access_token'); } catch(e) { return null; } };
        if (typeof removeToken === 'undefined') window.removeToken = () => { try { localStorage.removeItem('access_token'); } catch(e) {} };
        if (typeof checkAuth === 'undefined') window.checkAuth = () => { if (!getToken()) { window.location.href = '/'; return false; } return true; };
        if (typeof apiGet === 'undefined') window.apiGet = async (url) => { const r = await fetch('/api/v1' + url, { headers: { 'Authorization': 'Bearer ' + getToken() } }); if (!r.ok) throw new Error('API Error'); return r.json(); };
        if (typeof apiPost === 'undefined') window.apiPost = async (url, data) => { const r = await fetch('/api/v1' + url, { method: 'POST', headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || 'API Error'); } return r.json(); };
        if (typeof apiPut === 'undefined') window.apiPut = async (url, data) => { const r = await fetch('/api/v1' + url, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || 'API Error'); } return r.json(); };
        if (typeof apiDelete === 'undefined') window.apiDelete = async (url) => { const r = await fetch('/api/v1' + url, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + getToken() } }); if (!r.ok) throw new Error('API Error'); return r.json(); };
        if (typeof showToast === 'undefined') window.showToast = (msg, type) => { const t = document.getElementById('toast'); if (t) { t.textContent = msg; t.className = 'toast ' + (type||'info') + ' show'; setTimeout(() => t.classList.remove('show'), 3000); } else { console.log('[Toast]', type, msg); alert(msg); } };
        if (typeof formatMoney === 'undefined') window.formatMoney = (n) => Number(n||0).toLocaleString();
        if (typeof formatDate === 'undefined') window.formatDate = (d) => { if (!d) return ''; const dt = new Date(d); return dt.getFullYear() + '/' + (dt.getMonth()+1) + '/' + dt.getDate(); };
        if (typeof getStatusText === 'undefined') window.getStatusText = (s) => ({ active:'進行中', paused:'已暫停', closed:'已結束', collecting:'集資中', locked:'已鎖定', purchased:'已購買', drawn:'已開獎', settled:'已結算' }[s] || s);

        let currentFilter = 'all';
        let txSkip = 0;
        const txLimit = 20;
        let hasMoreTx = false;
        
        // ==================== 載入資料 ====================
        async function loadOverview() {
            try {
                const data = await apiGet('/wallet/overview');
                if (!data) return;
                setText('total-assets', `$${formatMoney(data.total_assets)}`);
                setText('wallet-balance', `$${formatMoney(data.wallet_balance)}`);
                setText('pool-share', `$${formatMoney(data.total_pool_share)}`);
            } catch (e) { console.error('Failed to load overview:', e); }
        }
        
        async function loadSummary() {
            try {
                const data = await apiGet('/wallet/transactions/summary');
                if (!data) return;
                setText('total-invested', `$${formatMoney(data.total_invested)}`);
                setText('total-prize', `$${formatMoney(data.total_prize)}`);
            } catch (e) { console.error('Failed to load summary:', e); }
        }
        
        async function loadPoolShares() {
            try {
                const shares = await apiGet('/wallet/pool-shares');
                if (!shares) return;
                const container = $('pool-list');
                if (shares.length === 0) {
                    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🎰</div><p class="empty-text">尚未參與任何集資</p></div>`;
                    return;
                }
                container.innerHTML = shares.map(s => `
                    <a href="/series/${s.series_id}" class="pool-item">
                        <div class="pool-info"><div class="pool-name">${s.series_name}</div><div class="pool-ratio">佔比 ${s.ratio}%</div></div>
                        <div class="pool-amount">$${formatMoney(s.pool_share)}</div>
                    </a>
                `).join('');
            } catch (e) {
                console.error('Failed to load pool shares:', e);
                $('pool-list').innerHTML = `<div class="empty-state"><div class="empty-icon">❌</div><p class="empty-text">載入失敗</p></div>`;
            }
        }
        
        async function loadTransactions(append = false) {
            try {
                let url = `/wallet/transactions?skip=${txSkip}&limit=${txLimit}`;
                if (currentFilter === 'pool') url += '&account_type=pool';
                else if (currentFilter === 'prize') url += '&transaction_type=pool_prize';
                
                const data = await apiGet(url);
                if (!data) return;
                
                hasMoreTx = data.has_more;
                setVisible('load-more', hasMoreTx);
                
                const container = $('tx-list');
                if (data.transactions.length === 0 && !append) {
                    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><p class="empty-text">尚無交易記錄</p></div>`;
                    return;
                }
                
                const html = data.transactions.map(tx => {
                    const isPositive = parseFloat(tx.amount) > 0;
                    return `
                        <div class="tx-item">
                            <div class="tx-info">
                                <div class="tx-type">${tx.transaction_type_display}${tx.series_name ? `<span class="tx-badge">${tx.series_name}</span>` : ''}</div>
                                <div class="tx-note">${tx.note || ''}</div>
                            </div>
                            <div class="tx-amount">
                                <div class="tx-amount-value ${isPositive ? 'positive' : 'negative'}">$${formatMoney(Math.abs(parseFloat(tx.amount)))}</div>
                                <div class="tx-time">${formatRelativeTime(tx.created_at)}</div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                if (append) container.innerHTML += html;
                else container.innerHTML = html;
            } catch (e) {
                console.error('Failed to load transactions:', e);
                if (!append) $('tx-list').innerHTML = `<div class="empty-state"><div class="empty-icon">❌</div><p class="empty-text">載入失敗</p></div>`;
            }
        }
        
        function loadMoreTransactions() {
            txSkip += txLimit;
            loadTransactions(true);
        }
        
        // ==================== Filter Tabs ====================
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.filter;
                txSkip = 0;
                loadTransactions();
            });
        });
        
        // ==================== Init ====================
        async function init() {
            if (!await checkAuth()) return;
            loadOverview();
            loadSummary();
            loadPoolShares();
            loadTransactions();
        }
        
        // 確保 common.js 載入完成後再執行
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
