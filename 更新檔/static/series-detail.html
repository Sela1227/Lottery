<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <title>SELA 樂透一路發 - 系列團詳情</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --sela-orange: #F26522;
            --sela-orange-dark: #D85A1E;
            --sela-orange-light: #FF8547;
            --bg-primary: #FFF8F4;
            --bg-secondary: #FFF0E8;
            --bg-card: #FFFFFF;
            --border-color: rgba(242, 101, 34, 0.12);
            --text-primary: #2D2420;
            --text-secondary: #8B7355;
            --shadow-sm: 0 2px 8px rgba(242, 101, 34, 0.08);
            --shadow-md: 0 4px 16px rgba(242, 101, 34, 0.1);
            --success: #16A34A;
            --warning: #F59E0B;
            --error: #DC2626;
            --info: #2563EB;
        }
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
        }
        
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        
        .header-left { display: flex; align-items: center; gap: 10px; }
        
        .back-btn {
            width: 36px; height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px;
            text-decoration: none; color: var(--text-primary);
        }
        
        .page-title { font-size: 18px; font-weight: 700; }
        
        .main { padding: 20px; max-width: 900px; margin: 0 auto; }
        
        /* Info Card */
        .info-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }
        
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .info-title { font-size: 22px; font-weight: 700; }
        
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .status-active { background: rgba(22, 163, 74, 0.1); color: var(--success); }
        .status-ended { background: rgba(139, 115, 85, 0.1); color: var(--text-secondary); }
        
        .info-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            padding: 16px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }
        
        .info-stat { text-align: center; }
        .info-stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .info-stat-value { font-size: 20px; font-weight: 700; }
        .info-stat-value.orange { color: var(--sela-orange); }
        .info-stat-value.green { color: var(--success); }
        
        .info-desc {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        
        .tab {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            transition: all 0.3s;
        }
        
        .tab.active {
            background: var(--sela-orange);
            color: #fff;
            border-color: var(--sela-orange);
        }
        
        .tab:hover:not(.active) {
            background: var(--bg-secondary);
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Section */
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .section-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .section-title { font-size: 16px; font-weight: 700; }
        
        /* Buttons */
        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark));
            color: #fff;
        }
        
        .btn-primary:hover { transform: translateY(-1px); }
        
        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--sela-orange);
            border: 1px solid var(--border-color);
        }
        
        .btn-sm { padding: 8px 14px; font-size: 13px; }
        
        /* Group List */
        .group-list { padding: 0; }
        
        .group-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            color: inherit;
        }
        
        .group-item:last-child { border-bottom: none; }
        .group-item:hover { background: var(--bg-secondary); }
        
        .group-info { flex: 1; }
        
        .group-title {
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .group-meta {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            gap: 16px;
        }
        
        .group-status {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .group-status.collecting { background: rgba(37, 99, 235, 0.1); color: var(--info); }
        .group-status.locked { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .group-status.purchased { background: rgba(139, 92, 246, 0.1); color: #8B5CF6; }
        .group-status.drawn { background: rgba(22, 163, 74, 0.1); color: var(--success); }
        .group-status.settled { background: rgba(139, 115, 85, 0.1); color: var(--text-secondary); }
        
        .group-prize {
            font-size: 16px;
            font-weight: 700;
            color: var(--success);
        }
        
        /* Member List */
        .member-list { padding: 0; }
        
        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .member-item:last-child { border-bottom: none; }
        
        .member-info { display: flex; align-items: center; gap: 12px; }
        
        .member-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-light));
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 600;
            overflow: hidden;
        }
        
        .member-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .member-name { font-weight: 600; }
        
        .member-role {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--sela-orange);
            color: #fff;
            margin-left: 6px;
        }
        
        .member-share {
            font-size: 16px;
            font-weight: 700;
            color: var(--sela-orange);
        }
        
        /* Invite Code */
        .invite-section { padding: 20px; }
        
        .invite-code-display {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin-bottom: 16px;
        }
        
        .invite-code {
            font-size: 24px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 4px;
            color: var(--sela-orange);
            flex: 1;
        }
        
        .copy-btn {
            padding: 10px 16px;
            background: var(--sela-orange);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .invite-info {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal {
            background: var(--bg-card);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        
        .modal-overlay.active .modal { transform: translateY(0); }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title { font-size: 18px; font-weight: 700; }
        
        .modal-close {
            width: 32px; height: 32px;
            border-radius: 8px;
            border: none;
            background: var(--bg-secondary);
            cursor: pointer;
            font-size: 18px;
        }
        
        .modal-body { padding: 20px; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        
        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
        }
        
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--sela-orange);
        }
        
        .form-hint { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
        
        .modal-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-text { font-size: 14px; }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: #fff;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s;
        }
        
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }
        
        /* Loading */
        .loading { display: flex; justify-content: center; padding: 40px; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--sela-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Admin Actions */
        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            .info-stats { grid-template-columns: repeat(2, 1fr); }
            .group-meta { flex-direction: column; gap: 4px; }
            .admin-actions { flex-direction: column; }
            .admin-actions .btn { justify-content: center; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="/series" class="back-btn">←</a>
            <h1 class="page-title">系列團詳情</h1>
        </div>
    </header>
    
    <main class="main">
        <div id="content">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </main>
    
    <!-- New Period Modal -->
    <div class="modal-overlay" id="new-period-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">開新期</h2>
                <button class="modal-close" onclick="closeModal('new-period-modal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">彩種</label>
                    <select class="form-select" id="lottery-type-select"></select>
                </div>
                <div class="form-group">
                    <label class="form-label">台彩期數(選填)</label>
                    <input type="text" class="form-input" id="draw-term" placeholder="例如:113000098">
                </div>
                <div class="form-group">
                    <label class="form-label">開獎日期(選填)</label>
                    <input type="date" class="form-input" id="draw-date">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('new-period-modal')">取消</button>
                <button class="btn btn-primary" onclick="createNewPeriod()">開新期</button>
            </div>
        </div>
    </div>
    
    <!-- Invite Modal -->
    <div class="modal-overlay" id="invite-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">產生邀請碼</h2>
                <button class="modal-close" onclick="closeModal('invite-modal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">最大使用次數</label>
                    <input type="number" class="form-input" id="max-uses" value="5" min="1" max="100">
                    <p class="form-hint">設為 1 表示一次性邀請碼</p>
                </div>
                <div class="form-group">
                    <label class="form-label">有效天數</label>
                    <input type="number" class="form-input" id="expires-days" value="7" min="1" max="30">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('invite-modal')">取消</button>
                <button class="btn btn-primary" onclick="createInvitation()">產生</button>
            </div>
        </div>
    </div>
    
    <!-- Topup Modal -->
    <div class="modal-overlay" id="topup-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">加碼</h2>
                <button class="modal-close" onclick="closeModal('topup-modal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">加碼金額(元)</label>
                    <input type="number" class="form-input" id="topup-amount" value="500" min="50" step="50">
                    <p class="form-hint">以 50 元為單位</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('topup-modal')">取消</button>
                <button class="btn btn-primary" onclick="topup()">確認加碼</button>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
        const API_BASE = '/api/v1';
        const seriesId = window.location.pathname.split('/').pop();
        let seriesData = null;
        let lotteryTypes = [];
        let isAdmin = false;
        let currentInvitation = null;
        
        async function apiGet(url) {
            const token = localStorage.getItem('access_token');
            const res = await fetch(`${API_BASE}${url}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error((await res.json()).detail || 'Error');
            return res.json();
        }
        
        async function apiPost(url, data) {
            const token = localStorage.getItem('access_token');
            const res = await fetch(`${API_BASE}${url}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error((await res.json()).detail || 'Error');
            return res.json();
        }
        
        async function loadData() {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    window.location.href = '/';
                    return;
                }
                
                [seriesData, lotteryTypes] = await Promise.all([
                    apiGet(`/series/${seriesId}`),
                    apiGet('/lottery-types')
                ]);
                
                isAdmin = seriesData.my_role === 'admin';
                renderContent();
                
            } catch (e) {
                document.getElementById('content').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <p class="empty-text">載入失敗:${e.message}</p>
                    </div>
                `;
            }
        }
        
        function renderContent() {
            const s = seriesData;
            const content = document.getElementById('content');
            
            content.innerHTML = `
                <!-- Info Card -->
                <div class="info-card">
                    <div class="info-header">
                        <h2 class="info-title">${s.name}</h2>
                        <span class="status-badge ${s.status === 'active' ? 'status-active' : 'status-ended'}">
                            ${s.status === 'active' ? '進行中' : '已結束'}
                        </span>
                    </div>
                    <div class="info-stats">
                        <div class="info-stat">
                            <div class="info-stat-label">成員數</div>
                            <div class="info-stat-value">${s.member_count}</div>
                        </div>
                        <div class="info-stat">
                            <div class="info-stat-label">資金池</div>
                            <div class="info-stat-value orange">$${Number(s.current_pool).toLocaleString()}</div>
                        </div>
                        <div class="info-stat">
                            <div class="info-stat-label">已開期數</div>
                            <div class="info-stat-value">${s.total_periods}</div>
                        </div>
                        <div class="info-stat">
                            <div class="info-stat-label">我的份額</div>
                            <div class="info-stat-value green">$${Number(s.my_pool_share).toLocaleString()}</div>
                        </div>
                    </div>
                    ${s.description ? `<p class="info-desc">${s.description}</p>` : ''}
                </div>
                
                ${isAdmin ? `
                <div class="admin-actions">
                    <button class="btn btn-primary" onclick="showNewPeriodModal()">🎰 開新期</button>
                    <button class="btn btn-secondary" onclick="showInviteModal()">🎫 產生邀請碼</button>
                    <button class="btn btn-secondary" onclick="showTopupModal()">💰 加碼</button>
                </div>
                ` : `
                <div class="admin-actions">
                    <button class="btn btn-primary" onclick="showTopupModal()">💰 加碼</button>
                </div>
                `}
                
                <!-- Tabs -->
                <div class="tabs">
                    <div class="tab active" data-tab="periods">單期團記錄</div>
                    <div class="tab" data-tab="members">成員 (${s.member_count})</div>
                    ${isAdmin ? '<div class="tab" data-tab="invites">邀請碼</div>' : ''}
                </div>
                
                <!-- Tab Contents -->
                <div id="tab-periods" class="tab-content active"></div>
                <div id="tab-members" class="tab-content"></div>
                ${isAdmin ? '<div id="tab-invites" class="tab-content"></div>' : ''}
            `;
            
            // Setup tab switching
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
                });
            });
            
            // Setup lottery type select
            const select = document.getElementById('lottery-type-select');
            select.innerHTML = (s.allowed_lottery_types || []).map(code => {
                const lt = lotteryTypes.find(t => t.code === code);
                return `<option value="${code}">${lt ? lt.name : code}</option>`;
            }).join('');
            
            loadPeriods();
            loadMembers();
            if (isAdmin) loadInvitations();
        }
        
        async function loadPeriods() {
            const container = document.getElementById('tab-periods');
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            try {
                const groups = await apiGet(`/series/${seriesId}/groups`);
                
                if (groups.length === 0) {
                    container.innerHTML = `
                        <div class="section">
                            <div class="empty-state">
                                <div class="empty-icon">📋</div>
                                <p class="empty-text">還沒有開過期,${isAdmin ? '點擊「開新期」開始' : '等待管理員開新期'}</p>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = `
                    <div class="section">
                        <div class="group-list">
                            ${groups.map(g => `
                                <a href="/group/${g.id}" class="group-item">
                                    <div class="group-info">
                                        <div class="group-title">
                                            第 ${g.period_number} 期
                                            <span class="group-status ${g.status}">${getStatusText(g.status)}</span>
                                        </div>
                                        <div class="group-meta">
                                            <span>🎰 ${g.lottery_type_name}</span>
                                            ${g.draw_term ? `<span>📅 ${g.draw_term}</span>` : ''}
                                            <span>💰 池 $${Number(g.total_pool).toLocaleString()}</span>
                                        </div>
                                    </div>
                                    ${g.total_prize > 0 ? `<div class="group-prize">+$${Number(g.total_prize).toLocaleString()}</div>` : '<span style="color: var(--text-secondary);">→</span>'}
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><p class="empty-text">載入失敗:${e.message}</p></div>`;
            }
        }
        
        async function loadMembers() {
            const container = document.getElementById('tab-members');
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            try {
                const members = await apiGet(`/series/${seriesId}/members`);
                
                container.innerHTML = `
                    <div class="section">
                        <div class="member-list">
                            ${members.map(m => `
                                <div class="member-item">
                                    <div class="member-info">
                                        <div class="member-avatar">
                                            ${m.picture_url ? `<img src="${m.picture_url}">` : m.display_name[0]}
                                        </div>
                                        <div>
                                            <span class="member-name">${m.display_name}</span>
                                            ${m.role === 'admin' ? '<span class="member-role">管理員</span>' : ''}
                                        </div>
                                    </div>
                                    <div class="member-share">$${Number(m.pool_share).toLocaleString()}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><p class="empty-text">載入失敗</p></div>`;
            }
        }
        
        async function loadInvitations() {
            const container = document.getElementById('tab-invites');
            if (!container) return;
            
            // For now, show create button and current invitation if any
            container.innerHTML = `
                <div class="section">
                    <div class="invite-section">
                        ${currentInvitation ? `
                            <div class="invite-code-display">
                                <span class="invite-code">${currentInvitation.code}</span>
                                <button class="copy-btn" onclick="copyCode('${currentInvitation.code}')">複製</button>
                            </div>
                            <p class="invite-info">
                                已使用 ${currentInvitation.used_count}/${currentInvitation.max_uses || '∞'} 次
                                ${currentInvitation.expires_at ? ` · 有效期至 ${new Date(currentInvitation.expires_at).toLocaleDateString()}` : ''}
                            </p>
                        ` : `
                            <div class="empty-state">
                                <div class="empty-icon">🎫</div>
                                <p class="empty-text">點擊上方「產生邀請碼」來建立邀請連結</p>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }
        
        function getStatusText(status) {
            const map = {
                collecting: '集資中',
                locked: '已鎖定',
                purchased: '已購買',
                drawn: '已開獎',
                settled: '已結算'
            };
            return map[status] || status;
        }
        
        function showNewPeriodModal() {
            document.getElementById('new-period-modal').classList.add('active');
        }
        
        function showInviteModal() {
            document.getElementById('invite-modal').classList.add('active');
        }
        
        function showTopupModal() {
            document.getElementById('topup-modal').classList.add('active');
        }
        
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        
        async function createNewPeriod() {
            const lotteryType = document.getElementById('lottery-type-select').value;
            const drawTerm = document.getElementById('draw-term').value.trim();
            const drawDate = document.getElementById('draw-date').value;
            
            try {
                await apiPost(`/series/${seriesId}/groups`, {
                    lottery_type_code: lotteryType,
                    draw_term: drawTerm || null,
                    draw_date: drawDate || null
                });
                
                closeModal('new-period-modal');
                showToast('新期建立成功!', 'success');
                loadPeriods();
                
                // Clear form
                document.getElementById('draw-term').value = '';
                document.getElementById('draw-date').value = '';
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        async function createInvitation() {
            const maxUses = parseInt(document.getElementById('max-uses').value);
            const expiresDays = parseInt(document.getElementById('expires-days').value);
            
            try {
                currentInvitation = await apiPost(`/series/${seriesId}/invitations`, {
                    max_uses: maxUses,
                    expires_in_days: expiresDays
                });
                
                closeModal('invite-modal');
                showToast('邀請碼已產生!', 'success');
                loadInvitations();
                
                // Switch to invites tab
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.querySelector('[data-tab="invites"]').classList.add('active');
                document.getElementById('tab-invites').classList.add('active');
                
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        async function topup() {
            const amount = parseFloat(document.getElementById('topup-amount').value);
            
            if (amount < 50) {
                showToast('加碼金額至少 50 元', 'error');
                return;
            }
            
            try {
                await apiPost(`/series/${seriesId}/members/me/topup`, { amount });
                
                closeModal('topup-modal');
                showToast(`成功加碼 $${amount}!`, 'success');
                
                // Reload data
                seriesData = await apiGet(`/series/${seriesId}`);
                renderContent();
                
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                showToast('邀請碼已複製!', 'success');
            });
        }
        
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // Modal close on overlay click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.classList.remove('active');
            });
        });
        
        loadData();
    </script>
</body>
</html>
