<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>SELA 樂透一路發 - 儀表板</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --sela-orange: #F26522;
            --sela-orange-dark: #D85A1E;
            --sela-orange-light: #FF8547;
            --bg-primary: #FFF8F4;
            --bg-secondary: #FFF0E8;
            --bg-card: #FFFFFF;
            --border-color: rgba(242, 101, 34, 0.12);
            --text-primary: #2D2420;
            --text-secondary: #8B7355;
            --shadow-sm: 0 2px 8px rgba(242, 101, 34, 0.08);
            --shadow-md: 0 4px 16px rgba(242, 101, 34, 0.1);
            --success: #16A34A;
        }
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--text-primary);
        }
        
        /* Header */
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
        }
        
        .brand {
            font-size: 16px;
            font-weight: 700;
            color: var(--sela-orange);
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        
        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .user-name {
            font-weight: 500;
            font-size: 14px;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
        }
        
        .logout-btn {
            padding: 8px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--sela-orange);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            font-weight: 500;
            -webkit-tap-highlight-color: transparent;
        }
        
        .logout-btn:hover, .logout-btn:active {
            background: var(--sela-orange);
            color: #fff;
            border-color: var(--sela-orange);
        }
        
        /* Main Content */
        .main {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .welcome {
            margin-bottom: 24px;
        }
        
        .welcome h1 {
            font-size: 22px;
            margin-bottom: 4px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .welcome h1 span {
            color: var(--sela-orange);
        }
        
        .welcome p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        /* Stats Cards */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--sela-orange), var(--sela-orange-light));
            opacity: 0.6;
        }
        
        .stat-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .stat-card-title {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .stat-card-icon {
            font-size: 20px;
        }
        
        .stat-card-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--sela-orange);
        }
        
        .stat-card-value.green { color: var(--success); }
        .stat-card-value.blue { color: #2563EB; }
        
        /* Section Title */
        .section-title {
            font-size: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        /* Quick Actions */
        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .action-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            -webkit-tap-highlight-color: transparent;
        }
        
        .action-btn:hover, .action-btn:active {
            border-color: var(--sela-orange);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        
        .action-btn.primary {
            background: linear-gradient(135deg, var(--sela-orange), var(--sela-orange-dark));
            border: none;
            color: #fff;
            box-shadow: 0 8px 24px rgba(242, 101, 34, 0.3);
        }
        
        .action-btn.primary:hover, .action-btn.primary:active {
            box-shadow: 0 12px 32px rgba(242, 101, 34, 0.4);
            transform: translateY(-2px);
        }
        
        .action-btn.wallet {
            background: linear-gradient(135deg, #16A34A, #15803D);
            border: none;
            color: #fff;
            box-shadow: 0 8px 24px rgba(22, 163, 74, 0.3);
        }
        
        .action-btn.wallet:hover, .action-btn.wallet:active {
            box-shadow: 0 12px 32px rgba(22, 163, 74, 0.4);
            transform: translateY(-2px);
        }
        
        .action-btn.wallet .action-desc {
            color: rgba(255,255,255,0.85);
        }
        
        .action-btn.admin {
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            border: none;
            color: #fff;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }
        
        .action-btn.admin:hover, .action-btn.admin:active {
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }
        
        .action-btn.admin .action-desc {
            color: rgba(255,255,255,0.85);
        }
        
        .action-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .action-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 15px;
        }
        
        .action-desc {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .action-btn.primary .action-desc {
            color: rgba(255,255,255,0.85);
        }
        
        /* Recent Activity */
        .activity-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 28px;
        }
        
        .activity-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .activity-title {
            font-weight: 700;
            font-size: 15px;
        }
        
        .view-all {
            color: var(--sela-orange);
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
        }
        
        .activity-list {
            padding: 0;
        }
        
        .activity-item {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: background 0.3s;
        }
        
        .activity-item:last-child {
            border-bottom: none;
        }
        
        .activity-item:hover {
            background: var(--bg-secondary);
        }
        
        .activity-info {
            flex: 1;
        }
        
        .activity-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }
        
        .activity-detail {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .activity-status {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .activity-status.collecting { background: rgba(37, 99, 235, 0.1); color: #2563EB; }
        .activity-status.locked { background: rgba(245, 158, 11, 0.1); color: #F59E0B; }
        .activity-status.purchased { background: rgba(139, 92, 246, 0.1); color: #8B5CF6; }
        .activity-status.drawn { background: rgba(22, 163, 74, 0.1); color: var(--success); }
        .activity-status.settled { background: rgba(139, 115, 85, 0.1); color: var(--text-secondary); }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }
        
        .empty-icon {
            font-size: 52px;
            margin-bottom: 14px;
        }
        
        .empty-title {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .empty-desc {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.6;
        }
        
        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .loading-content {
            text-align: center;
        }
        
        .loading-logo {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }
        
        .loading-text {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .hidden {
            display: none !important;
        }
        
        /* 手機直向 */
        @media (max-width: 480px) {
            .header {
                padding: 10px 16px;
            }
            
            .brand {
                display: none;
            }
            
            .user-name {
                display: none;
            }
            
            .main {
                padding: 16px;
            }
            
            .welcome h1 {
                font-size: 20px;
            }
            
            .stats {
                gap: 8px;
            }
            
            .stat-card {
                padding: 14px 12px;
            }
            
            .stat-card-title {
                font-size: 10px;
            }
            
            .stat-card-icon {
                font-size: 18px;
            }
            
            .stat-card-value {
                font-size: 18px;
            }
            
            .actions {
                gap: 10px;
            }
            
            .action-btn {
                padding: 16px 12px;
            }
            
            .action-icon {
                font-size: 28px;
                margin-bottom: 8px;
            }
            
            .action-title {
                font-size: 13px;
            }
            
            .action-desc {
                font-size: 10px;
            }
        }
        
        /* 大螢幕 */
        @media (min-width: 768px) {
            .header {
                padding: 14px 30px;
            }
            
            .logo {
                width: 40px;
                height: 40px;
            }
            
            .brand {
                font-size: 18px;
            }
            
            .user-avatar {
                width: 40px;
                height: 40px;
            }
            
            .user-name {
                max-width: 150px;
                font-size: 15px;
            }
            
            .main {
                padding: 30px;
            }
            
            .welcome h1 {
                font-size: 26px;
            }
            
            .stats {
                gap: 16px;
            }
            
            .stat-card {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-content">
            <img src="/static/logo.jpg" alt="SELA" class="loading-logo">
            <p class="loading-text">載入中...</p>
        </div>
    </div>
    
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <img src="/static/logo.jpg" alt="SELA" class="logo">
            <span class="brand">樂透一路發</span>
        </div>
        <div class="header-right">
            <div class="user-info">
                <div class="user-avatar" id="user-avatar"></div>
                <span class="user-name" id="user-name"></span>
            </div>
            <button class="logout-btn" onclick="logout()">登出</button>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="main">
        <!-- Welcome -->
        <div class="welcome">
            <h1>你好,<span id="welcome-name"></span>!</h1>
            <p>今天是發財的好日子 🍀</p>
        </div>
        
        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">總份額</span>
                    <span class="stat-card-icon">💰</span>
                </div>
                <div class="stat-card-value" id="total-pool">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">參與團數</span>
                    <span class="stat-card-icon">🎰</span>
                </div>
                <div class="stat-card-value blue" id="series-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">累計獎金</span>
                    <span class="stat-card-icon">🎉</span>
                </div>
                <div class="stat-card-value green" id="total-prize">$0</div>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <h2 class="section-title">⚡ 快速操作</h2>
        <div class="actions">
            <a href="/series" class="action-btn primary">
                <div class="action-icon">🎰</div>
                <div class="action-title">我的系列團</div>
                <div class="action-desc">查看與管理團購</div>
            </a>
            <a href="/wallet" class="action-btn wallet">
                <div class="action-icon">💰</div>
                <div class="action-title">我的錢包</div>
                <div class="action-desc">查看資產與記錄</div>
            </a>
            <a href="/series" class="action-btn" onclick="event.preventDefault(); showJoinModal();">
                <div class="action-icon">🎫</div>
                <div class="action-title">加入系列團</div>
                <div class="action-desc">使用邀請碼</div>
            </a>
            <a href="#" class="action-btn" onclick="event.preventDefault(); showComingSoon('統計報表');">
                <div class="action-icon">📊</div>
                <div class="action-title">統計報表</div>
                <div class="action-desc">查看投資報酬</div>
            </a>
            <!-- 管理後台按鈕（僅管理員可見） -->
            <a href="/admin" class="action-btn admin" id="admin-btn" style="display: none;">
                <div class="action-icon">🔧</div>
                <div class="action-title">管理後台</div>
                <div class="action-desc">系統管理</div>
            </a>
        </div>
        
        <!-- Recent Activity -->
        <div class="activity-section">
            <div class="activity-header">
                <span class="activity-title">📋 近期活動</span>
                <a href="/series" class="view-all">查看全部</a>
            </div>
            <div class="activity-list" id="activity-list">
                <div class="empty-state">
                    <div class="empty-icon">📋</div>
                    <h3 class="empty-title">尚無活動</h3>
                    <p class="empty-desc">加入或建立系列團開始吧!</p>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Join Modal -->
    <div class="modal-overlay" id="join-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
        <div style="background: #fff; border-radius: 20px; width: 90%; max-width: 400px; padding: 24px;">
            <h3 style="margin-bottom: 20px; font-size: 18px;">使用邀請碼加入</h3>
            <input type="text" id="invite-code" placeholder="輸入邀請碼" style="width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 16px; margin-bottom: 12px; text-transform: uppercase;">
            <input type="number" id="join-pool" value="500" placeholder="初始份額" style="width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 16px; margin-bottom: 20px;">
            <div style="display: flex; gap: 12px;">
                <button onclick="closeJoinModal()" style="flex: 1; padding: 14px; border: 1px solid var(--border-color); background: #fff; border-radius: 10px; font-size: 14px; cursor: pointer;">取消</button>
                <button onclick="joinSeries()" style="flex: 1; padding: 14px; border: none; background: var(--sela-orange); color: #fff; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;">加入</button>
            </div>
        </div>
    </div>
    
    <!-- Toast -->
    <div id="toast" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #333; color: #fff; padding: 14px 24px; border-radius: 12px; font-size: 14px; opacity: 0; transition: all 0.3s; z-index: 2000;"></div>
    
    <script>
        const API_BASE = '/api/v1';
        
        function showComingSoon(feature) {
            showToast(`「${feature}」功能即將推出!`);
        }
        
        function showJoinModal() {
            document.getElementById('join-modal').style.display = 'flex';
        }
        
        function closeJoinModal() {
            document.getElementById('join-modal').style.display = 'none';
        }
        
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = type === 'error' ? '#DC2626' : type === 'success' ? '#16A34A' : '#333';
            toast.style.transform = 'translateX(-50%) translateY(0)';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.transform = 'translateX(-50%) translateY(100px)';
                toast.style.opacity = '0';
            }, 3000);
        }
        
        async function joinSeries() {
            const code = document.getElementById('invite-code').value.trim().toUpperCase();
            const pool = parseFloat(document.getElementById('join-pool').value);
            
            if (!code) {
                showToast('請輸入邀請碼', 'error');
                return;
            }
            
            try {
                const token = localStorage.getItem('access_token');
                const res = await fetch(`${API_BASE}/series/join`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        invitation_code: code,
                        initial_pool_share: pool
                    })
                });
                
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || '加入失敗');
                }
                
                closeJoinModal();
                showToast('成功加入系列團!', 'success');
                loadDashboardData();
                
            } catch (e) {
                showToast(e.message, 'error');
            }
        }
        
        async function checkAuth() {
            const token = localStorage.getItem('access_token');
            
            if (!token) {
                window.location.href = '/';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/users/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Unauthorized');
                }
                
                const user = await response.json();
                updateUI(user);
                loadDashboardData();
                
            } catch (error) {
                console.error('Auth error:', error);
                localStorage.removeItem('access_token');
                window.location.href = '/';
            }
        }
        
        function updateUI(user) {
            const displayName = user.nickname || user.display_name;
            document.getElementById('user-name').textContent = displayName;
            document.getElementById('welcome-name').textContent = displayName;
            
            const avatarEl = document.getElementById('user-avatar');
            if (user.picture_url) {
                avatarEl.innerHTML = `<img src="${user.picture_url}" alt="avatar">`;
            } else {
                avatarEl.textContent = displayName.charAt(0);
            }
            
            // 如果是管理員，顯示管理後台按鈕
            if (user.role === 'admin') {
                document.getElementById('admin-btn').style.display = 'block';
            }
            
            document.getElementById('loading-overlay').classList.add('hidden');
        }
        
        async function loadDashboardData() {
            const token = localStorage.getItem('access_token');
            
            try {
                // Load series list
                const seriesRes = await fetch(`${API_BASE}/series`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (seriesRes.ok) {
                    const seriesList = await seriesRes.json();
                    
                    // Calculate stats
                    let totalPool = 0;
                    let totalPrize = 0;
                    
                    seriesList.forEach(s => {
                        totalPool += Number(s.my_pool_share) || 0;
                    });
                    
                    document.getElementById('total-pool').textContent = `$${totalPool.toLocaleString()}`;
                    document.getElementById('series-count').textContent = seriesList.length;
                    document.getElementById('total-prize').textContent = `$${totalPrize.toLocaleString()}`;
                    
                    // Render recent activity
                    renderRecentActivity(seriesList);
                }
            } catch (e) {
                console.error('Failed to load dashboard data:', e);
            }
        }
        
        async function renderRecentActivity(seriesList) {
            const container = document.getElementById('activity-list');
            
            if (seriesList.length === 0) {
                return; // Keep empty state
            }
            
            // Get recent groups from all series
            const recentGroups = [];
            const token = localStorage.getItem('access_token');
            
            for (const series of seriesList.slice(0, 3)) {
                try {
                    const res = await fetch(`${API_BASE}/series/${series.id}/groups`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const groups = await res.json();
                        groups.slice(0, 2).forEach(g => {
                            recentGroups.push({
                                ...g,
                                seriesName: series.name,
                                seriesId: series.id
                            });
                        });
                    }
                } catch (e) {
                    console.error('Failed to load groups:', e);
                }
            }
            
            if (recentGroups.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <h3 class="empty-title">尚無單期團</h3>
                        <p class="empty-desc">管理員開新期後會顯示在這裡</p>
                    </div>
                `;
                return;
            }
            
            const statusText = {
                collecting: '集資中',
                locked: '已鎖定',
                purchased: '已購買',
                drawn: '已開獎',
                settled: '已結算'
            };
            
            container.innerHTML = recentGroups.slice(0, 5).map(g => `
                <a href="/group/${g.id}" class="activity-item">
                    <div class="activity-info">
                        <div class="activity-name">${g.seriesName} - 第 ${g.period_number} 期</div>
                        <div class="activity-detail">${g.lottery_type_name} · 池 $${Number(g.total_pool).toLocaleString()}</div>
                    </div>
                    <span class="activity-status ${g.status}">${statusText[g.status] || g.status}</span>
                </a>
            `).join('');
        }
        
        function logout() {
            if (confirm('確定要登出嗎?')) {
                localStorage.removeItem('access_token');
                window.location.href = '/';
            }
        }
        
        // Close modal on click outside
        document.getElementById('join-modal').addEventListener('click', function(e) {
            if (e.target === this) closeJoinModal();
        });
        
        checkAuth();
    </script>
</body>
</html>
