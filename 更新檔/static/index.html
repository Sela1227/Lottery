<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F26522">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>SELA 樂透一路發</title>
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --sela-orange: #F26522;
            --sela-orange-dark: #D85A1E;
            --sela-orange-light: #FF8547;
            --bg-primary: #FFF8F4;
            --bg-secondary: #FFF0E8;
            --bg-card: #FFFFFF;
            --border-color: rgba(242, 101, 34, 0.15);
            --text-primary: #2D2420;
            --text-secondary: #8B7355;
        }
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(145deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            padding: 20px;
        }
        
        .container {
            text-align: center;
            padding: 40px 30px;
            background: var(--bg-card);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            max-width: 400px;
            width: 100%;
            box-shadow: 
                0 20px 60px rgba(242, 101, 34, 0.1),
                0 8px 24px rgba(0,0,0,0.06);
        }
        
        .logo-wrapper {
            margin-bottom: 20px;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(242, 101, 34, 0.25);
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 6px;
            color: var(--sela-orange);
            font-weight: 900;
            letter-spacing: 4px;
        }
        
        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 15px;
        }
        
        .subtitle span {
            color: var(--sela-orange);
            font-weight: 500;
        }
        
        .features {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 32px;
        }
        
        .feature {
            text-align: center;
            flex: 1;
            max-width: 80px;
        }
        
        .feature-icon {
            width: 52px;
            height: 52px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-size: 24px;
        }
        
        .feature-text {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 32px;
            background: #06C755;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 8px 24px rgba(6, 199, 85, 0.3);
        }
        
        .login-btn:hover {
            background: #05b54c;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(6, 199, 85, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .login-btn svg {
            width: 24px;
            height: 24px;
        }
        
        .footer {
            margin-top: 32px;
            color: var(--text-secondary);
            font-size: 11px;
        }
        
        .footer .gecko {
            color: var(--sela-orange);
        }
        
        /* Loading state */
        .loading {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--sela-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        /* Error message */
        .error-msg {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #DC2626;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        /* 手機優化 */
        @media (max-width: 480px) {
            body {
                padding: 16px;
                align-items: flex-start;
                padding-top: 8vh;
            }
            
            .container {
                padding: 32px 24px;
            }
            
            .logo {
                width: 88px;
                height: 88px;
            }
            
            h1 {
                font-size: 32px;
            }
            
            .subtitle {
                font-size: 14px;
                margin-bottom: 28px;
            }
            
            .features {
                gap: 16px;
                margin-bottom: 28px;
            }
            
            .feature-icon {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }
            
            .feature-text {
                font-size: 11px;
            }
            
            .login-btn {
                max-width: 100%;
            }
        }
        
        /* 小螢幕手機 */
        @media (max-width: 360px) {
            .container {
                padding: 28px 20px;
            }
            
            .logo {
                width: 76px;
                height: 76px;
            }
            
            h1 {
                font-size: 28px;
                letter-spacing: 2px;
            }
            
            .features {
                gap: 12px;
            }
        }
        
        /* 大螢幕 */
        @media (min-width: 768px) {
            .container {
                padding: 50px 40px;
            }
            
            .logo {
                width: 120px;
                height: 120px;
            }
            
            h1 {
                font-size: 42px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="error-msg" class="error-msg"></div>
        
        <div id="login-content">
            <div class="logo-wrapper">
                <img src="/static/logo.jpg" alt="SELA" class="logo">
            </div>
            <h1>SELA</h1>
            <p class="subtitle"><span>樂透一路發</span> - 團購彩券系統</p>
            
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">👥</div>
                    <div class="feature-text">團購合買</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📊</div>
                    <div class="feature-text">透明分配</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🎯</div>
                    <div class="feature-text">自動對獎</div>
                </div>
            </div>
            
            <a href="/api/v1/auth/line" class="login-btn" id="login-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
                </svg>
                使用 LINE 登入
            </a>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">正在跳轉到 LINE 登入...</div>
        </div>
        
        <div class="footer">
            <p>© 2024 <span class="gecko">🦎</span> SELA 樂透一路發</p>
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const accessToken = urlParams.get('token');
        const error = urlParams.get('error');
        
        if (error) {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.textContent = '登入失敗:' + decodeURIComponent(error);
            errorMsg.style.display = 'block';
            window.history.replaceState({}, '', '/');
        }
        
        if (accessToken) {
            localStorage.setItem('access_token', accessToken);
            window.location.href = '/dashboard';
        }
        
        const token = localStorage.getItem('access_token');
        if (token && !error) {
            window.location.href = '/dashboard';
        }
        
        document.getElementById('login-btn').addEventListener('click', function(e) {
            document.getElementById('login-content').style.display = 'none';
            document.getElementById('loading').style.display = 'flex';
        });
    </script>
</body>
</html>
